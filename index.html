      },

      applyTestCheat(type) {
        const stats = this.getStats();
        if (type === "cash") {
          const boost = Math.max(100000, STATE.currencies.cash * 100);
          this.addCleanCash(boost);
        } else if (type === "dirty") {
          STATE.currencies.dirtyCash = stats.depotCapacity;
        } else if (type === "cred") {
          STATE.currencies.cred += 25;
        } else if (type === "favors") {
          STATE.currencies.favors += 15;
        } else if (type === "files") {
          STATE.currencies.files += 10;
          STATE.stats.filesEarnedTotal += 10;
        } else if (type === "contra") {
          STATE.currencies.drugs += 25;
          STATE.currencies.weapons += 25;
          STATE.currencies.stolen += 25;
          STATE.currencies.tickets += 25;
        } else if (type === "heat_up") {
          STATE.heat = Math.min(100, STATE.heat + 25);
        } else if (type === "heat_zero") {
          STATE.heat = 0;
          STATE.razziaCooldown = 0;
        }
        return true;
      },

      getEpochOwnedBizCount(epochId) {
        let count = 0;
        const bizList = KIEZ_API.getSortedCollection("BUSINESSES");
        for (let i = 0; i < bizList.length; i++) {
          const b = bizList[i];
          if (b.epochId === epochId && STATE.businesses[b.id] && STATE.businesses[b.id].level >= 1) {
            count += 1;
          }
        }
        return count;
      },

      isLogisticsUnlocked(lId) {
        const l = REGISTRY.LOGISTICS[lId];
        if (!l) return false;
        const st = STATE.logistics[lId];
        if (st && st.level >= 1) return true;
        if (!l.reqBizId) return true;
        const reqBiz = STATE.businesses[l.reqBizId];
        return Boolean(reqBiz && reqBiz.level >= (l.reqBizLv || 10));
      },

      isTurfUnlocked(tId) {
        const tf = REGISTRY.TURF[tId];
        if (!tf) return false;
        const st = STATE.turf[tId];
        if (st && st.level >= 1) return true;
        if (!tf.epochId) return true;
        return this.getEpochOwnedBizCount(tf.epochId) >= (tf.reqBizCount || 3);
      },

      toggleBusinessMode(bizId) {
        const st = STATE.businesses[bizId];
        if (!st || !st.unlocked) return false;
        st.mode = st.mode === "launder" ? "hustle" : "launder";
        return true;
      },

      toggleAllBusinessModes() {
        const sortedBiz = KIEZ_API.getSortedCollection("BUSINESSES");
        let hustleCount = 0;
        let launderCount = 0;
        for (let i = 0; i < sortedBiz.length; i++) {
          const st = STATE.businesses[sortedBiz[i].id];
          if (st && st.unlocked) {
            if (st.mode === "launder") launderCount++;
            else hustleCount++;
          }
        }
        const targetMode = hustleCount >= launderCount ? "launder" : "hustle";
        for (let i = 0; i < sortedBiz.length; i++) {
          const st = STATE.businesses[sortedBiz[i].id];
          if (st && st.unlocked) st.mode = targetMode;
        }
        return targetMode;
      },

      getCollectionProgress(collection) {
        const total = Object.keys(REGISTRY[collection] || {}).length;
        let owned = 0;
        if (collection === "ITEMS") {
          const keys = Object.keys(REGISTRY.ITEMS);
          for (let i = 0; i < keys.length; i++) {
            if (STATE.items[keys[i]] && STATE.items[keys[i]].owned) owned += 1;
          }
        } else if (collection === "BUSINESSES") {
          const keys = Object.keys(REGISTRY.BUSINESSES);
          for (let i = 0; i < keys.length; i++) {
            if (STATE.businesses[keys[i]] && STATE.businesses[keys[i]].level >= 1) owned += 1;
          }
        } else if (collection === "GANG") {
          const keys = Object.keys(REGISTRY.GANG);
          for (let i = 0; i < keys.length; i++) {
            if (STATE.gang[keys[i]] && STATE.gang[keys[i]].level >= 1) owned += 1;
          }
        }
        return { owned, total };
      },

      getBoardTaskStatus(taskId, statsSnapshot) {
        const cfg = REGISTRY.BOARD[taskId];
        const st = STATE.board[taskId];
        if (!cfg || !st) return { tier: 0, current: 0, target: 1, ready: false };

        const tier = st.tier || 0;
        let target = cfg.scaleMode === "mul"
          ? cfg.baseTarget * Math.pow(cfg.stepValue, tier)
          : cfg.baseTarget + tier * cfg.stepValue;

        let current = 0;
        let capMax = null;
        if (cfg.metricType === "clicks") {
          current = STATE.stats.totalClicks || 0;
        } else if (cfg.metricType === "total_level") {
          const keys = Object.keys(REGISTRY.BUSINESSES);
          for (let i = 0; i < keys.length; i++) {
            if (STATE.businesses[keys[i]]) current += STATE.businesses[keys[i]].level;
          }
        } else if (cfg.metricType === "owned_biz") {
          current = this.getCollectionProgress("BUSINESSES").owned;
          capMax = Object.keys(REGISTRY.BUSINESSES).length;
          target = Math.min(capMax, target);
        } else if (cfg.metricType === "cps") {
          const s = statsSnapshot || this.getStats();
          current = s.basePowerCps;
        } else if (cfg.metricType === "logistics_lv") {
          const lKeys = Object.keys(REGISTRY.LOGISTICS);
          let maxPossible = 0;
          for (let i = 0; i < lKeys.length; i++) {
            maxPossible += REGISTRY.LOGISTICS[lKeys[i]].maxLevel;
            if (STATE.logistics[lKeys[i]]) current += STATE.logistics[lKeys[i]].level;
          }
          capMax = maxPossible;
          target = Math.min(capMax, target);
        } else if (cfg.metricType === "items_owned") {
          const prog = this.getCollectionProgress("ITEMS");
          current = prog.owned;
          capMax = prog.total;
          target = Math.min(capMax, target);
        }

        let done = false;
        if (capMax !== null && tier > 0) {
          const prevRaw = cfg.scaleMode === "mul"
            ? cfg.baseTarget * Math.pow(cfg.stepValue, tier - 1)
            : cfg.baseTarget + (tier - 1) * cfg.stepValue;
          done = prevRaw >= capMax;
        }
        return { tier, current, target, ready: current >= target && !done, done };
      },

      checkAchievements() {
        if (!STATE.ach) STATE.ach = {};
        const out = [];
        for (const fam of ACH_FAMILIES) {
          const v = fam.val();
          for (let i = 0; i < fam.tiers.length; i++) {
            const id = fam.id + "_" + i;
            if (STATE.ach[id]) continue;
            const tr = fam.tiers[i];
            if (v < tr[0]) break;
            STATE.ach[id] = 1;
            STATE.currencies.favors += tr[1] || 0;
            STATE.currencies.cred += tr[2] || 0;
            STATE.currencies.files += tr[3] || 0;
            out.push({ fam, target: tr[0], favors: tr[1] || 0, cred: tr[2] || 0, files: tr[3] || 0 });
          }
        }
        return out;
      },

      claimBoardTask(taskId) {
        const cfg = REGISTRY.BOARD[taskId];
        const st = STATE.board[taskId];
        if (!cfg || !st) return false;
        if (!this.getBoardTaskStatus(taskId).ready) return false;
        st.tier += 1;
        STATE.currencies.favors += cfg.rewardFavors;
        STATE.currencies.cred += cfg.rewardCred;
        return true;
      },

      executeFavorOp(opType) {
        if (opType === "cool") {
          if (STATE.currencies.favors < 5) return false;
          STATE.currencies.favors -= 5;
          STATE.heat = Math.max(0, STATE.heat - 35);
          STATE.razziaCooldown = Math.max(STATE.razziaCooldown, 60 + this.getOfficeBonuses().shieldBonusSec);
          return true;
        }
        if (opType === "boost") {
          if (STATE.currencies.favors < 8) return false;
          STATE.currencies.favors -= 8;
          STATE.boostTimer = (STATE.boostTimer || 0) + 120;
          return true;
        }
        if (opType === "cash") {
          if (STATE.currencies.favors < 6) return false;
          STATE.currencies.favors -= 6;
          const stats = this.getStats();
          const drop = Math.max(1000, stats.totalPowerCps * 180);
          this.addCleanCash(drop);
          return true;
        }
        return false;
      },

      getEventOptionCost(optObj, statsSnapshot) {
        if (!optObj || !Number.isFinite(optObj.cleanCashSec) || optObj.cleanCashSec >= 0) return 0;
        const s = statsSnapshot || this.getStats();
        return Math.max(150, s.totalPowerCps * Math.abs(optObj.cleanCashSec));
      },

      canAffordEventOption(choice, statsSnapshot) {
        if (!STATE.activeEvent || !REGISTRY.EVENTS[STATE.activeEvent]) return false;
        const ev = REGISTRY.EVENTS[STATE.activeEvent];
        const opt = choice === "A" ? ev.optA : (choice === "B" ? ev.optB : null);
        if (!opt) return false;
        if (opt.costFavors && STATE.currencies.favors < opt.costFavors) return false;
        const cost = this.getEventOptionCost(opt, statsSnapshot);
        return cost <= 0 || STATE.currencies.cash >= cost;
      },

      dismissEvent() {
        if (!STATE.activeEvent) return false;
        STATE.activeEvent = null;
        STATE.eventCooldown = 240;
        return true;
      },

      resolveEvent(choice) {
        if (!STATE.activeEvent || !REGISTRY.EVENTS[STATE.activeEvent]) return false;
        const ev = REGISTRY.EVENTS[STATE.activeEvent];
        const opt = choice === "A" ? ev.optA : (choice === "B" ? ev.optB : null);
        if (!opt) return false;

        const stats = this.getStats();
        const cost = this.getEventOptionCost(opt, stats);
        if (cost > 0 && STATE.currencies.cash < cost) return false;

        if (opt.costFavors && STATE.currencies.favors < opt.costFavors) return false;
        if (opt.costFavors) STATE.currencies.favors -= opt.costFavors;
        if (cost > 0) {
          STATE.currencies.cash = Math.max(0, STATE.currencies.cash - cost);
        } else if (Number.isFinite(opt.cleanCashSec) && opt.cleanCashSec > 0) {
          this.addCleanCash(Math.max(250, stats.totalPowerCps * opt.cleanCashSec));
        }

        if (Number.isFinite(opt.dirtyCashSec) && opt.dirtyCashSec > 0) {
          this.addDirtyCash(Math.max(250, stats.totalPowerCps * opt.dirtyCashSec), stats.depotCapacity);
        }
        if (Number.isFinite(opt.favors) && opt.favors !== 0) {
          STATE.currencies.favors = Math.max(0, STATE.currencies.favors + opt.favors);
        }
        if (Number.isFinite(opt.heat) && opt.heat !== 0) {
          STATE.heat = Math.min(100, Math.max(0, STATE.heat + opt.heat));
        }
        if (Number.isFinite(opt.shieldSec) && opt.shieldSec > 0) {
          STATE.razziaCooldown = Math.max(STATE.razziaCooldown, opt.shieldSec + this.getOfficeBonuses().shieldBonusSec);
        }
        if (opt.boostSec > 0) STATE.boostTimer = (STATE.boostTimer || 0) + opt.boostSec;
        if (opt.cred) STATE.currencies.cred = (STATE.currencies.cred || 0) + opt.cred;
        for (const g of ["drugs", "weapons", "stolen", "tickets"]) if (opt[g] > 0) STATE.currencies[g] = (STATE.currencies[g] || 0) + opt[g];

        STATE.activeEvent = null;
        STATE.eventCooldown = 240;
        return true;
      },

      updateBossIdentity(newName, newCity) {
        STATE.boss.name = Platform.sanitizeText(newName, 22, STATE.boss.name || "Kowalski");
        STATE.boss.city = Platform.sanitizeText(newCity, 24, STATE.boss.city || "Berlin-Süd");
        return true;
      },

      updateUnlocks() {
        let changed = false;
        const sortedBiz = KIEZ_API.getSortedCollection("BUSINESSES");
        for (let i = 0; i < sortedBiz.length; i++) {
          const biz = sortedBiz[i];
          const st = STATE.businesses[biz.id];
          if (!st) continue;
          if (st.unlocked || st.level >= 1) {
            if (!st.unlocked) { st.unlocked = true; changed = true; }
            continue;
          }
          if (i === 0) { st.unlocked = true; changed = true; continue; }
          const cond = biz.unlockCondition || { mode: "PREV_IN_ORDER", minLevel: 25 };
          if (cond.mode === "PREV_IN_ORDER") {
            const prevState = STATE.businesses[sortedBiz[i - 1].id];
            if (prevState && prevState.level >= (cond.minLevel || 25)) {
              st.unlocked = true;
              changed = true;
            }
          }
        }
        return changed;
      },

      getReachedMilestonesCount(level) {
        let count = 0;
        for (let i = 0; i < MILESTONE_LEVELS.length; i++) {
          if (level >= MILESTONE_LEVELS[i]) count++;
        }
        return count;
      },

      getNextMilestoneInfo(level) {
        let prev = 0;
        for (let i = 0; i < MILESTONE_LEVELS.length; i++) {
          const target = MILESTONE_LEVELS[i];
          if (level < target) {
            const pct = Math.min(100, Math.max(0, ((level - prev) / (target - prev)) * 100));
            return { next: target, pct, isMax: false };
          }
          prev = target;
        }
        return { next: 200, pct: 100, isMax: true };
      },

      pupLocked(pupId) {
        const p = REGISTRY.PRESTIGE_UPGRADES[pupId];
        if (!p || !p.req) return false;
        const lv = (STATE.prestigeUpgrades[p.req[0]] && STATE.prestigeUpgrades[p.req[0]].level) || 0;
        return lv < p.req[1];
      },

      getPrestigeUpgradeCost(pupId) {
        const p = REGISTRY.PRESTIGE_UPGRADES[pupId];
        const st = STATE.prestigeUpgrades[pupId];
        if (!p || !st || st.level >= p.maxLevel) return Infinity;
        return p.baseFileCost + st.level * p.costStep;
      },

      buyPrestigeUpgrade(pupId) {
        const p = REGISTRY.PRESTIGE_UPGRADES[pupId];
        const st = STATE.prestigeUpgrades[pupId];
        if (!p || !st || st.level >= p.maxLevel || this.pupLocked(pupId)) return false;
        const cost = this.getPrestigeUpgradeCost(pupId);
        if (!Number.isFinite(cost) || STATE.currencies.files < cost) return false;
        STATE.currencies.files = Math.max(0, STATE.currencies.files - cost);

        return true;

        const sortedPup = KIEZ_API.getSortedCollection("PRESTIGE_UPGRADES");

          else if (p.effectType === "global_income") globalIncomeAdd += lv * p.effectValue;

        return { startCashBonus, heatDecayBonus, pupIncomeMul: 1 + globalIncomeAdd, costDiscount, clickMul: 1 + clickMulAdd, depotAdd, washMul: 1 + washAdd, offlineAdd, sprintSub, coupAdd, auditMul: Math.max(0.2, 1 - auditCut) };

      setProgress(set) { return set.items.filter(id => STATE.items[id] && STATE.items[id].owned).length; },
      getItemBonuses() {
        let globalIncomeAdd = 0, heatDecayBonus = 0, passiveHeatPenalty = 0;

          const it = sortedItems[i];

          if (!st || !st.owned) continue;
          if (it.effectType === "starter_knife") { clickPowerAdd += it.effectValue; globalMissionChanceAdd += it.secondaryValue; }
          else if (it.effectType === "global_income") globalIncomeAdd += it.effectValue;

            for (let e = 0; e < it.targetEpochs.length; e++) {

              if (epochMulMap[ep] !== undefined) epochMulMap[ep] *= (1 + it.effectValue);
            }
          } else if (it.effectType === "heat_decay") heatDecayBonus += it.effectValue;
          else if (it.effectType === "cost_discount") costDiscount += it.effectValue;
          else if (it.effectType === "click_power") clickPowerAdd += it.effectValue;
          else if (it.effectType === "raid_chance") raidChanceAdd += it.effectValue;
          else if (it.effectType === "market_bonus") marketBonusAdd += it.effectValue;
          else if (it.effectType === "race_gear") { missionSpeedAdd += it.effectValue; raceChanceAdd += it.secondaryValue; }
          else if (it.effectType === "mission_stealth") missionHeatFactor *= (1 - it.effectValue);
          else if (it.effectType === "hybrid_heat") { heatDecayBonus += it.effectValue; globalIncomeAdd += it.secondaryValue; }
          else if (it.effectType === "hybrid_master") { globalIncomeAdd += it.effectValue; costDiscount += it.secondaryValue; }

          else if (it.effectType === "sniper_trade") { sniperChanceAdd += it.effectValue; passiveHeatPenalty += it.secondaryValue; }
          else if (it.effectType === "prosecutor_trade") { heatDecayBonus += it.effectValue; globalIncomeAdd -= it.secondaryValue; }
          else if (it.effectType === "vault_trade") { depotMulAdd += it.effectValue; raidShieldAdd += 0.12; washSpeedMul *= (1 - it.secondaryValue); }
        }
        for (const set of this.ITEM_SETS) {

      canAffordItem(itemId) {
        const it = REGISTRY.ITEMS[itemId];

        if (!it || !st || st.owned) return false;

        const it = REGISTRY.ITEMS[itemId];
        const st = STATE.items[itemId];
        if (!it || !st || st.owned || !this.canAffordItem(itemId)) return false;
        STATE.currencies[it.currency] = Math.max(0, STATE.currencies[it.currency] - it.cost);
        st.owned = true;
        return true;
      },

      getBusinessCostMultiplier(bizId) {
        const st = STATE.businesses[bizId];
        const gangBoni = this.getGangBonuses();
        const itemBoni = this.getItemBonuses();
        const pupBoni = this.getPrestigeUpgradeBonuses();
        const offBoni = this.getOfficeBonuses();

        let discount = gangBoni.costDiscount + itemBoni.costDiscount + pupBoni.costDiscount + offBoni.costDiscount;
        if (st && st.branch === "B") discount += 0.15;
        const penalty = gangBoni.costPenalty + itemBoni.costPenalty;
        const netFactor = 1 - discount + penalty;
        return Math.min(1.25, Math.max(0.10, netFactor));
      },

      getEffectiveBaseCost(bizId) {
        const cfg = REGISTRY.BUSINESSES[bizId];
        if (!cfg) return Infinity;
        return cfg.baseCost * this.getBusinessCostMultiplier(bizId);
      },

      calcBuyCost(bizId, currentLevel, k) {
        const cfg = REGISTRY.BUSINESSES[bizId];
        if (!cfg || !Number.isFinite(k) || k <= 0) return 0;
        const n = Math.max(0, Math.floor(currentLevel));
        const count = Math.min(10000, Math.floor(k));
        const g = cfg.g;
        const bEff = this.getEffectiveBaseCost(bizId);
        const cost = bEff * Math.pow(g, n) * (Math.pow(g, count) - 1) / (g - 1);
        return Number.isFinite(cost) ? cost : Infinity;
      },

      calcMaxBuy(bizId, currentLevel, availableCash) {
        const cfg = REGISTRY.BUSINESSES[bizId];
        if (!cfg || !Number.isFinite(availableCash) || availableCash <= 0) return 0;
        const n = Math.max(0, Math.floor(currentLevel));
        const g = cfg.g;
        const bEff = this.getEffectiveBaseCost(bizId);
        const denom = bEff * Math.pow(g, n);
        if (!Number.isFinite(denom) || denom <= 0) return 0;
        const inner = 1 + (availableCash * (g - 1)) / denom;
        if (!Number.isFinite(inner) || inner <= 1) return 0;
        let k = Math.min(10000, Math.max(0, Math.floor(Math.log(inner) / Math.log(g))));
        while (k > 0 && (!Number.isFinite(this.calcBuyCost(bizId, n, k)) || this.calcBuyCost(bizId, n, k) > availableCash)) {
          k -= 1;
        }
        return k;
      },

      nextGoal() {

          const st = STATE.businesses[sorted[i].id];
          if (st && st.unlocked && (st.level || 0) < 1) return { kind: "buy", id: sorted[i].id, cost: this.calcBuyCost(sorted[i].id, 0, 1) };
        }
        for (let i = 1; i < sorted.length; i++) {
          const st = STATE.businesses[sorted[i].id];
          if (!st || st.unlocked || (st.level || 0) >= 1) continue;
          const cond = sorted[i].unlockCondition || { mode: "PREV_IN_ORDER", minLevel: 25 };
          if (cond.mode !== "PREV_IN_ORDER") continue;
          const prev = sorted[i - 1], ps = STATE.businesses[prev.id], min = cond.minLevel || 25;
          if (ps && (ps.level || 0) < min) return { kind: "unlock", id: sorted[i].id, prevId: prev.id, lvl: ps.level || 0, min, cost: this.calcBuyCost(prev.id, ps.level || 0, min - (ps.level || 0)) };
        }
        { const T = STATE.ui && STATE.ui.tabs; const nu = T && TAB_UNLOCK.find(u => !T[u.k]); if (nu) { const have = COACH_Q.totalLevels(); return { kind: "tab", key: nu.k, have: Math.min(have, nu.lv), need: nu.lv }; } }
        const claim = this.getClaimableFiles();
        if (claim >= 1) return { kind: "prestige", n: claim };
        let best = null;
        for (let i = 0; i < sorted.length; i++) {
          const st = STATE.businesses[sorted[i].id];
          if (!st || !st.unlocked || (st.level || 0) < 1) continue;
          const c = this.calcBuyCost(sorted[i].id, st.level, 1);
          if (Number.isFinite(c) && (!best || c < best.cost)) best = { kind: "up", id: sorted[i].id, lvl: st.level, cost: c };
        }
        return best;
      },

      heatFee() { const h = STATE.heat || 0; return h >= 75 ? 0.10 : (h >= 60 ? 0.05 : 0); },
      heatCoupMalus() { return Math.max(0, Math.min(1, ((STATE.heat || 0) - 40) / 45)) * 0.15; },
      heatHustleMul() { return 1 + Math.max(0, Math.min(1, ((STATE.heat || 0) - 40) / 45)) * 0.20; },
      heatWashMul() { const h = STATE.heat || 0; return h >= 75 ? 0.85 : (h >= 60 ? 0.92 : 1); },
      dirtyLocked() { return !!STATE.dirtyLock; },
      updateDirtyLock() {
        const h = STATE.heat || 0;
        if (!STATE.dirtyLock && h >= 75) STATE.dirtyLock = true;
        else if (STATE.dirtyLock && h < 65) STATE.dirtyLock = false;
      },

      getDualPurchaseQuotes(bizId) {
        const q = this._dualQuotes(bizId);
        if (q && q.dirty && this.dirtyLocked()) q.dirty.canAfford = false;
        return q;
      },

      _dualQuotes(bizId) {
        const st = STATE.businesses[bizId];
        const STREET_MUL = 2.5;
        if (!st) {
          return {
            clean: { count: 1, cost: Infinity, canAfford: false },
            dirty: { count: 1, cost: Infinity, canAfford: false }
          };
        }

        const mode = STATE.ui.buyMode;
        const cleanCash = STATE.currencies.cash;
        const dirtyCash = STATE.currencies.dirtyCash || 0;

        if (mode === "1" || mode === "10") {
          const cnt = mode === "10" ? 10 : 1;
          const cleanCost = this.calcBuyCost(bizId, st.level, cnt);
          const dirtyCost = cleanCost * STREET_MUL;
          return {
            clean: { count: cnt, cost: cleanCost, canAfford: cleanCash >= cleanCost },
            dirty: { count: cnt, cost: dirtyCost, canAfford: dirtyCash >= dirtyCost }
          };
        }

        const kClean = this.calcMaxBuy(bizId, st.level, cleanCash);
        const cleanCount = Math.max(1, kClean);
        const cleanCost = this.calcBuyCost(bizId, st.level, cleanCount);

        const kDirty = this.calcMaxBuy(bizId, st.level, dirtyCash / STREET_MUL);
        const dirtyCount = Math.max(1, kDirty);
        const dirtyCost = this.calcBuyCost(bizId, st.level, dirtyCount) * STREET_MUL;

        return {
          clean: { count: cleanCount, cost: cleanCost, canAfford: kClean >= 1 },
          dirty: { count: dirtyCount, cost: dirtyCost, canAfford: kDirty >= 1 }
        };
      },

      buyBusiness(bizId, payWith = "cash") {
        const st = STATE.businesses[bizId];
        if (!st || !st.unlocked) return { ok: false };
        const dual = this.getDualPurchaseQuotes(bizId);
        const isDirty = payWith === "dirtyCash";
        const quote = isDirty ? dual.dirty : dual.clean;

        if (!quote.canAfford || quote.count < 1 || !Number.isFinite(quote.cost)) return { ok: false };

        const prevLevel = st.level;
        if (isDirty) {
          STATE.currencies.dirtyCash = Math.max(0, (STATE.currencies.dirtyCash || 0) - quote.cost);
          STATE.heat = Math.min(100, STATE.heat + 3.5 * Math.min(4, Math.sqrt(quote.count)));
        } else {
          STATE.currencies.cash = Math.max(0, STATE.currencies.cash - quote.cost);
        }

        st.level += quote.count;
        st.unlocked = true;

        let milestoneHit = 0;
        const reachedCount = this.getReachedMilestonesCount(st.level);
        if (reachedCount > (st.milestonesClaimed || 0)) {
          const newlyEarned = reachedCount - (st.milestonesClaimed || 0);
          STATE.currencies.cred += newlyEarned;
          st.milestonesClaimed = reachedCount;
          milestoneHit = newlyEarned;
        }

        const unlockedNew = this.updateUnlocks();
        this.ensureMissionBoard();
        const crossed25 = prevLevel < 25 && st.level >= 25;
        return {
          ok: true,
          milestone: milestoneHit,
          bought: quote.count,
          structuralChange: unlockedNew || crossed25 || prevLevel === 0
        };
      },

      getLogisticsCost(lId) {
        const l = REGISTRY.LOGISTICS[lId];
        const st = STATE.logistics[lId];
        if (!l || !st || st.level >= l.maxLevel) return Infinity;
        return l.baseCost * Math.pow(l.costGrowth, st.level);
      },

      buyLogistics(lId) {
        const l = REGISTRY.LOGISTICS[lId];
        const st = STATE.logistics[lId];
        if (!l || !st || !this.isLogisticsUnlocked(lId) || st.level >= l.maxLevel) return false;
        const cost = this.getLogisticsCost(lId);
        if (!Number.isFinite(cost) || STATE.currencies.cash < cost) return false;
        STATE.currencies.cash = Math.max(0, STATE.currencies.cash - cost);
        st.level += 1;
        this.ensureMissionBoard();
        return true;
      },

      getTurfCost(tId) {
        const tf = REGISTRY.TURF[tId];
        const st = STATE.turf[tId];
        if (!tf || !st || st.level >= tf.maxLevel) return Infinity;
        return tf.baseCost * Math.pow(tf.costGrowth, st.level);
      },

      buyTurf(tId) {
        const tf = REGISTRY.TURF[tId];
        const st = STATE.turf[tId];
        if (!tf || !st || !this.isTurfUnlocked(tId) || st.level >= tf.maxLevel) return false;
        const cost = this.getTurfCost(tId);
        if (!Number.isFinite(cost) || STATE.currencies.cash < cost) return false;
        STATE.currencies.cash = Math.max(0, STATE.currencies.cash - cost);
        st.level += 1;
        this.ensureMissionBoard();
        return true;
      },

      getGangCost(cId) {
        const c = REGISTRY.GANG[cId];
        const st = STATE.gang[cId];
        if (!c || !st || st.level >= c.maxLevel) return Infinity;
        return c.baseCredCost + st.level * c.costStep;
      },

      hireGang(cId) {
        const c = REGISTRY.GANG[cId];
        const st = STATE.gang[cId];
        if (!c || !st || !this.isGangUnlocked(cId) || st.level >= c.maxLevel) return false;
        const cost = this.getGangCost(cId);
        if (!Number.isFinite(cost) || STATE.currencies.cred < cost) return false;
        STATE.currencies.cred = Math.max(0, STATE.currencies.cred - cost);
        st.level += 1;
        this.ensureMissionBoard();
        return true;
      },

      getManagerCost(bizId) {
        const sorted = KIEZ_API.getSortedCollection("BUSINESSES");
        const idx = sorted.findIndex(b => b.id === bizId);
        if (idx < 0) return Infinity;
        return Math.ceil(MANAGER_BASE_COST * Math.pow(MANAGER_COST_GROWTH, idx));
      },

      hireManager(bizId) {
        const st = STATE.businesses[bizId];
        if (!st || !st.unlocked) return false;
        if (STATE.managers[bizId] && STATE.managers[bizId].hired) return false;
        const cost = this.getManagerCost(bizId);
        if (!Number.isFinite(cost) || STATE.currencies.files < cost) return false;
        STATE.currencies.files = Math.max(0, STATE.currencies.files - cost);
        STATE.managers[bizId] = { hired: true, target: 0 };
        return true;
      },

      getAffordableManagersSummary() {
        const sorted = KIEZ_API.getSortedCollection("BUSINESSES");
        let count = 0;
        let totalCost = 0;
        let remFiles = STATE.currencies.files || 0;
        for (let i = 0; i < sorted.length; i++) {
          const b = sorted[i];
          const st = STATE.businesses[b.id];
          if (!st || !st.unlocked) continue;
          if (STATE.managers[b.id] && STATE.managers[b.id].hired) continue;
          const cost = this.getManagerCost(b.id);
          if (remFiles >= cost) {
            remFiles -= cost;
            totalCost += cost;
            count += 1;
          }
        }
        return { count, totalCost };
      },

      hireAllAffordableManagers() {
        const sorted = KIEZ_API.getSortedCollection("BUSINESSES");
        let hiredCount = 0;
        for (let i = 0; i < sorted.length; i++) {
          const b = sorted[i];
          if (this.hireManager(b.id)) hiredCount += 1;
        }
        return hiredCount;
      },

      cycleManagerTarget(bizId) {
        const m = STATE.managers[bizId];
        if (!m || !m.hired) return false;
        const i = MANAGER_TARGETS.indexOf(m.target);
        m.target = MANAGER_TARGETS[(i + 1) % MANAGER_TARGETS.length];
        return true;
      },

      runManagers(dt) {
        const res = { bought: 0, structural: false };
        if (!STATE.managers) return res;
        this.managerAcc = (this.managerAcc || 0) + dt;
        if (this.managerAcc < MANAGER_INTERVAL) return res;
        this.managerAcc = 0;
        const sorted = KIEZ_API.getSortedCollection("BUSINESSES");
        for (let i = 0; i < sorted.length; i++) {
          const b = sorted[i];
          const m = STATE.managers[b.id];
          const st = STATE.businesses[b.id];
          if (!m || !m.hired || !st || !st.unlocked) continue;
          for (let n = 0; n < MANAGER_MAX_STEPS; n++) {
            if (m.target > 0 && st.level >= m.target) break;
            if (st.level >= 25 && !st.branch) break;
            const cost = this.calcBuyCost(b.id, st.level, 1);
            if (!Number.isFinite(cost) || cost <= 0) break;
            const limit = st.level === 0 ? STATE.currencies.cash : STATE.currencies.cash * MANAGER_BUDGET;
            if (cost > limit) break;
            STATE.currencies.cash = Math.max(0, STATE.currencies.cash - cost);
            const prev = st.level;
            st.level += 1;
            const reached = this.getReachedMilestonesCount(st.level);
            if (reached > (st.milestonesClaimed || 0)) {
              STATE.currencies.cred += reached - (st.milestonesClaimed || 0);
              st.milestonesClaimed = reached;
            }
            res.bought += 1;
            if (prev === 0 || (prev < 25 && st.level >= 25)) res.structural = true;
          }
        }
        if (res.bought > 0 && this.updateUnlocks()) res.structural = true;
        return res;
      },

      getHustleMultiplier() {
        const combo = STATE.hustleCombo || 0;
        if (combo >= 6) return 4.0;
        if (combo >= 3) return 2.0;
        return 1.0;
      },

      getAffordabilitySignature(tabKey) {
        const ids = [];
        if (tabKey === "businesses") {
          const list = KIEZ_API.getSortedCollection("BUSINESSES");
          for (let i = 0; i < list.length; i++) {
            const st = STATE.businesses[list[i].id];
            if (st && st.unlocked && st.level === 0) ids.push(list[i].id);
          }
        } else if (tabKey === "logistics") {
          const list = KIEZ_API.getSortedCollection("LOGISTICS");
          for (let i = 0; i < list.length; i++) {
            const l = list[i];
            const st = STATE.logistics[l.id];
            if (st && this.isLogisticsUnlocked(l.id) && st.level < l.maxLevel && STATE.currencies.cash >= this.getLogisticsCost(l.id)) {
              ids.push(`${l.id}:${st.level}`);
            }
          }
        } else if (tabKey === "turf") {
          const list = KIEZ_API.getSortedCollection("TURF");
          for (let i = 0; i < list.length; i++) {
            const tf = list[i];
            const st = STATE.turf[tf.id];
            if (st && this.isTurfUnlocked(tf.id) && st.level < tf.maxLevel && STATE.currencies.cash >= this.getTurfCost(tf.id)) {
              ids.push(`${tf.id}:${st.level}`);
            }
          }
        } else if (tabKey === "cartel") {
          const gList = KIEZ_API.getSortedCollection("GANG");
          for (let i = 0; i < gList.length; i++) {
            const c = gList[i];
            const st = STATE.gang[c.id];
            if (st && this.isGangUnlocked(c.id) && st.level < c.maxLevel && STATE.currencies.cred >= this.getGangCost(c.id)) ids.push(`${c.id}:${st.level}`);
          }
          const iList = KIEZ_API.getSortedCollection("ITEMS");
          for (let i = 0; i < iList.length; i++) {
            if (this.canAffordItem(iList[i].id)) ids.push(iList[i].id);
          }
        }
        return ids.join("|");
      },

      markTabSeen(tabKey) {
        if (STATE.ui.seenSignatures[tabKey] !== undefined) {
          STATE.ui.seenSignatures[tabKey] = this.getAffordabilitySignature(tabKey);
        }
      },

      evaluateTabBadges() {
        const activeTab = STATE.ui.activeTab;
        if (STATE.ui.seenSignatures[activeTab] !== undefined) {
          this.markTabSeen(activeTab);
        }

        const checkNewDot = (key) => {
          const sig = this.getAffordabilitySignature(key);
          if (!sig) {
            STATE.ui.seenSignatures[key] = "";
            return "none";
          }
          if (activeTab === key) return "none";
          return STATE.ui.seenSignatures[key] !== sig ? "new" : "none";
        };

        let bizUrgent = false;
        const bizList = KIEZ_API.getSortedCollection("BUSINESSES");
        for (let i = 0; i < bizList.length; i++) {
          const st = STATE.businesses[bizList[i].id];
          if (st && st.level >= 25 && !st.branch) { bizUrgent = true; break; }
        }
        const bizBadge = (bizUrgent && activeTab !== "businesses") ? "urgent" : checkNewDot("businesses");

        let hqUrgent = Boolean((STATE.activeMission && STATE.activeMission.remainingSec <= 0) || STATE.pendingBribe);
        if (!hqUrgent) {
          const statsSnap = this.getStats();
          const boardList = KIEZ_API.getSortedCollection("BOARD");
          for (let i = 0; i < boardList.length; i++) {
            if (this.getBoardTaskStatus(boardList[i].id, statsSnap).ready) { hqUrgent = true; break; }
          }
        }
        if (!hqUrgent && this.getClaimableFiles() >= 1) {
          hqUrgent = true;
        }

        const turfOcc = (this.turfOccList ? this.turfOccList() : []).length > 0;
        const turfBadge = (turfOcc && activeTab !== "turf") ? "urgent" : checkNewDot("turf");

        return {
          businesses: bizBadge,
          logistics: checkNewDot("logistics"),
          turf: turfBadge,
          cartel: (activeTab !== "cartel" && STATE.social && ((STATE.social.inbox && STATE.social.inbox.some(e => !e.opened)) || (Online.st.req && Online.st.req.length) || (Online.st.goal && Online.st.goal.claimable))) ? "urgent" : checkNewDot("cartel"),
          hq: hqUrgent && activeTab !== "hq" ? "urgent" : "none"
        };
      },

        try {
          const so = STATE.social;
          if (so && so.inbox && so.inbox.some(e => !e.opened)) {
            const e = so.inbox.find(x => !x.opened);
            out.unshift({ kind: "live", key: "pkg", tag: L("PÄCKCHEN", "PACKAGE"), text: L(`Funkspruch: Ein Päckchen von ${e.name} wartet im Kartell. Wer weiß, was drin ist.`, `Radio message: a package from ${e.name} is waiting in the cartel. Who knows what's inside.`) });
          }
          const rv = so && so.rivals ? Object.values(so.rivals) : [];
          if (rv.length) {
            const r = rv[bucket % rv.length];
            const mine = STATE.stats.lifetimeRevenue || 0;
            const ahead = (r.rev || 0) > mine;
            out.push({ kind: "city", key: "rival", tag: L("FREUND", "FRIEND"), text: L(
              `${r.name}${r.city ? " aus " + r.city : ""} ${ahead ? "liegt im Umsatz vor dir (" + formatNumber(r.rev || 0) + " €). Das lässt du dir nicht gefallen." : "liegt hinter dir (" + formatNumber(r.rev || 0) + " €). Noch."}`,
              `${r.name}${r.city ? " from " + r.city : ""} ${ahead ? "is ahead of you in revenue (" + formatNumber(r.rev || 0) + " €). You won't stand for that." : "is behind you (" + formatNumber(r.rev || 0) + " €). For now."}`) });
          }
        } catch (e) {}
        return out;
      },

      getRadioSig() {
        return this.getRadioNews().filter(n => n.kind !== "city" && !(n.kind === "heat" && n.key === "heat:0")).map(n => n.key).join("|");
      },

      radioUnread() {
        const sig = this.getRadioSig();
        return !!sig && sig !== ((STATE.ui && STATE.ui.radioSeen) || "");
      },

      getSubSig(key) {
        const ids = [];
        if (key === "cartel:crew") {
          const gList = KIEZ_API.getSortedCollection("GANG");
          for (let i = 0; i < gList.length; i++) {
            const c = gList[i];
            const st = STATE.gang[c.id];
            if (st && this.isGangUnlocked(c.id) && st.level < c.maxLevel && STATE.currencies.cred >= this.getGangCost(c.id)) ids.push(`${c.id}:${st.level}`);
          }
        } else if (key === "cartel:ware") {
          const iList = KIEZ_API.getSortedCollection("ITEMS");
          for (let i = 0; i < iList.length; i++) {
            if (this.canAffordItem(iList[i].id)) ids.push(iList[i].id);
          }
        }
        return ids.join("|");
      },

      evaluateSubBadges() {
        const res = {};
        const ui = STATE.ui;
        if (!ui.seenSignatures) ui.seenSignatures = {};
        const cartelOn = ui.activeTab === "cartel";
        ["crew", "ware"].forEach(sub => {
          const key = "cartel:" + sub;
          const sig = this.getSubSig(key);
          if (cartelOn && (ui.cartelSubTab || "crew") === sub) ui.seenSignatures[key] = sig;
          if (!sig) { ui.seenSignatures[key] = ""; res[key] = "none"; return; }
          res[key] = ui.seenSignatures[key] !== sig ? "new" : "none";
        });
        const missionDone = Boolean(STATE.activeMission && STATE.activeMission.remainingSec <= 0) || Boolean(STATE.pendingBribe);
        let boardReady = false;
        const statsSnap = this.getStats();
        const boardList = KIEZ_API.getSortedCollection("BOARD");
        for (let i = 0; i < boardList.length; i++) {
          if (this.getBoardTaskStatus(boardList[i].id, statsSnap).ready) { boardReady = true; break; }
        }
        res["hq:coups"] = missionDone ? "urgent" : "none";
        res["hq:milestones"] = (boardReady || this.weekReady()) ? "urgent" : "none";
        res["hq:vault"] = this.getClaimableFiles() >= 1 ? "urgent" : "none";
        return res;
      },

      getCartelNetSummary() {
        const gangBoni = this.getGangBonuses();
        const itemBoni = this.getItemBonuses();
        const netIncomePct = Math.round((gangBoni.gangIncomeMul * itemBoni.itemGlobalIncomeMul - 1) * 100);
        const netCostPct = Math.round((-gangBoni.costDiscount - itemBoni.costDiscount + gangBoni.costPenalty + itemBoni.costPenalty) * 100);
        const netHeatRate = Math.min(0.35, gangBoni.passiveHeatPenalty + itemBoni.passiveHeatPenalty) - (gangBoni.heatDecayBonus + itemBoni.heatDecayBonus);
        return { netIncomePct, netCostPct, netHeatRate };
      },

      getStats() {
        const sortedBiz = KIEZ_API.getSortedCollection("BUSINESSES");
        const supplyAddMap = {};
        const supplyMulMap = {};

        for (let i = 0; i < sortedBiz.length; i++) {
          const b = sortedBiz[i];
          supplyAddMap[b.id] = 0;
          supplyMulMap[b.id] = 1;
        }

        const logBoni = this.getLogisticsBonuses();
        const turfBoni = this.getTurfBonuses();
        const offBoni = this.getOfficeBonuses();

        for (let i = 0; i < sortedBiz.length; i++) {
          const b = sortedBiz[i];
          const st = STATE.businesses[b.id];
          if (st && st.level >= 1 && b.supplyTargetId && REGISTRY.BUSINESSES[b.supplyTargetId]) {
            if (b.supplyBonusType === "add") {
              supplyAddMap[b.supplyTargetId] += (b.supplyBonusValue / 100);
            } else if (b.supplyBonusType === "mul") {
              supplyMulMap[b.supplyTargetId] *= b.supplyBonusValue;
            }
          }
        }

        const gangBoni = this.getGangBonuses();
        const itemBoni = this.getItemBonuses();
        const pupBoni = this.getPrestigeUpgradeBonuses();
        const prestigeMul = prestigeMulFromFiles(STATE.stats.filesEarnedTotal);
        const radarPenalty = this.heatHustleMul();
        const favorBoostMul = STATE.boostTimer > 0 ? 2.0 : 1.0;

        const baseGlobalMul = prestigeMul * pupBoni.pupIncomeMul * gangBoni.gangIncomeMul * itemBoni.itemGlobalIncomeMul * offBoni.officeIncomeMul;

        let basePowerCps = 0;
        let totalPowerCps = 0;
        let grossDirtyCps = 0;
        let rawWashCapacityCps = 0;
        let heatGainPerSec = 0;
        let launderCoolPerSec = 0;
        let hotWeight = 0;
        let sumLevels = 0;
        let coolWeight = 0;
        let bdA0 = 0, bdA1 = 0, bdA2 = 0, bdA3 = 0;
        const bizPower = {};

        for (let i = 0; i < sortedBiz.length; i++) {
          const b = sortedBiz[i];
          const st = STATE.businesses[b.id];
          if (!st || st.level < 1 || (STATE.inspector && STATE.inspector.biz === b.id)) {
            bizPower[b.id] = 0;
            continue;
          }
          const milestones = this.getReachedMilestonesCount(st.level);
          const milestoneMul = Math.pow(2, milestones);
          const supplyMul = (1 + supplyAddMap[b.id]) * supplyMulMap[b.id];
          const branchIncomeMul = st.branch === "A" ? 1.5 : 1.0;
          const epochItemMul = itemBoni.epochMulMap[b.epochId] || 1;
          const epochTurfMul = turfBoni.epochTurfMul[b.epochId] || 1;

          const baseP = b.baseIncome * st.level * milestoneMul * supplyMul * branchIncomeMul * epochItemMul * epochTurfMul * baseGlobalMul;
          const _lv = b.baseIncome * st.level;
          bdA0 += _lv; bdA1 += _lv * milestoneMul; bdA2 += _lv * milestoneMul * supplyMul * branchIncomeMul;
          bdA3 += _lv * milestoneMul * supplyMul * branchIncomeMul * epochItemMul * epochTurfMul;
          const power = baseP * (st.mode === "launder" ? 1 : radarPenalty) * favorBoostMul;
          const safePower = Number.isFinite(power) ? power : 0;
          bizPower[b.id] = safePower;
          sumLevels += st.level;
          basePowerCps += Number.isFinite(baseP) ? baseP : 0;
          totalPowerCps += safePower;

          const branchHeatFactor = st.branch === "B" ? 0.75 : 1.0;
          const effHeatMul = b.heatMul * branchHeatFactor;

          if (st.mode === "launder") {
            grossDirtyCps += safePower * 0.45;
            rawWashCapacityCps += safePower * 1.20;
            coolWeight += safePower;
          } else {
            grossDirtyCps += safePower;
            hotWeight += safePower * effHeatMul;
          }
        }

        let washFallback = false;
        if (rawWashCapacityCps <= 0 && grossDirtyCps > 0) { rawWashCapacityCps = grossDirtyCps * 0.25; washFallback = true; }
        if (totalPowerCps > 0) {
          const sizeFactor = sumLevels / (sumLevels + HEAT_SIZE_K);
          heatGainPerSec = HEAT_K_UP * sizeFactor * (hotWeight / totalPowerCps);
          launderCoolPerSec = HEAT_K_COOL * sizeFactor * (coolWeight / totalPowerCps);
        }
        let washMulAll = logBoni.washSpeedMul * itemBoni.washSpeedMul * pupBoni.washMul;
        // Ohne Tarnung-Betriebe bleibt die Wäsche der Engpass: Boni wirken nur abgeschwächt (max. ca. 95 % des Schwarzgelds)
        if (washFallback) washMulAll = 1 + Math.max(0, washMulAll - 1) * 0.35;
        const washCapacityCps = rawWashCapacityCps * washMulAll;

        const totalDepotMul = logBoni.depotMultiplier + offBoni.depotMulAdd + itemBoni.depotMulAdd + pupBoni.depotAdd;
        const depotCapacity = Math.max(1000, (1000 + totalPowerCps * 30) * totalDepotMul);
        const dirtyRatio = depotCapacity > 0 ? ((STATE.currencies.dirtyCash || 0) / depotCapacity) : 0;
        const overflowHeat = dirtyRatio >= 0.99 ? 0.85 : (dirtyRatio >= 0.80 ? 0.35 : 0);

        const dirtyStock = STATE.currencies.dirtyCash || 0;
        const sustainableWashDirty = dirtyStock > washCapacityCps * 0.5
          ? washCapacityCps
          : Math.min(washCapacityCps, grossDirtyCps + dirtyStock);
        const cleanIncomeCps = sustainableWashDirty * logBoni.washEfficiency * this.heatWashMul();

        const cappedPassiveHeatPenalty = Math.min(0.35, (gangBoni.passiveHeatPenalty || 0) + (itemBoni.passiveHeatPenalty || 0));
        const heatDecayPerSec = 0.03 + 0.0025 * STATE.heat + launderCoolPerSec + logBoni.heatDecayBonus + turfBoni.heatDecayBonus + gangBoni.heatDecayBonus + itemBoni.heatDecayBonus + pupBoni.heatDecayBonus + offBoni.heatDecayBonus;
        const heatNetRaw = (heatGainPerSec + overflowHeat + cappedPassiveHeatPenalty) - heatDecayPerSec;
        const heatNetPerSec = heatNetRaw < 0 ? heatNetRaw * HEAT_FALL_MUL : heatNetRaw;

        const comboMul = this.getHustleMultiplier();
        const clickExtras = (1 + (gangBoni.razziaShield * 2.5)) * itemBoni.clickPowerMul * pupBoni.clickMul * turfBoni.turfClickMul * offBoni.clickMul * gangBoni.gangClickMul;
        const clickDamp = clickExtras > 1 ? Math.sqrt(clickExtras) / clickExtras : 1;   // stacked tap boosts count only by their square root
        const clickBonusMul = clickExtras * clickDamp * comboMul;
        const clickValue = (2.5 + totalPowerCps * CLICK_POWER_SHARE) * clickBonusMul;

        const _baseDecay = 0.03 + 0.0025 * STATE.heat;
        const bd = {
          a0: bdA0, a1: bdA1, a2: bdA2, a3: bdA3,
          prestige: prestigeMul, pup: pupBoni.pupIncomeMul, gang: gangBoni.gangIncomeMul, item: itemBoni.itemGlobalIncomeMul, office: offBoni.officeIncomeMul,
          radar: radarPenalty, favor: favorBoostMul,
          heatLoad: heatGainPerSec, overflow: overflowHeat, passive: cappedPassiveHeatPenalty,
          launderCool: launderCoolPerSec, baseDecay: _baseDecay, infra: heatDecayPerSec - _baseDecay - launderCoolPerSec,
          fallMul: heatNetRaw < 0 ? HEAT_FALL_MUL : 1,
          clickBase: 2.5 + totalPowerCps * CLICK_POWER_SHARE, combo: comboMul, clickItem: itemBoni.clickPowerMul, clickPup: pupBoni.clickMul,
          clickTurf: turfBoni.turfClickMul, clickOffice: offBoni.clickMul, clickGang: gangBoni.gangClickMul, clickShield: (1 + gangBoni.razziaShield * 2.5), clickDamp
        };
        return {
          bd,
          basePowerCps: Number.isFinite(basePowerCps) ? basePowerCps : 0,
          totalPowerCps: Number.isFinite(totalPowerCps) ? totalPowerCps : 0,
          grossDirtyCps: Number.isFinite(grossDirtyCps) ? grossDirtyCps : 0,
          washCapacityCps: Number.isFinite(washCapacityCps) ? washCapacityCps : 0,
          cleanIncomeCps: Number.isFinite(cleanIncomeCps) ? cleanIncomeCps : 0,
          washEfficiency: logBoni.washEfficiency,
          washSpeedMul: washMulAll,
          depotMultiplier: totalDepotMul,
          depotCapacity: Number.isFinite(depotCapacity) ? depotCapacity : 1000,
          launderShare: totalPowerCps > 0 ? Math.min(1, coolWeight / totalPowerCps) : 0,
          bizPower,
          heatGainPerSec: heatGainPerSec + overflowHeat + cappedPassiveHeatPenalty,
          heatDecayPerSec,
          heatNetPerSec,
          prestigeMul,
          pupIncomeMul: pupBoni.pupIncomeMul,
          gangIncomeMul: gangBoni.gangIncomeMul,
          itemGlobalIncomeMul: itemBoni.itemGlobalIncomeMul,
          officeIncomeMul: offBoni.officeIncomeMul,
          maxOfflineHours: Math.min(24, logBoni.maxOfflineHours + offBoni.offlineHoursAdd + pupBoni.offlineAdd),
          cloutPerMin: turfBoni.cloutPerMin,
          cloutPerSec: turfBoni.cloutPerSec,
          razziaLossFactor: Math.max(0.05, 0.20 - gangBoni.razziaShield),
          dirtyRaidKeep: Math.min(0.75, 0.25 + offBoni.raidSaveAdd + itemBoni.raidShieldAdd),
          clickValue: Number.isFinite(clickValue) ? clickValue : 2.5,
          comboMul,
          hustleHeatFactor: logBoni.hustleHeatFactor,
          passiveDrugsPerMin: logBoni.passiveDrugsPerMin + turfBoni.passiveDrugsPerMin + gangBoni.passiveDrugsPerMin,
          passiveWeaponsPerMin: logBoni.passiveWeaponsPerMin + turfBoni.passiveWeaponsPerMin,
          passiveStolenPerMin: turfBoni.passiveStolenPerMin,
          passiveTicketsPerMin: logBoni.passiveTicketsPerMin + turfBoni.passiveTicketsPerMin + gangBoni.passiveTicketsPerMin
        };
      },

      addCleanCash(amount) {
        if (!Number.isFinite(amount) || amount <= 0) return;
        STATE.currencies.cash = Math.max(0, STATE.currencies.cash + amount);
        STATE.stats.lifetimeRevenue += amount;
        STATE.stats.runRevenue = (STATE.stats.runRevenue || 0) + amount;
      },

      addDirtyCash(amount, depotCap) {
        if (!Number.isFinite(amount) || amount <= 0) return;
        const cap = depotCap || this.getStats().depotCapacity;
        const current = Math.max(0, STATE.currencies.dirtyCash || 0);
        if (current < cap) {
          STATE.currencies.dirtyCash = Math.min(cap * 1.15, current + amount);
        } else {
          STATE.currencies.dirtyCash = Math.min(cap * 1.15, current + amount * 0.25);
        }
      },

      clickHustle() {
        STATE.hustleCombo = Math.min(6, (STATE.hustleCombo || 0) + 1);
        if (STATE.hustleCombo > (STATE.stats.maxCombo || 0)) STATE.stats.maxCombo = STATE.hustleCombo;
        STATE.hustleDecayTimer = 1.6 + this.getOfficeBonuses().comboDecayBonus;
        const word = this.pickNextHustleWord();
        const isOverdrive = STATE.hustleCombo >= 6;
        const isCrit = Math.random() < 0.15;
        const stats = this.getStats();

        const baseHeatAdd = isCrit ? 0.38 : (isOverdrive ? 0.26 : 0.09);
        STATE.heat = Math.min(100, STATE.heat + baseHeatAdd * (stats.hustleHeatFactor || 1) * (this.sprint && !this.sprint.offered ? 0.25 : 1));

        const gained = stats.clickValue * 1.5 * (isCrit ? 5 : 1);
        this.addDirtyCash(gained, stats.depotCapacity);
        STATE.stats.totalClicks += 1;
        this.inspectorClick();
        const sprintMsg = this.sprintClick(stats);
        return { gained, combo: STATE.hustleCombo, isOverdrive, isCrit, word, sprintMsg };
      },

      selectBranch(bizId, branchLetter) {
        const st = STATE.businesses[bizId];
        if (!st || st.level < 25) return false;
        if ((st.branchCooldown || 0) > 0) return false;
        if (branchLetter !== "A" && branchLetter !== "B") return false;
        if (st.branch === branchLetter) return false;
        st.branch = branchLetter;
        st.branchCooldown = BRANCH_COOLDOWN_SEC;
        return true;
      },

      getPrestigeMin() {
        return PRESTIGE_MIN * Math.pow(PRESTIGE_GROWTH, Math.min(40, (STATE.stats && STATE.stats.prestigeCount) || 0));
      },

      getClaimableFiles(runRev = STATE.stats.runRevenue) {
        if (!Number.isFinite(runRev) || runRev < this.getPrestigeMin()) return 0;
        return Math.max(0, Math.floor(PRESTIGE_K * Math.pow(runRev / PRESTIGE_MIN, PRESTIGE_EXP)));
      },

      performPrestige() {
        const claimable = this.getClaimableFiles();
        if (claimable < 1) return { ok: false };

        STATE.currencies.files += claimable;
        STATE.stats.filesEarnedTotal += claimable;
        STATE.stats.prestigeCount += 1;
        STATE.stats.runRevenue = 0;

        const pupBoni = this.getPrestigeUpgradeBonuses();
        STATE.currencies.cash = 15 + pupBoni.startCashBonus;
        STATE.currencies.dirtyCash = 0;
        STATE.heat = 0;
        STATE.razziaCooldown = 0;
        STATE.boostTimer = 0;
        STATE.hustleCombo = 0;
        STATE.hustleDecayTimer = 0;
        STATE.activeEvent = null;
        STATE.activeMission = null;
        STATE.pendingBribe = null;
        STATE.inspector = null;
        STATE.inspCd = 420; STATE.eventCooldown = 420;
        STATE.war = null; STATE.warCd = 600; STATE.turfOcc = {};
        this.smoothedHeatNet = 0;
        this.currentHustleWord = "HUSTLE";

        const sortedBiz = KIEZ_API.getSortedCollection("BUSINESSES");
        for (let i = 0; i < sortedBiz.length; i++) {
          STATE.businesses[sortedBiz[i].id] = {
            level: 0,
            unlocked: i === 0,
            branch: null,
            branchCooldown: 0,
            milestonesClaimed: 0,
            mode: i % 2 === 1 ? "launder" : "hustle"
          };
        }

        const sortedLog = KIEZ_API.getSortedCollection("LOGISTICS");
        for (let i = 0; i < sortedLog.length; i++) STATE.logistics[sortedLog[i].id] = { level: 0 };

        const sortedTurf = KIEZ_API.getSortedCollection("TURF");
        for (let i = 0; i < sortedTurf.length; i++) STATE.turf[sortedTurf[i].id] = { level: 0 };

        this.updateUnlocks();
        this.ensureMissionBoard();
        return { ok: true, claimed: claimable };
      },

      calculateOfflineGain(elapsedMs, statsSnapshot) {
        if (!Number.isFinite(elapsedMs) || elapsedMs <= 0) {
          return { effectiveSeconds: 0, cleanGained: 0, remainingDirty: Math.max(0, STATE.currencies.dirtyCash || 0), dirtyDelta: 0, maxOfflineHours: 8 };
        }
        const s = statsSnapshot || this.getStats();
        const maxOfflineSec = s.maxOfflineHours * 3600;
        const effectiveSeconds = Math.min(maxOfflineSec, Math.max(0, elapsedMs / 1000));

        const initialDirty = Math.max(0, STATE.currencies.dirtyCash || 0);
        const producedDirty = s.grossDirtyCps * effectiveSeconds * 0.5;
        const totalAvailableDirty = initialDirty + producedDirty;
        const maxWashable = s.washCapacityCps * effectiveSeconds * 0.5;
        const resvOff = ((STATE.washReserve || 0) / 100) * (s.depotCapacity || 0);
        const washedDirty = Math.min(Math.max(0, totalAvailableDirty - resvOff), maxWashable);

        const cleanGained = washedDirty * s.washEfficiency;
        const remainingDirty = Math.min(s.depotCapacity, Math.max(0, totalAvailableDirty - washedDirty));
        const dirtyDelta = remainingDirty - initialDirty;

        return {
          effectiveSeconds,
          maxOfflineHours: s.maxOfflineHours,
          cleanGained: Number.isFinite(cleanGained) ? cleanGained : 0,
          remainingDirty: Number.isFinite(remainingDirty) ? remainingDirty : initialDirty,
          dirtyDelta: Number.isFinite(dirtyDelta) ? dirtyDelta : 0
        };
      },

      processOfflineSinceLastSave(useWallClock = false) {
        const now = Date.now();
        const refTime = useWallClock ? (this.lastTickWallTime || STATE.meta.savedAt || now) : (STATE.meta.savedAt || now);
        const deltaMs = now - refTime;
        STATE.meta.savedAt = now;
        this.lastTickWallTime = now;
        this.lastPerfNow = performance.now();

        if (deltaMs < 5000) return null;
        if (STATE.activeMission && STATE.activeMission.remainingSec > 0) {
          STATE.activeMission.remainingSec = Math.max(0, STATE.activeMission.remainingSec - (deltaMs / 1000));
        }
        const sim = this.calculateOfflineGain(deltaMs, this.getStats());
        if (sim.cleanGained > 0 || Math.abs(sim.dirtyDelta) > 0.01) {
          this.addCleanCash(sim.cleanGained);
          STATE.currencies.dirtyCash = sim.remainingDirty;
          this.offlineReport = {
            seconds: Math.floor(sim.effectiveSeconds),
            maxOfflineHours: sim.maxOfflineHours,
            cleanGained: sim.cleanGained,
            dirtyGained: sim.dirtyDelta
          };
          return this.offlineReport;
        }
        return null;
      },

      applyLoadedState(loaded, computeOffline = true) {
        const base = createInitialState();
        STATE = Object.assign(base, loaded);
        STATE.meta = Object.assign(base.meta, loaded.meta || {});
        STATE.boss = Object.assign(base.boss, loaded.boss || {});
        STATE.settings = Object.assign(base.settings, loaded.settings || {});
        STATE.ui = Object.assign(base.ui, loaded.ui || {});
        STATE.currencies = Object.assign(base.currencies, loaded.currencies || {});
        STATE.stats = Object.assign(base.stats, loaded.stats || {});
        if (!STATE.ach || typeof STATE.ach !== "object") STATE.ach = {};
        if (!STATE.social || typeof STATE.social !== "object") STATE.social = { id: "", named: false, rivals: {} };
        if (!STATE.bombs || typeof STATE.bombs !== "object") STATE.bombs = {};
        if (!STATE.turfOcc || typeof STATE.turfOcc !== "object") STATE.turfOcc = {};
        if (!STATE.weekly || typeof STATE.weekly !== "object") STATE.weekly = null;
        if (![0, 25, 50, 75].includes(STATE.washReserve)) STATE.washReserve = 0;
        if (!Number.isFinite(STATE.warCd)) STATE.warCd = 600;
        if (!loaded.stats || loaded.stats.runRevenue === undefined) {
          STATE.stats.runRevenue = (STATE.stats.prestigeCount || 0) === 0 ? (STATE.stats.lifetimeRevenue || 0) : 0;
        }
        this.contraTickAcc = 0;
        this.managerAcc = 0;
        hydrateRegistry();
        this.ensureStateIntegrity();
        if (computeOffline) this.processOfflineSinceLastSave(false);
        else {
          this.lastPerfNow = performance.now();
          this.lastTickWallTime = Date.now();
        }
      },

      tick() {
        const nowPerf = performance.now();
        let dt = (nowPerf - this.lastPerfNow) / 1000;
        this.lastPerfNow = nowPerf;
        this.lastTickWallTime = Date.now();

        if (!Number.isFinite(dt) || dt < 0) dt = 0;
        if (dt > 1.0) dt = 1.0;

        if (STATE.hustleCombo > 0) {
          STATE.hustleDecayTimer = Math.max(0, (STATE.hustleDecayTimer || 0) - dt);
          if (STATE.hustleDecayTimer <= 0) {
            STATE.hustleCombo = 0;
            this.currentHustleWord = "HUSTLE";
          }
        }

        this.sprintTick(dt);
        this.inspectorTick(dt);
        this.warTick(dt);

        if (STATE.boostTimer > 0) {
          STATE.boostTimer = Math.max(0, STATE.boostTimer - dt);
        }

        if (STATE.missionRerollTimer > 0) {
          STATE.missionRerollTimer = Math.max(0, STATE.missionRerollTimer - dt);
        }

        let spotBecameReady = false;
        if (STATE.officeSpotCooldown > 0) {
          STATE.officeSpotCooldown = Math.max(0, STATE.officeSpotCooldown - dt);
          if (STATE.officeSpotCooldown <= 0) spotBecameReady = true;
        }

        let marketShifted = false;
        if (STATE.marketState) {
          STATE.marketState.timer = Math.max(0, (STATE.marketState.timer || 0) - dt);

        }

    const Online = {
      st: { status: null, statusAt: 0, sig: "" },
      active() { return !!(ONLINE.enabled && ONLINE.url); },
      feat(k) { const s = this.st.status; return !!(this.active() && s && s.enabled && s[k]); },

      randToken() { const a = new Uint8Array(16); (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.floor(Math.random() * 256)); return Array.from(a).map(b => b.toString(16).padStart(2, "0")).join(""); },
      async call(method, path, body) {
        if (!this.active()) return { ok: false, status: 0, j: {}, net: true };
        const ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
        const to = setTimeout(() => { try { ctl && ctl.abort(); } catch (e) {} }, ONLINE.timeoutMs);
        try {
          const r = await fetch(String(ONLINE.url).replace(/\/+$/, "") + path, { method, body: body ? JSON.stringify(body) : undefined, headers: body ? { "Content-Type": "text/plain" } : undefined, signal: ctl ? ctl.signal : undefined, cache: "no-store" });
          let j = null; try { j = await r.json(); } catch (e) {}
          return { ok: r.ok, status: r.status, j: j || {} };

        finally { clearTimeout(to); }

      async refreshStatus(force) {
        if (!this.active()) return;

        if (!force && this.st.statusAt && now - this.st.statusAt < 25 * 60000) return;
        this.st.statusAt = now;
        const r = await this.call("GET", "/status");
        const next = (r.ok && r.j && r.j.v) ? r.j : null;
        const sig = next ? [next.enabled, next.lb, next.save].join() : "off";
        this.st.status = next;
        if (sig !== this.st.sig) { this.st.sig = sig; try { View.onOnlineChange(); } catch (e) {} }
      },
      async join(name) {
        const o = this.me();
        const token = o.token || this.randToken();
        const r = await this.call("POST", "/register", { id: SOC.ensure().id, token, name });
        if (r.ok) { o.token = token; o.on = true; o.state = ""; Platform.saveGame(true); this.report(true); return { ok: true }; }
        if (r.status === 409) { o.on = false; o.state = "conflict"; return { ok: false, err: "conflict" }; }
        if (r.status === 400) return { ok: false, err: "name" };
        return { ok: false, err: r.net ? "net" : "off" };
      },
      async report(force) {
        const o = this.me();
        if (!this.feat("lb") || !o.on || !o.token) return false;
        if (!force && document.hidden) return false;
        const now = Date.now(), total = (STATE.stats && STATE.stats.lifetimeRevenue) || 0;
        if (!force && (now - o.sentAt < 600000 || total === o.lastTotal)) return false;
        if (force && now - o.sentAt < 60000) return false;
        o.sentAt = now; // Sperre gegen Doppelanfragen, wird bei Fehler zurückgesetzt
        const r = await this.call("POST", "/score", { id: SOC.ensure().id, token: o.token, total, name: STATE.boss.name });
        if (r.ok) { o.lastTotal = total; return true; }
        if (r.status === 401) { o.on = false; o.state = "conflict"; }
        else if (r.status === 429) o.sentAt = now - 540000;
        else o.sentAt = now - 540000;
        return false;

        if (r.status === 401) { o.on = false; o.state = "conflict"; }

        const res = Platform.importSaveBase64(r.j.blob, true);

        const so = SOC.ensure();
        so.id = r.j.id; so.named = true;

      // ---- Freunde und Geschenke (live) ----
      async sync(force) {
        const o = this.me();
        if (!this.feat("friends") || !o.on || !o.token) return false;
        const now = Date.now();
        if (this._syncing) return false;
        if (now - (this._syncAt || 0) < (force ? 20000 : 150000)) return false;
        this._syncAt = now; this._syncing = true;
        try {
          const ack = this._ack || [];
          const r = await this.call("POST", "/sync", { id: SOC.ensure().id, token: o.token, ack });
          if (!r.ok) { if (r.status === 401) { o.on = false; o.state = "conflict"; } return false; }
          this._ack = this._ack ? this._ack.filter(x => !ack.includes(x)) : [];
          const so = SOC.ensure(), j = r.j, seen = {};
          let newGifts = 0, giftFrom = "";
          for (const f of (j.friends || [])) {
            if (!f || !/^[0-9A-Z]{6}$/.test(f.id || "") || f.id === so.id) continue;
            seen[f.id] = 1;
            const nm = SOC.cleanName(f.name, 16) || "?";
            const ex = so.rivals[f.id];
            if (!ex && Object.keys(so.rivals).length >= 50) continue;
            so.rivals[f.id] = Object.assign({ id: f.id, city: "", style: 0, pre: 0 }, ex || {}, { name: nm, rev: Math.max(0, +f.rev || 0), ts: now, live: true });
          }
          for (const id of Object.keys(so.rivals)) if (so.rivals[id].live && !seen[id]) delete so.rivals[id];
          this.st.req = (j.requests || []).filter(x => x && /^[0-9A-Z]{6}$/.test(x.id || "")).map(x => ({ id: x.id, name: SOC.cleanName(x.name, 16) || "?" }));
          this.st.out = (j.out || []).filter(x => /^[0-9A-Z]{6}$/.test(x || ""));
          for (const g of (j.gifts || [])) {
            if (!g || !Number.isInteger(g.gid)) continue;
            this._ack = this._ack || [];
            if (!this._ack.includes(g.gid)) this._ack.push(g.gid);
            const res = SOC.importPkg({ to: so.id, from: String(g.from || ""), kind: g.kind | 0, nonce: g.nonce | 0, name: SOC.cleanName(g.name, 16) || "?" });
            if (res && res.ok) { newGifts++; giftFrom = SOC.cleanName(g.name, 16) || "?"; }
          }
          Platform.saveGame(true);
          if (newGifts) { try { View.onGiftsArrived(newGifts, giftFrom); } catch (e) {} }
          const sig = [Object.keys(seen).sort().join(), this.st.req.map(x => x.id).join(), this.st.out.join(), newGifts].join("|");
          if (sig !== this._friendSig) { this._friendSig = sig; try { View.onOnlineChange(); } catch (e) {} }
          return true;
        } finally { this._syncing = false; }

      async goalLoad(force) {

          const changed = sig !== this._goalSig; this._goalSig = sig;

      stopHoldBuy() {
        if (this.holdDelayTimer) { clearTimeout(this.holdDelayTimer); this.holdDelayTimer = null; }
        if (this.holdInterval) { clearInterval(this.holdInterval); this.holdInterval = null; }
      },

      achName(fam, target) {
        const en = STATE.settings && STATE.settings.lang === "EN";
        return (en ? fam.en : fam.de) + (fam.id === "cmb" ? "" : " " + formatNumber(target, 0) + fam.unit);
      },
      achRewardText(f, c, a) {
        const parts = [];
        if (f) parts.push("+" + f + " " + t("ui.curr.favors"));
        if (c) parts.push("+" + c + " " + t("ui.curr.cred"));
        if (a) parts.push("+" + a + " " + t("ui.curr.files"));
        return parts.join(" • ");
      },
      onAchievements(list) {
        DBG.add("ACH", list.map(a => a.fam.id + ":" + a.target).join(","));
        const en = STATE.settings && STATE.settings.lang === "EN";
        let el = document.getElementById("ach-toast");
        if (!el) { el = document.createElement("div"); el.id = "ach-toast"; document.body.appendChild(el); }
        const f = list.reduce((x, a) => x + a.favors, 0), c = list.reduce((x, a) => x + a.cred, 0), fl = list.reduce((x, a) => x + a.files, 0);
        const head = list.length === 1 ? this.achName(list[0].fam, list[0].target) : (en ? list.length + " achievements" : list.length + " Erfolge");
        el.innerHTML = "★ " + (en ? "ACHIEVEMENT" : "ERFOLG") + ": " + head + "<small>" + this.achRewardText(f, c, fl) + "</small>";
        el.classList.add("show");
        clearTimeout(this._achT);
        this._achT = setTimeout(() => el.classList.remove("show"), 3800);
        Platform.playTone("milestone");
        Platform.haptic("success");
        FX.flash("rgba(255,212,0,.25)");
        FX.sparks(el, true);
        if (STATE.ui.activeTab === "hq" && STATE.ui.hqSubTab === "milestones") this.renderActiveTab();
      },

      playMilestoneFx(bizId) {
        const btn = document.querySelector(`[data-bind="biz-btn-clean-${bizId}"]`) || document.querySelector(`[data-bind="biz-btn-dirty-${bizId}"]`);
        const card = btn && btn.closest(".biz-card");
        if (!card) return;
        const en = STATE.settings && STATE.settings.lang === "EN";
        card.classList.remove("ms-pop"); void card.offsetWidth; card.classList.add("ms-pop");
        const pop = document.createElement("span");
        pop.className = "ms-flag";
        pop.textContent = en ? "×2 MILESTONE!" : "×2 MEILENSTEIN!";
        card.appendChild(pop);
        setTimeout(() => { if (pop.parentNode) pop.parentNode.removeChild(pop); card.classList.remove("ms-pop"); }, 1300);
      },

      executeBuyStep(bizId, payWith) {
        const res = Engine.buyBusiness(bizId, payWith);
        if (res.ok) {
          if (res.milestone) {
            Platform.playTone("milestone");
            Platform.haptic("milestone");
          } else {
            Platform.playTone("buy");
            Platform.haptic(10);
          }
          if (res.structuralChange) this.renderActiveTab();
          this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
          if (res.milestone) {
            this.playMilestoneFx(bizId);
            const mb = document.querySelector('[data-bind="biz-btn-clean-' + bizId + '"]') || document.querySelector('[data-bind="biz-btn-dirty-' + bizId + '"]');
            FX.milestone(mb && mb.closest(".biz-card"));
          }
          FX.stamp(bizId);
        } else {
          if (!this.holdInterval) { Platform.playTone("deny"); Platform.haptic("fail"); }
          this.stopHoldBuy();
        }
      },

      bindGlobalEvents() {
        const shell = document.getElementById("app-shell");

        window.addEventListener("pointerup", () => {
          this.stopHoldBuy();
          this.pointerStart = null;
        });
        window.addEventListener("pointercancel", () => {
          this.stopHoldBuy();
          this.pointerStart = null;
          this.wasScrolling = false;
        });
        window.addEventListener("blur", () => {
          this.stopHoldBuy();
          this.pointerStart = null;
        });

        document.addEventListener("visibilitychange", () => {
          this.stopHoldBuy();
          if (document.visibilityState === "hidden") {
            Platform.saveGame(true);
          } else if (document.visibilityState === "visible") {
            const rep = Engine.processOfflineSinceLastSave(true);
            this.renderActiveTab();
            this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
            if (rep) { this.showOfflineModal(rep); Engine.offlineReport = null; }
          }
        });

        // Touch-drag guard: single tap executes immediately on click, hold-buy triggers after 360ms
        ["touchend", "click", "keydown"].forEach(ev => document.addEventListener(ev, () => Platform.unlockAudio(), { capture: true, passive: true }));
        shell.addEventListener("pointerdown", (e) => {
          Platform.unlockAudio();
          this.pointerStart = { x: e.clientX, y: e.clientY };
          this.wasScrolling = false;
          this.didHoldBuy = false;
          this.downHustle = !!(e.target.closest && e.target.closest("[data-action=click-hustle]"));

          const buyBtn = e.target.closest("[data-buy-biz]");
          if (buyBtn && !buyBtn.disabled) {
            const bizId = buyBtn.getAttribute("data-buy-biz");
            const payWith = buyBtn.getAttribute("data-pay") || "cash";
            this.stopHoldBuy();
            this.holdDelayTimer = setTimeout(() => {
              if (this.wasScrolling) return;
              this.didHoldBuy = true;
              this.executeBuyStep(bizId, payWith);
              this.holdInterval = setInterval(() => {
                if (this.wasScrolling) { this.stopHoldBuy(); return; }
                this.executeBuyStep(bizId, payWith);
              }, 120);
            }, 360);
          }
        });

        shell.addEventListener("pointermove", (e) => {
          if (!this.pointerStart) return;
          const dx = Math.abs(e.clientX - this.pointerStart.x);
          const dy = Math.abs(e.clientY - this.pointerStart.y);
          if (!this.downHustle && (dx > 14 || dy > 14)) {
            this.wasScrolling = true;
            this.stopHoldBuy();
          }
        });

        shell.addEventListener("click", (e) => {
          if (this.wasScrolling) {
            this.wasScrolling = false;
            return;
          }
          const buyBtn = e.target.closest("[data-buy-biz]");
          if (buyBtn) {
            this.stopHoldBuy();
            if (this.didHoldBuy) {
              this.didHoldBuy = false;
              return;
            }
            if (!buyBtn.disabled) {
              const bizId = buyBtn.getAttribute("data-buy-biz");
              const payWith = buyBtn.getAttribute("data-pay") || "cash";
              this.executeBuyStep(bizId, payWith);
            }
            return;
          }
          const actionEl = e.target.closest("[data-action]");
          if (!actionEl) return;
          const action = actionEl.getAttribute("data-action");
          if (this.settingsOpen && ["toggle-lang", "toggle-sound", "toggle-theme", "cycle-fx", "toggle-tips", "boss-style", "save-boss-id", "hide-dev", "tap-version", "hard-reset"].includes(action)) {
            setTimeout(() => { if (this.settingsOpen) this.refreshSettings(); }, 0);
            if (action === "hard-reset") setTimeout(() => { if (this.settingsOpen) this.refreshSettings(); }, 3700);
          }
          if (action === "click-hustle") DBG.taps++;
          else DBG.add("TAP", action + " " + (actionEl.getAttribute("data-buy-biz") || actionEl.getAttribute("data-taskid") || actionEl.getAttribute("data-tier") || actionEl.getAttribute("data-good") || actionEl.getAttribute("data-pupid") || actionEl.getAttribute("data-slot") || ""));

          if (action === "sprint-accept") {
            if (Engine.sprintAccept(actionEl.getAttribute("data-tier"))) { Platform.playTone("sprint"); Platform.haptic(20); }
            this.updateSprintUI();
            return;
          }
          if (action === "vault-accept") {
            if (Engine.sprint && Engine.sprint.kind === "box") { if (Engine.boxAccept()) { Platform.playTone("sprint"); Platform.haptic(20); this.showBoxModal(); } this.updateSprintUI(); return; }
            if (Engine.sprint && Engine.sprint.kind === "run") { if (Engine.runAccept()) { Platform.playTone("sprint"); Platform.haptic(20); this.showRunModal(); } this.updateSprintUI(); return; }
            if (Engine.vaultAccept()) { Platform.playTone("sprint"); Platform.haptic(20); this.showVaultModal(); }
            this.updateSprintUI();
            return;
          }
          if (action === "vault-stop") { this.vaultStopTap(); return; }
          if (action === "sprint-decline") {
            if (Engine.sprintDecline()) Platform.haptic(8);
            this.updateSprintUI();
            return;
          }
          if (action === "click-hustle") {
            const hRes = Engine.clickHustle();
            Platform.playTone("slap", hRes.isCrit ? 6 : hRes.combo);
            Platform.haptic(hRes.isCrit ? 22 : (hRes.isOverdrive ? 16 : 8));
            const label = hRes.isCrit ? `KRIT! +${formatNumber(hRes.gained)} €` : `+${formatNumber(hRes.gained)} €`;
            this.spawnFloatingPopup(actionEl, label, hRes.isOverdrive, hRes.isCrit);
            actionEl.classList.remove("punch"); void actionEl.offsetWidth; actionEl.classList.add("punch");
            if (actionEl.id === "mini-hustle-btn") this.spawnHustleBubble(actionEl);
            if (hRes.isCrit) { FX.flash("rgba(255,212,0,.45)"); FX.sparks(actionEl, true); } else if (hRes.combo >= 3) FX.sparks(actionEl, false);
            this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
          } else if (action === "toggle-biz-mode") {
            const bizId = actionEl.getAttribute("data-biz");
            if (Engine.toggleBusinessMode(bizId)) {
              Platform.playTone("buy");
              Platform.haptic(10);
              this.renderActiveTab();
              this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
            }
          } else if (action === "toggle-all-modes") {
            Engine.toggleAllBusinessModes();
            Platform.playTone("buy");
            Platform.haptic(14);
            this.renderActiveTab();
            this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
          } else if (action === "hire-all-managers") {
            if (Engine.hireAllAffordableManagers() > 0) {
              Platform.playTone("buy");
              Platform.haptic(18);
              this.renderActiveTab();
              this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
            }
          } else if (action === "boss-quote") {
            STATE.boss.customQuote = "";
            const quotes = ["ui.boss.quote.1", "ui.boss.quote.2", "ui.boss.quote.3", "ui.boss.quote.4"];
            STATE.boss.quoteKey = quotes[(quotes.indexOf(STATE.boss.quoteKey) + 1) % quotes.length];
            this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
          } else if (action === "boss-style") {
            STATE.boss.styleIdx = ((STATE.boss.styleIdx || 0) + 1) % 3;
            Platform.saveGame(true);
            Platform.haptic(8);
            if (STATE.ui.activeTab === "hq" && STATE.ui.hqSubTab === "office") this.renderActiveTab();
          } else if (action === "office-breakdown") {
            Platform.haptic(10); this.showBreakdownModal();
          } else if (action === "office-radio") {
            Platform.haptic(10); this.showRadioModal();
          } else if (action === "office-edit") {
            Platform.haptic(10); this.showIdentityModal(actionEl.getAttribute("data-field"));
          } else if (action === "save-identity") {
            const inp = document.getElementById("id-edit-input");
            const fld = actionEl.getAttribute("data-field");
            if (inp) {
              Engine.updateBossIdentity(fld === "name" ? inp.value : STATE.boss.name, fld === "city" ? inp.value : STATE.boss.city);
              Platform.saveGame(true);
            }
            document.getElementById("app-modal").classList.remove("open");
