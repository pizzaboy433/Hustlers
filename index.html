            this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
            this.toast(msg, "");
            if (Engine.offlineReport) { this.showOfflineModal(Engine.offlineReport); Engine.offlineReport = null; }
          } else if (action === "dev-soc-reset") {
            const so = SOC.ensure();
            so.sent = {}; so.got = {}; so.dmg = { day: "", n: 0 }; so.inbox = [];
            so.job = { day: SOC.dayNo(), score: null, results: {}, claimed: false }; so.streak = { last: 0, n: 0 };
            STATE.bombs = {};
            Platform.saveGame(true); this.renderActiveTab(); this.toast("Reset", "");
          } else if (action === "dev-soc-favors") {
            STATE.currencies.favors += 20; Platform.saveGame(true); this.toast("+20", "");
          } else if (action === "job-start") {
            if (SOC.ensure().job.score == null) this.showJobModal();
          } else if (action === "job-claim") {
            const c = SOC.jobClaim();
            if (c) { Platform.saveGame(true); this.renderActiveTab(); this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet); try { FX.shake(); } catch (e) {} this.toast((STATE.settings.lang === "EN" ? "Reward: +" : "Belohnung: +") + formatNumber(c.cash) + " €", "+" + c.favors + " " + (STATE.settings.lang === "EN" ? "favors" : "Gefallen")); }
          } else if (action === "job-share") {
            const jt = SOC.jobShareText();
            if (!jt) { this.toast(STATE.settings.lang === "EN" ? "Play the job first" : "Erst den Job spielen", ""); }
            else {
              this.pkgText = jt;
              const en = STATE.settings && STATE.settings.lang === "EN";
              document.getElementById("app-modal-body").innerHTML = `
                <h2 class="panel-title">${en ? "Your result" : "Dein Ergebnis"}</h2>
                <p>${en ? "Send this whole text to your friends:" : "Schick diesen ganzen Text an deine Freunde:"}</p>
                <div class="cash-hero-box" style="font-size:12px; word-break:break-all; user-select:all; -webkit-user-select:all;"><span class="num">${jt.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]))}</span></div>
                <button type="button" class="comic-btn primary" style="width:100%; margin:6px 0;" data-action="pkg-share">${en ? "SHARE" : "TEILEN"}</button>
                <button type="button" class="comic-btn" style="width:100%; margin:6px 0;" data-action="pkg-copy">${en ? "COPY" : "KOPIEREN"}</button>
                <button type="button" class="comic-btn" style="width:100%; margin:6px 0;" data-action="close-modal">${en ? "Close" : "Schließen"}</button>`;
              document.getElementById("app-modal").classList.add("open");
            }
          } else if (action === "soc-open") {
            const o = SOC.openPkg(actionEl.getAttribute("data-pk"));
            if (o && o.defuse) { this.showDefuseModal(o.key); return; }
            Platform.saveGame(true);
            this.renderActiveTab(); this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
            if (o) { this.toast(o.res, ""); try { FX.shake(); } catch (e) {} }
          } else if (action === "repair-bomb") {
            if (Engine.repairBomb(actionEl.getAttribute("data-offid"))) { Platform.saveGame(true); this.renderActiveTab(); this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet); }
            else this.toast(STATE.settings.lang === "EN" ? "Not enough favors" : "Nicht genug Gefallen", "");
          } else if (action === "soc-send") {
            this.showSendModal(actionEl.getAttribute("data-rid"));
          } else if (action === "soc-send-go") {
            const rid = actionEl.getAttribute("data-rid"), kind = parseInt(actionEl.getAttribute("data-kind"), 10);
            const r = SOC.send(rid, kind);
            if (r.err) { this.toast(r.err, ""); return; }
            Platform.saveGame(true);
            this.renderActiveTab(); this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
            const rv0 = SOC.ensure().rivals[rid];
            if (rv0 && rv0.live && Online.feat("friends") && Online.joined()) {
              const en0 = STATE.settings && STATE.settings.lang === "EN";
              document.getElementById("app-modal-body").innerHTML = `<h2 class="panel-title">${en0 ? "Sending …" : "Wird gesendet …"}</h2>`;
              Online.giftSend(rid, kind).then(gr => {
                const bodyEl = document.getElementById("app-modal-body");
                if (gr.ok) {
                  if (bodyEl && document.getElementById("app-modal").classList.contains("open")) bodyEl.innerHTML = `<h2 class="panel-title">${en0 ? "Package sent!" : "Päckchen verschickt!"}</h2><p>${en0 ? "It shows up in your friend's inbox." : "Es landet direkt im Postfach deines Freundes."}</p><button type="button" class="comic-btn primary" style="width:100%;" data-action="close-modal">${en0 ? "DONE" : "FERTIG"}</button>`;
                  return;
                }
                if (gr.net || gr.status === 0 || gr.status >= 500) {
                  // Server nicht erreichbar: Rückfall auf den Text zum Weiterschicken
                  this.pkgText = r.text;
                  if (bodyEl) bodyEl.innerHTML = `<h2 class="panel-title">${en0 ? "Server unreachable" : "Server nicht erreichbar"}</h2><p>${en0 ? "Send this text to your friend instead:" : "Schick stattdessen diesen Text an deinen Freund:"}</p><div class="cash-hero-box" style="font-size:12px; word-break:break-all; user-select:all;"><span class="num">${String(r.text).replace(/[&<>"']/g, "")}</span></div><button type="button" class="comic-btn primary" style="width:100%; margin:6px 0;" data-action="pkg-copy">${en0 ? "COPY" : "KOPIEREN"}</button><button type="button" class="comic-btn" style="width:100%;" data-action="close-modal">${en0 ? "Close" : "Schließen"}</button>`;
                  return;
                }
                // Server lehnt ab: Kosten zurück
                STATE.currencies.favors += SOC.SEND_COST; delete SOC.ensure().sent[rid]; Platform.saveGame(true);
                const msgs = { daily: en0 ? "Your friend already got a package today" : "Dein Freund hat heute schon eins bekommen", full: en0 ? "Your friend's inbox is full" : "Das Postfach deines Freundes ist voll", not_friend: en0 ? "You're not friends online anymore" : "Ihr seid online nicht mehr befreundet" };
                if (bodyEl) bodyEl.innerHTML = `<h2 class="panel-title">${en0 ? "Not sent" : "Nicht gesendet"}</h2><p>${msgs[gr.j.error] || (en0 ? "That didn't work." : "Das hat nicht geklappt.")} ${en0 ? "Favors refunded." : "Gefallen zurück."}</p><button type="button" class="comic-btn primary" style="width:100%;" data-action="close-modal">OK</button>`;
                this.renderActiveTab(); this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
              });
              return;
            }
            this.pkgText = r.text;
            const en = STATE.settings && STATE.settings.lang === "EN";
            document.getElementById("app-modal-body").innerHTML = `
              <h2 class="panel-title">${en ? "Package ready!" : "Päckchen fertig!"}</h2>
              <p>${en ? "Send this text to " : "Schick diesen Text an "}${String(r.name).replace(/[&<>"']/g, "")}${en ? " (e.g. via WhatsApp/iMessage)." : " (z. B. per WhatsApp/iMessage)."}</p>
              <div class="cash-hero-box" style="font-size:12px; word-break:break-all; user-select:all;"><span class="num">${r.text.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]))}</span></div>
              <button type="button" class="comic-btn primary" style="width:100%; margin:6px 0;" data-action="pkg-share">${en ? "SHARE" : "TEILEN"}</button>
              <button type="button" class="comic-btn" style="width:100%; margin:6px 0;" data-action="pkg-copy">${en ? "COPY" : "KOPIEREN"}</button>
              <button type="button" class="comic-btn" style="width:100%; margin:6px 0;" data-action="close-modal">${en ? "Close" : "Schließen"}</button>`;
          } else if (action === "pkg-share" || action === "pkg-copy") {
            if (action === "pkg-copy") this.copyText(this.pkgText || ""); else this.shareOrCopy(this.pkgText || "");
          } else if (action === "soc-del") {
            const rid = actionEl.getAttribute("data-rid");
            if (STATE.social && STATE.social.rivals && STATE.social.rivals[rid] && STATE.social.rivals[rid].live) Online.friendCall("/friend/remove", { other: rid });
            if (STATE.social && STATE.social.rivals) delete STATE.social.rivals[rid];
            Platform.saveGame(true);
            this.renderActiveTab();
          } else if (action === "open-heat-help") {
            this.showHeatTutorialModal();
          } else if (action === "open-bilanz") {
            this.showBilanzModal();
          } else if (action === "close-modal") {
            this.settingsOpen = false;
            if (this.lastRenderedEventId && !STATE.activeEvent) { setTimeout(() => this.renderActiveTab(), 0); }
            document.getElementById("app-modal").classList.remove("open");
          } else if (action === "do-prestige") {
            const now = Date.now();
            if (this.confirmState.type !== "prestige" || now > this.confirmState.expiresAt) {
              this.confirmState = { type: "prestige", expiresAt: now + 3500 };
              Platform.haptic(12);
              this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
              return;
            }
            this.confirmState = { type: null, expiresAt: 0 };
            if (Engine.performPrestige().ok) {
              DBG.add("PRESTIGE", "count=" + STATE.stats.prestigeCount);
              Platform.playTone("buy");
              Platform.haptic(25);
              FX.paper(14);
              Platform.saveGame(true);
              this.renderActiveTab();
              this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
            }
          } else if (action === "export-save") {
            const out = document.getElementById("save-io-box");
            if (out) { Platform.saveGame(true); out.value = Platform.exportSaveBase64(); out.select(); STATE.settings.backupAt = Date.now(); }
          } else if (action === "import-save") {
            const inp = document.getElementById("save-io-box");
            if (inp) {
              const res = Platform.importSaveBase64(inp.value, true);
              if (res.ok) {
                this.syncShellControls();
                this.translateStaticDOM();
                this.renderActiveTab();
                this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
              }
              const msgAfter = document.getElementById("save-io-msg");
              if (msgAfter) msgAfter.textContent = res.ok ? t("archive.save.imported_ok") : t("archive.save.imported_err");
            }
          } else if (action === "hard-reset") {
            const now = Date.now();
            if (this.confirmState.type !== "reset" || now > this.confirmState.expiresAt) {
              this.confirmState = { type: "reset", expiresAt: now + 3500 };
              Platform.haptic(15);
              this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
              return;
            }
            this.confirmState = { type: null, expiresAt: 0 };
            Platform.storageRemove(Platform.SAVE_KEY);
            Platform.storageRemove(Platform.BACKUP_KEY);
            STATE = createInitialState();
            Engine.contraTickAcc = 0;
            Engine.managerAcc = 0;
            hydrateRegistry();
            Engine.ensureStateIntegrity();
            Platform.saveGame(true);
            this.syncShellControls();
            this.translateStaticDOM();
            this.renderActiveTab();
            this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
          } else if (action === "tap-version") {
            this.versionTapCount += 1;
            if (this.versionTapCount >= 5 && !STATE.ui.devUnlocked) {
              STATE.ui.devUnlocked = true;
              Platform.haptic(20);
              this.renderActiveTab();
              this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
            }
          } else if (action === "run-diagnostics") {
            const report = KIEZ_API.runDiagnostics();
            this.renderActiveTab();
            this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
            const diagOut = document.getElementById("diag-output");
            if (diagOut) {
              diagOut.innerHTML = report.map(r => `<div class="${r.ok ? "diag-ok" : "diag-err"}">${r.ok ? "[OK]" : "[FEHLER]"} ${r.name}: ${r.detail}</div>`).join("");
            }
          } else if (action === "inject-mod-biz") {
            const res = KIEZ_API.register(
              "BUSINESSES",
              {
                id: "biz_mod_buero",
                epochId: "epoch_block",
                nameKey: "biz.mod.buero.name",
                iconKey: "doc",
                g: 1.15,
                heatMul: 0.52,
                supplyTargetId: "biz_spaeti",
                supplyBonusType: "add",
                supplyBonusValue: 30,
                branchA_key: "biz.mod.buero.a",
                branchB_key: "biz.mod.buero.b"
              },
              {
                "biz.mod.buero.name": "Copyshop „Blaupause“ (Mod)",
                "biz.mod.buero.a": "Express-Quittungen (+50% Leistung)",
                "biz.mod.buero.b": "Schredder-Service (-15% Kosten, -25% Fahndung)"
              },
              {
                afterId: "biz_spaeti",
                autoInterpolateEconomy: true,
                persistMod: true,
                langEn: {
                  "biz.mod.buero.name": "Copy Shop „Blueprint“ (Mod)",
                  "biz.mod.buero.a": "Express Receipts (+50% Output)",
                  "biz.mod.buero.b": "Shredder Service (-15% Cost, -25% Heat)"
                }
              }
            );
            this.renderActiveTab();
            this.updateTickUI(Engine.getStats(), Engine.smoothedHeatNet);
            const diagOut = document.getElementById("diag-output");
            if (diagOut) {
              diagOut.innerHTML = res.ok
                ? `<div class="diag-ok">[OK] Mod-Betrieb eingeschoben (${res.id}).</div>`
                : `<div class="diag-err">[INFO] ${res.error}</div>`;
            }
          }
        });
      },

      renderActiveTab() {
        const vp = document.getElementById("tab-viewport");
        if (!tabOpen(STATE.ui.activeTab)) STATE.ui.activeTab = "businesses";
        const tab = STATE.ui.activeTab;
        this.lastRenderedEventId = STATE.activeEvent;
        const eventBanner = this.buildEventBannerHTML();
        const epochClassMap = {
          epoch_block: "ep-block",
          epoch_kiez: "ep-kiez",
          epoch_hafen: "ep-hafen",
          epoch_city: "ep-city",
          epoch_holding: "ep-holding"
        };

        if (tab === "businesses") {
          const sortedBiz = KIEZ_API.getSortedCollection("BUSINESSES");
          const mgrBulk = Engine.getAffordableManagersSummary();
          const bulkMgrHtml = (STATE.currencies.files > 0 && mgrBulk.count >= 1)
            ? `<button type="button" class="comic-btn primary" style="min-height:34px; font-size:11px;" data-action="hire-all-managers" data-bind="hire-all-mgr-btn">
                ${renderIcon("crew", 13)} <span data-bind="hire-all-mgr-lbl">${t("mgr.hire_all", { count: mgrBulk.count, cost: formatNumber(mgrBulk.totalCost, 0) })}</span>
              </button>`
            : "";

          const html = [eventBanner, bulkMgrHtml];
          let shownLockedPreview = false;

          for (let i = 0; i < sortedBiz.length; i++) {
            const b = sortedBiz[i];
            const st = STATE.businesses[b.id];
            const prevBiz = i > 0 ? sortedBiz[i - 1] : null;
            const epCls = epochClassMap[b.epochId] || "ep-block";

            if (!st.unlocked) {
              if (shownLockedPreview) continue;
              shownLockedPreview = true;
              const prevName = prevBiz ? t(prevBiz.nameKey) : "";
              const minLv = (b.unlockCondition && b.unlockCondition.minLevel) || 25;
              html.push(`
                <article class="biz-card locked">
                  <div class="biz-top">
                    <div class="biz-identity">
                      <div class="biz-icon">${renderIcon("lock", 16)}</div>
                      <div class="biz-title-wrap">
                        <div class="biz-name">${t(b.nameKey)}</div>
                        <div class="biz-meta">${t("biz.locked.prev", { prevName, minLevel: minLv })}</div>
                      </div>
                    </div>
                  </div>
                </article>
              `);
              continue;
            }

            let supplyChip = "";
            if (b.supplyTargetId && REGISTRY.BUSINESSES[b.supplyTargetId]) {
              const targetName = t(REGISTRY.BUSINESSES[b.supplyTargetId].nameKey);
              const supplyDesc = b.supplyBonusType === "add"
                ? t("biz.supply.add", { val: b.supplyBonusValue, target: targetName })
                : t("biz.supply.mul", { val: b.supplyBonusValue, target: targetName });
              supplyChip = `<span class="tag-chip ${st.level >= 1 ? "active-supply" : ""}">${supplyDesc}</span>`;
            }

            let branchSection = "";
            if (st.level >= 25) {
              const selA = st.branch === "A" ? "selected-branch" : "";
              const selB = st.branch === "B" ? "selected-branch" : "";
              const onCd = (st.branchCooldown || 0) > 0;
              const cdText = onCd ? t("biz.branch.cd", { sec: Math.ceil(st.branchCooldown) }) : (st.branch ? `[${st.branch}]` : "—");
              branchSection = `
                <div class="branch-choice-box">
                  <div class="branch-choice-title">
                    <span>${t("biz.branch.prompt")}</span>
                    <span class="num" data-bind="branch-cd-${b.id}">${cdText}</span>
                  </div>
                  <div class="branch-btn-row">
                    <button type="button" class="branch-opt-btn ${selA}" data-action="select-branch" data-biz="${b.id}" data-branch="A" data-bind="branch-a-${b.id}" ${onCd && !selA ? "disabled" : ""}>${t(b.branchA_key)}</button>
                    <button type="button" class="branch-opt-btn ${selB}" data-action="select-branch" data-biz="${b.id}" data-branch="B" data-bind="branch-b-${b.id}" ${onCd && !selB ? "disabled" : ""}>${t(b.branchB_key)}</button>
                  </div>
                </div>
              `;
            }

            const tagsRowHtml = supplyChip ? `<div class="biz-tags-row">${supplyChip}</div>` : "";
            const isLaunder = st.mode === "launder";
            const mgr = STATE.managers[b.id];
            let mgrHtml;
            if (mgr && mgr.hired) {
              const tgtTxt = mgr.target > 0 ? t("mgr.target", { n: mgr.target }) : t("mgr.target.inf");
              const waitTxt = (st.level >= 25 && !st.branch) ? ` • ${t("mgr.waitbranch")}` : "";
              mgrHtml = `<button type="button" class="mgr-btn" data-action="mgr-target" data-biz="${b.id}">${renderIcon("crew", 12)} ${t("mgr.active")}: ${tgtTxt}${waitTxt}</button>`;
            } else {
              const mCost = Engine.getManagerCost(b.id);
              const canHire = STATE.currencies.files >= mCost;
              mgrHtml = `<button type="button" class="mgr-btn" data-action="hire-manager" data-biz="${b.id}" data-bind="mgr-btn-${b.id}" ${canHire ? "" : "disabled"}>${renderIcon("crew", 12)} ${t("mgr.hire")} • <span class="num">${formatNumber(mCost, 0)}</span> ${t("ui.curr.files")}</button>`;
            }

            html.push(`
              <article class="biz-card has-rail ${isLaunder ? "m-launder" : "m-hustle"} ${epCls}">
                <div class="biz-rail"><i data-bind="biz-msbar-${b.id}"></i><span class="biz-rail-txt num" data-bind="biz-ms-${b.id}">×2 bei lvl 25</span></div>
                <div class="biz-top">
                  <div class="biz-identity">
                    <div class="biz-icon">${renderIcon(b.iconKey, 17)}</div>
                    <div class="biz-title-wrap">
                      <div class="biz-name">${t(b.nameKey)}</div>
                      <div class="biz-meta"><span class="num" data-bind="biz-cps-${b.id}">0,00</span> €/s</div>

      updateCoach() {
        const card = document.getElementById("coach-card");
        if (!card) return;
        if (!STATE.ui.tips || typeof STATE.ui.tips !== "object") STATE.ui.tips = { off: false, done: {} };
        const tips = STATE.ui.tips;
        if (!tips.done || typeof tips.done !== "object") tips.done = {};
        let cur = null;
        if (!tips.off && tips.replay) {
          cur = COACH_STEPS.find(st => !tips.done[st.id]) || null;
          if (!cur) tips.replay = false;
        } else if (!tips.off && (STATE.stats.prestigeCount || 0) === 0) {
          for (const st of COACH_STEPS) {
            if (tips.done[st.id]) continue;
            if (st.done()) { tips.done[st.id] = true; continue; }
            if (st.tab && STATE.ui.activeTab !== st.tab) continue;
            if (st.when()) { cur = st; break; }
          }
        }
        if (cur && !tips.replay && this._coachId !== cur.id && Date.now() < (this._coachGap || 0)) cur = null;
        const sig = cur ? cur.id + "|" + (STATE.settings.lang || "DE") : "";
        if (sig !== this._coachSig) {
          this._coachSig = sig;
          if (!cur) {
            card.hidden = true;
            card.innerHTML = "";
          } else {
            const idx = COACH_STEPS.indexOf(cur) + 1;
            card.innerHTML =
              `<div class="coach-head"><span class="coach-step num">${t("tip.label", { n: idx, m: COACH_STEPS.length })}</span><b>${t("tip." + cur.id + ".title")}</b></div>` +

      _fitDue(el, txt) {
        if (el._fitTxt === txt) return false;
        el._fitTxt = txt;
        const n = performance.now();
        if (el._fitLen === txt.length && n - (el._fitAt || 0) < 2000) return false;
        el._fitLen = txt.length; el._fitAt = n;
        return true;
      },

      fitHeaderVals() {
        document.querySelectorAll(".cash-hero-val").forEach(el => {
          const txt = el.textContent;
          if (!this._fitDue(el, txt)) return;
          el.style.removeProperty("font-size");
          let size = parseFloat(getComputedStyle(el).fontSize) || 20, n = 0;
          const pcs = getComputedStyle(el.parentElement);
          const avail = el.parentElement.clientWidth - parseFloat(pcs.paddingLeft) - parseFloat(pcs.paddingRight);
          while (el.scrollWidth > avail + 0.5 && size > 11 && n++ < 16) {
            size -= 1;
            el.style.setProperty("font-size", size + "px", "important");
          }
        });
        document.querySelectorAll(".cash-hero-sub").forEach(el => {
          const txt = el.textContent;
          if (!this._fitDue(el, txt)) return;
          const kids = Array.from(el.children);
          kids.forEach(k => k.style.removeProperty("font-size"));
          const base = kids.map(k => parseFloat(getComputedStyle(k).fontSize) || 11);
          let d = 0;
          while (el.scrollWidth > el.clientWidth + 0.5 && d < 4) {
            d += 1;
            kids.forEach((k, i) => k.style.setProperty("font-size", Math.max(8, base[i] - d) + "px", "important"));
          }
        });
        document.querySelectorAll(".cur-val").forEach(el => {
          const txt = el.textContent;
          if (!this._fitDue(el, txt)) return;
          const nb = el.querySelector("b");
          if (!nb) return;
          nb.style.removeProperty("font-size");
          const cell = el.parentElement;
          const cs = getComputedStyle(cell);
          const avail = cell.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
          let size = parseFloat(getComputedStyle(nb).fontSize) || 15, n = 0;
          while (el.getBoundingClientRect().width > avail + 0.5 && size > 9 && n++ < 12) {
            size -= 1;
            nb.style.setProperty("font-size", size + "px", "important");
          }
        });
      },

          const sortedTurf = KIEZ_API.getSortedCollection("TURF");
          for (let i = 0; i < sortedTurf.length; i++) {
            const tf = sortedTurf[i];
            const st = STATE.turf[tf.id];
            const btnNode = b[`turf-btn-${tf.id}`];
            if (btnNode) btnNode.disabled = st.level >= tf.maxLevel || STATE.currencies.cash < Engine.getTurfCost(tf.id);
          }
        } else if (STATE.ui.activeTab === "cartel") {
          const sub = STATE.ui.cartelSubTab || "crew";
          if (sub === "market") {
            const ms = STATE.marketState || { timer: 45 };
            if (b["market-timer"]) setTxt(b["market-timer"], t("market.refresh", { sec: Math.ceil(ms.timer || 45) }));

            for (const gKey of ["drugs", "weapons", "stolen", "tickets"]) {
              const stock = Math.floor(STATE.currencies[gKey] || 0);
              const unitVal = Engine.getMarketUnitPrice(gKey, stats);
              if (b[`mkt-stock-${gKey}`]) setTxt(b[`mkt-stock-${gKey}`], t("market.stock", { val: formatNumber(stock, 0) }));
              if (b[`mkt-unit-${gKey}`]) setTxt(b[`mkt-unit-${gKey}`], t("market.unit_val", { val: formatNumber(unitVal, 0) }));
              const pay0 = STATE.ui.marketPay === "dirty" ? "dirty" : "cash";
              const sm = pay0 === "dirty" ? 1.35 : 1;
              if (b[`mkt-s1-${gKey}`]) b[`mkt-s1-${gKey}`].disabled = stock < 1;
              if (b[`mkt-p1-${gKey}`]) setTxt(b[`mkt-p1-${gKey}`], `+${formatNumber(unitVal * sm, 0)} €`);
              if (b[`mkt-s5-${gKey}`]) b[`mkt-s5-${gKey}`].disabled = stock < 5;
              if (b[`mkt-p5-${gKey}`]) setTxt(b[`mkt-p5-${gKey}`], `+${formatNumber(unitVal * 5 * sm, 0)} €`);
              if (b[`mkt-sall-${gKey}`]) b[`mkt-sall-${gKey}`].disabled = stock < 1;
              if (b[`mkt-pall-${gKey}`]) setTxt(b[`mkt-pall-${gKey}`], `+${formatNumber(unitVal * Math.max(1, stock) * sm, 0)} €`);
              const pay = STATE.ui.marketPay === "dirty" ? "dirty" : "cash";
              const mx = Engine.getMarketBuyMax(gKey, stats, pay);
              const ask = mx.ask;
              const room = mx.room;
              const mult = (ms.mults && ms.mults[gKey]) || 1.0;
              const be = Math.round((mult * MARKET_BUY_SPREAD - 1) * 100);
              const hintTxt = pay === "dirty"
                ? t("market.launder_hint", { left: formatNumber(mx.left, 0) })
                : t("market.buy_hint", { be: (be >= 0 ? "+" : "") + be });
              if (b[`mkt-be-${gKey}`]) setTxt(b[`mkt-be-${gKey}`], hintTxt);
              if (b[`mkt-lager-${gKey}`]) setTxt(b[`mkt-lager-${gKey}`], t("market.lager", { held: mx.held, cap: mx.cap }));
              if (b[`mkt-b1-${gKey}`]) b[`mkt-b1-${gKey}`].disabled = mx.units < 1;
              if (b[`mkt-bp1-${gKey}`]) setTxt(b[`mkt-bp1-${gKey}`], `−${formatNumber(ask, 0)} €`);
              if (b[`mkt-b5-${gKey}`]) b[`mkt-b5-${gKey}`].disabled = mx.units < 5;
              if (b[`mkt-bp5-${gKey}`]) setTxt(b[`mkt-bp5-${gKey}`], `−${formatNumber(ask * 5, 0)} €`);
              if (b[`mkt-bm-${gKey}`]) b[`mkt-bm-${gKey}`].disabled = mx.units < 1;
              if (b[`mkt-bpm-${gKey}`]) setTxt(b[`mkt-bpm-${gKey}`], `−${formatNumber(ask * Math.max(1, mx.units), 0)} €`);
            }
            if (b["mkt-swap-stolen"]) b["mkt-swap-stolen"].disabled = (STATE.currencies.stolen || 0) < 10;
            if (b["mkt-swap-tickets"]) b["mkt-swap-tickets"].disabled = (STATE.currencies.tickets || 0) < 10;
          } else if (sub === "ware") {
            const sortedItems = KIEZ_API.getSortedCollection("ITEMS");
            for (let i = 0; i < sortedItems.length; i++) {
              const it = sortedItems[i];
              const btnNode = b[`item-btn-${it.id}`];
              if (btnNode) btnNode.disabled = !Engine.canAffordItem(it.id);
            }
          } else {
            const sortedGang = KIEZ_API.getSortedCollection("GANG");
            for (let i = 0; i < sortedGang.length; i++) {
              const c = sortedGang[i];
              const st = STATE.gang[c.id];
              const btnNode = b[`g-btn-${c.id}`];
              if (btnNode) btnNode.disabled = st.level >= c.maxLevel || STATE.currencies.cred < Engine.getGangCost(c.id);
            }
          }
        } else if (STATE.ui.activeTab === "hq") {
          const sub = STATE.ui.hqSubTab || "office";
          if (sub === "coups") {
            const freeReady = (STATE.missionRerollTimer || 0) <= 0;
            if (b["reroll-free-btn"]) b["reroll-free-btn"].disabled = !freeReady;
            if (b["reroll-free-lbl"]) {
              setTxt(b["reroll-free-lbl"], freeReady ? t("mis.reroll.free") : t("mis.reroll.wait", { sec: Math.ceil(STATE.missionRerollTimer) }));
            }
            if (b["reroll-favor-btn"]) b["reroll-favor-btn"].disabled = STATE.currencies.favors < 1;

            if (STATE.activeMission) {
              const am = STATE.activeMission;
              const pct = am.totalSec > 0 ? Math.min(100, Math.max(0, ((am.totalSec - am.remainingSec) / am.totalSec) * 100)) : 100;
              if (b["active-mis-bar"]) b["active-mis-bar"].style.width = `${pct}%`;
              if (b["active-mis-lbl"]) {
                b["active-mis-lbl"].textContent = am.remainingSec <= 0
                  ? t("mis.active.collect")
                  : t("mis.active.running", { sec: Math.ceil(am.remainingSec), chance: Math.round(am.chance * 100) });
              }
              if (b["active-mis-claim"]) b["active-mis-claim"].disabled = am.remainingSec > 0;
            }

            for (let i = 0; i < STATE.missionBoard.length; i++) {
              const offer = STATE.missionBoard[i];
              const btn = b[`offer-btn-${i}`];
              if (btn) btn.disabled = !Engine.canStartOffer(offer, stats);
            }
          } else if (sub === "milestones") {
            const sortedBoard = KIEZ_API.getSortedCollection("BOARD");
            for (let i = 0; i < sortedBoard.length; i++) {
              const task = sortedBoard[i];
              const status = Engine.getBoardTaskStatus(task.id, stats);
              const dec = task.metricType === "cps" ? 2 : 0;
              const currFmt = formatNumber(Math.min(status.current, status.target), dec);
              const targetFmt = formatNumber(status.target, dec);
              const pct = status.target > 0 ? Math.min(100, Math.max(0, (status.current / status.target) * 100)) : 0;

              const barNode = b[`board-bar-${task.id}`];
              if (barNode) barNode.style.width = `${pct}%`;

              const btnNode = b[`board-btn-${task.id}`];
              if (btnNode) btnNode.disabled = !status.ready;

              const txtNode = b[`board-btntext-${task.id}`];
              if (txtNode) setTxt(txtNode, status.ready ? t("board.claim") : t("board.progress", { curr: currFmt, target: targetFmt }));
            }
          } else if (sub === "vault") {
            if (b["arch-liferev"]) setTxt(b["arch-liferev"], formatNumber(STATE.stats.lifetimeRevenue));
            if (b["arch-filestotal"]) setTxt(b["arch-filestotal"], formatNumber(STATE.stats.filesEarnedTotal, 0));

            const claimable = Engine.getClaimableFiles();
            const pBtn = b["arch-prestige-btn"];
            const pLbl = b["arch-prestige-label"];
            const isPrestigeConfirm = this.confirmState.type === "prestige";
            if (pBtn && pLbl) {
              pBtn.disabled = claimable < 1;
              pBtn.classList.toggle("confirm-pulse", isPrestigeConfirm && claimable >= 1);
              if (claimable >= 1) {
                pLbl.textContent = isPrestigeConfirm
                  ? t("archive.prestige.confirm", { files: formatNumber(claimable, 0) })
                  : t("archive.prestige.btn", { files: formatNumber(claimable, 0) });
              } else {
                setTxt(pLbl, t("archive.prestige.locked", { missing: formatNumber(Math.max(0, Engine.getPrestigeMin() - (STATE.stats.runRevenue || 0))) }));
              }
            }

            const resetBtn = b["hard-reset-btn"];
            if (resetBtn) {
              const isResetConfirm = this.confirmState.type === "reset";
              resetBtn.classList.toggle("confirm-pulse", isResetConfirm);
              setTxt(resetBtn, isResetConfirm ? t("archive.save.reset_confirm") : t("archive.save.reset"));
            }

            const sortedPup = KIEZ_API.getSortedCollection("PRESTIGE_UPGRADES");
            for (let i = 0; i < sortedPup.length; i++) {
              const p = sortedPup[i];
              const st = STATE.prestigeUpgrades[p.id];
              const btnNode = b[`pup-btn-${p.id}`];
              if (btnNode) btnNode.disabled = st.level >= p.maxLevel || Engine.pupLocked(p.id) || STATE.currencies.files < Engine.getPrestigeUpgradeCost(p.id);
            }
          } else {
            if (b["boss-header"]) setTxt(b["boss-header"], t("ui.boss.header"));
            if (b["boss-speech"]) {
              setTxt(b["boss-speech"], STATE.boss.customQuote ? STATE.boss.customQuote : t(STATE.boss.quoteKey || "ui.boss.quote.1"));
            }
            if (b["click-val"]) setTxt(b["click-val"], `+${formatNumber(stats.clickValue)} €`);

            const hBtn = document.getElementById("hustle-btn");
            if (hBtn) hBtn.classList.toggle("overdrive", combo >= 6);
            const lettersBox = document.getElementById("hustle-letters");
            if (lettersBox) {
              const spans = lettersBox.children;
              for (let i = 0; i < spans.length; i++) spans[i].classList.toggle("lit", i < combo);
            }
            if (b["hustle-combo-tag"]) {
              setTxt(b["hustle-combo-tag"], slangDisplay);
            }

            if (b["razzia-timer"]) {
              const tags = [];
              if (STATE.boostTimer > 0) tags.push(`×2 ${Math.ceil(STATE.boostTimer)}s`);
              if (STATE.razziaCooldown > 0) tags.push(`SHIELD ${Math.ceil(STATE.razziaCooldown)}s`);
              setTxt(b["razzia-timer"], tags.join(" • "));
            }

            const sortedOffice = KIEZ_API.getSortedCollection("OFFICE");
            for (let i = 0; i < sortedOffice.length; i++) {
              const o = sortedOffice[i];
              const st = STATE.office[o.id];
              const btnNode = b[`off-btn-${o.id}`];
              if (btnNode) btnNode.disabled = st.level >= o.maxLevel || STATE.currencies.cash < Engine.getOfficeCost(o.id);
            }

            if (b["board-boost-status"]) {
              b["board-boost-status"].textContent = STATE.boostTimer > 0
                ? t("board.ops.boost.active", { sec: Math.ceil(STATE.boostTimer) })
                : t("board.ops.boost.idle");
            }
            if (b["favor-btn-cool"]) b["favor-btn-cool"].disabled = STATE.currencies.favors < 5;
            if (b["favor-btn-boost"]) b["favor-btn-boost"].disabled = STATE.currencies.favors < 8;
            if (b["favor-btn-cash"]) b["favor-btn-cash"].disabled = STATE.currencies.favors < 6;
          }
        }
        this.updateCoach();
        this.fitHeaderVals();
      },

      showJobModal() {
        const en = STATE.settings && STATE.settings.lang === "EN";
        const L = (d, e) => en ? e : d;
        const body = document.getElementById("app-modal-body");
        body.innerHTML = `
          <h2 class="panel-title">${L("Team-Tagesjob", "Team daily job")}</h2>
          <div class="cash-hero-box"><span class="num" id="job-info">${SOC.JOB_SEC}.0 s · 0</span></div>
          <button type="button" class="comic-btn primary job-tap" id="job-tap">${L("LOS!", "GO!")}</button>`;
        document.getElementById("app-modal").classList.add("open");
        const btn = document.getElementById("job-tap"), info = document.getElementById("job-info");
        let n = 0, t0 = 0, done = false;
        const fin = () => {
          if (done) return; done = true;
          clearInterval(iv);
          SOC.jobFinish(n);
          Platform.saveGame(true);
          document.getElementById("app-modal").classList.remove("open");
          this.renderActiveTab();
          this.toast(L("Geschafft: ", "Done: ") + n + " Taps", "");
        };
        const iv = setInterval(() => {
          if (!t0) return;
          const left = SOC.JOB_SEC - (performance.now() - t0) / 1000;
          if (left <= 0) fin(); else info.textContent = left.toFixed(1) + " s · " + n;
        }, 80);
        btn.addEventListener("pointerdown", e => {
          e.preventDefault();
          if (done) return;
          if (!t0) { t0 = performance.now(); btn.textContent = "TAP!"; }
          n++; info.textContent = Math.max(0, SOC.JOB_SEC - (performance.now() - t0) / 1000).toFixed(1) + " s · " + n;
          try { Platform.haptic(6); } catch (e2) {}
        });
        btn.addEventListener("click", e => e.stopPropagation());
      },

      async friendAction(kind, rid) {

        if (kind === "request") {

      copyText(txt, okMsg) {
        const en = STATE.settings && STATE.settings.lang === "EN";
        const done = ok => this.toast(ok ? (okMsg || (en ? "Copied – paste it into a chat" : "Kopiert – im Chat einfügen")) : (en ? "Copy failed – long-press the text to copy" : "Kopieren ging nicht – Text lange antippen und kopieren"), "");
        const legacy = () => {
          let ok = false;
          try {
            const ta = document.createElement("textarea");
            ta.value = txt; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
            document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
            ok = document.execCommand("copy"); ta.remove();
          } catch (e) { ok = false; }
          done(ok);
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => done(true), legacy);
          else legacy();
        } catch (e) { legacy(); }
      },

      shareOrCopy(txt) {
        if (navigator.share) {
          try { navigator.share({ text: txt }).catch(err => { if (!err || err.name !== "AbortError") this.copyText(txt); }); } catch (e) { this.copyText(txt); }
        } else this.copyText(txt);
      },

          ${mrow(L("Crew", "Crew"), bd.clickGang, "c-gain")}
          ${mrow(L("Razzia-Schutz", "Raid shield"), bd.clickShield, "c-gain")}
          ${bd.clickDamp < 0.999 ? mrow(L("Dämpfung (Wurzel)", "Damping (root)"), bd.clickDamp, "c-cost") : ""}
          ${row(L("Hustle-Verstärkung", "Hustle boost"), "×1,50", "c-gain")}
          ${row(L("Ertrag pro Tipp (Krit ×5)", "Per tap (crit ×5)"), formatNumber(st.clickValue * 1.5) + " €", "c-gain", true)}
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
            <button type="button" class="comic-btn" data-action="open-bilanz">${L("Gesamt-Bilanz", "Full ledger")}</button>
            <button type="button" class="comic-btn primary" data-action="close-modal">${t("modal.close")}</button>
          </div>`;
        document.getElementById("app-modal").classList.add("open");
      },

      showRadioModal() {
        const en = STATE.settings && STATE.settings.lang === "EN";
        const body = document.getElementById("app-modal-body");
        const news = Engine.getRadioNews();
        STATE.ui.radioSeen = Engine.getRadioSig();
        const esc = x => String(x).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
        const rows = news.map(n => `<div class="radio-row k-${n.kind}"><span class="radio-tag">${esc(n.tag)}</span><span class="radio-txt">${esc(n.text)}</span></div>`).join("");
        body.innerHTML = `<h2 class="panel-title">${en ? "Radio" : "Funk"}</h2><div class="radio-list">${rows}</div><button type="button" class="comic-btn primary" data-action="close-modal">${t("modal.close")}</button>`;
        document.getElementById("app-modal").classList.add("open");
        Platform.playTone("news");
      },

      showIdentityModal(field) {
        const en = STATE.settings && STATE.settings.lang === "EN";
        const isName = field === "name";
        const val = (isName ? STATE.boss.name : STATE.boss.city) || "";
        const body = document.getElementById("app-modal-body");
        body.innerHTML = `
          <h2 class="panel-title">${isName ? (en ? "Name plate" : "Namensschild") : (en ? "Globe" : "Globus")}</h2>
          <input id="id-edit-input" type="text" class="code-textarea" style="min-height:38px; height:38px;" value="${String(val).replace(/"/g, "&quot;")}" maxlength="${isName ? 22 : 24}">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
            <button type="button" class="comic-btn primary" data-action="save-identity" data-field="${field}">${t("archive.boss.save")}</button>
            <button type="button" class="comic-btn" data-action="close-modal">${t("modal.close")}</button>
          </div>`;
        document.getElementById("app-modal").classList.add("open");
      },

      showBilanzModal() {
        const stats = Engine.getStats();
        const itemProg = Engine.getCollectionProgress("ITEMS");
        const bizProg = Engine.getCollectionProgress("BUSINESSES");
        const modal = document.getElementById("app-modal");
        const body = document.getElementById("app-modal-body");

        body.innerHTML = `
          <h2 class="panel-title">${t("archive.title")}</h2>
          <div class="stat-row">
            <span>${t("bilanz.cps")}</span>
            <span class="num">${formatNumber(stats.cleanIncomeCps)} €/s</span>
          </div>
          <div class="stat-row">
            <span>${t("bilanz.wash_cap")}</span>
            <span class="num">${formatNumber(stats.washCapacityCps)} €/s</span>
          </div>
          <div class="stat-row">
            <span>${t("bilanz.dirty_cps")}</span>
            <span class="num">${formatNumber(stats.grossDirtyCps)} €/s</span>
          </div>
          <div class="stat-row">
            <span>${t("bilanz.launder_eff")}</span>
            <span class="num">${Math.round(stats.washEfficiency * 100)}%</span>
          </div>
          <div class="stat-row">
            <span>${t("bilanz.liferev")}</span>
            <span class="num">${formatNumber(STATE.stats.lifetimeRevenue)} €</span>
          </div>
          <div class="stat-row">
            <span>${t("bilanz.files_mul")}</span>
            <span class="num">×${formatNumber(stats.prestigeMul * stats.pupIncomeMul, 2)}</span>
          </div>
          <div class="stat-row">
            <span>${t("bilanz.crew_mul")}</span>
            <span class="num">×${formatNumber(stats.gangIncomeMul * stats.itemGlobalIncomeMul * stats.officeIncomeMul, 2)}</span>
          </div>
          <div class="stat-row">
            <span>${t("bilanz.biz_owned")}</span>
            <span class="num">${bizProg.owned} / ${bizProg.total}</span>
          </div>
          <div class="stat-row">
            <span>${t("bilanz.goods_owned")}</span>
            <span class="num">${itemProg.owned} / ${itemProg.total}</span>
          </div>
          <div class="stat-row">
            <span>${t("bilanz.heat_net")}</span>
            <span class="num">${stats.heatNetPerSec >= 0 ? "+" : ""}${formatNumber(stats.heatNetPerSec, 2)}%/s</span>
          </div>
          <div class="stat-row">
            <span>${t("bilanz.offline_max")}</span>
            <span class="num">${stats.maxOfflineHours} ${t("bilanz.hours")}</span>
          </div>
          <div class="stat-row">
            <span>${t("bilanz.raids")}</span>
            <span class="num">${STATE.stats.razziaCount}</span>
          </div>
          <button type="button" class="comic-btn primary" data-action="close-modal">${t("modal.close")}</button>
        `;
        modal.classList.add("open");
      }
    };

    (function boot() {
      hydrateRegistry();
      const loaded = Platform.loadGame();
      if (loaded) Engine.applyLoadedState(loaded, true);
      else Engine.ensureStateIntegrity();
      View.init();
      Online.start();

      setInterval(() => {
        if (!document.hidden) STATE.stats.playSec = (STATE.stats.playSec || 0) + 0.1;
        if (++View._tabChk >= 10) { View._tabChk = 0; try { View.checkTabUnlocks(); } catch (e) {} }
        const tickRes = Engine.tick();
        { const ach = Engine.checkAchievements(); if (ach.length) View.onAchievements(ach); }
        if (Engine.inspNote) { const n = Engine.inspNote; Engine.inspNote = null; View.onInspNote(n); }
        if (Engine.warNote) { const n = Engine.warNote; Engine.warNote = null; View.onWarNote(n); }
        View.updateWarUI();
        if (tickRes.trendFlippedUp && STATE.heat > 15) {
          View.triggerHeatFlipFlash();
        }
        if (tickRes.razziaTriggered) {
          DBG.add("RAZZIA", "heat=" + STATE.heat.toFixed(1));
          Platform.playTone("alarm");
          Platform.haptic(60);
          FX.shake(); FX.flash("rgba(230,40,40,.5)");
          if (Engine.firstRaidNote) { Engine.firstRaidNote = false; const en1 = STATE.settings && STATE.settings.lang === "EN"; View.toast(en1 ? "FIRST RAID" : "ERSTE RAZZIA", en1 ? "Forgiven this time. Next time they seize cash." : "Diesmal verziehen. Beim nächsten Mal wird beschlagnahmt."); }
        }
        if (tickRes.missionFinished || tickRes.spotBecameReady) {
          if (tickRes.missionFinished) {
            DBG.add("COUP", "finished");
            Platform.playTone("coin", 6);
            Platform.haptic(25);
          }
          if (STATE.ui.activeTab === "hq") View.renderActiveTab();
        }
        if (tickRes.marketShifted) DBG.add("MARKET", "rates shifted");
        if (DBG._lock !== !!STATE.dirtyLock) { DBG._lock = !!STATE.dirtyLock; DBG.add("LOCK", STATE.dirtyLock ? "dirty locked" : "dirty unlocked"); }
        if (++DBG._snapN >= 100) { DBG._snapN = 0; DBG.snapshot(); }
        if (tickRes.marketShifted && STATE.ui.activeTab === "cartel" && STATE.ui.cartelSubTab === "market") {
          View.renderActiveTab();
        }
        View.updateTickUI(tickRes.stats, tickRes.smoothedHeatNet);
        if (tickRes.managerStructural && STATE.ui.activeTab === "businesses") View.renderActiveTab();

        View.saveTickCounter += 1;
        if (View.saveTickCounter >= 50) {
          View.saveTickCounter = 0;
          Platform.saveGame(true);
        }
      }, 100);

      // === Update-Hinweis: fragt die Seite selbst ab und bietet Neuladen an, wenn eine neue Version online ist ===
      (function () {
        const meta = typeof document !== "undefined" && document.querySelector('meta[name="build-id"]');
        const mine = meta && meta.getAttribute("content");
        if (!mine || typeof location === "undefined" || !/^https?:$/.test(location.protocol)) return; // nur auf der Website, nicht lokal
        let shown = false;
        function showBanner() {
          if (shown) return; shown = true;
          const el = document.createElement("div");
          el.className = "update-banner";
          el.innerHTML = '<span></span><button type="button"></button>';
          el.firstChild.textContent = t("update.msg");
          const btn = el.lastChild; btn.textContent = t("update.btn");
          btn.addEventListener("click", () => { try { Platform.saveGame(true); } catch (e) {} location.reload(); });
          document.body.appendChild(el);
        }
        async function check() {
          if (shown) return;
          try {
            const r = await fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" });
            if (!r.ok) return;
            const txt = await r.text();
            const m = txt.match(/<meta name="build-id" content="([^"]+)"/);
            if (m && m[1] !== mine) showBanner();
          } catch (e) {}
        }
        setTimeout(check, 30000);
        setInterval(check, 10 * 60 * 1000);
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") setTimeout(check, 1500); });
      })();
    })();
  </script>
</body>
</html>
