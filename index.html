  <!-- === [SECTION: STYLES] === -->
  <style>
:root {
  --bg-paper: #FBF8F0;
  --bg-card: #F2EDE0;
  --bg-panel: #EAE3D1;
  --ink-black: #1A1A1A;
  --text: #1A1A1A;
  --line: #1A1A1A;
  --surface-hi: #FFFDF7;
  --surface-warm: #FDF4E3;
  --tint-red: #FFD6CF;
  --tint-red-ink: #8F1D0E;
  --tint-green: #DCF2C8;
  --tint-green-ink: #27520A;
  --tint-blue: #DCE8FF;
  --p0:#D4EAE4;
  --p1:#D7EEF7;
  --p2:#D8D8D8;
  --p3:#E2D9F3;
  --p4:#E2DDD0;
  --p5:#E4E0D6;
  --p6:#E9D8F7;
  --p7:#E9E5D8;
  --p8:#F5E0C3;
  --p9:#F7D4D4;
  --p10:#FADBA6;
  --p11:#FFE2C4;
  --p12:#FFF2B2;
  --p13:#FFF6DC;
  --blue-ink: #1B4BB5;
  --border-comic: 2px solid var(--line);
  --shadow-comic: 3px 3px 0 var(--line);
  --shadow-comic-sm: 2px 2px 0 var(--line);
  --accent-toxic-bright: #7BC938;
  --accent-gold: #E2A326;
  --accent-dirty: #C97A1E;
  --accent-concrete: #6E716C;
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --accent-toxic:#5B9628;
  --c-gain:#5B9628;
  --c-stealth:#34B37E;
  --c-hustle:#E2A326;
  --c-cost:#E04836;
  --c-heat:#2563EB;
  --danger-heat:#E04836;
  --c-cash:#5B9628;
  --c-dirty:#C97A1E;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
html, body {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background-color: #111111;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.3;
}
.comic-svg {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}
#app-shell {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100dvh;
  margin: 0 auto;
  background-color: var(--bg-paper);
  background-image: radial-gradient(rgba(26, 26, 26, 0.06) 1px, transparent 0);
  background-size: 11px 11px;
  display: flex;
  flex-direction: column;
  border-left: var(--border-comic);
  border-right: var(--border-comic);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  overflow: hidden;
}
/* === FLAT, DE-BOXED COMIC HEADER === */
.top-header {
  position: relative;
  z-index: 15;
  border-bottom: var(--border-comic);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  width: 100%;
}
.cash-dual-grid {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.cash-hero-box {
  min-width: 0;
  border: var(--border-comic);
  box-shadow: var(--shadow-comic-sm);
  padding: 4px 7px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 2px;
}
.cash-hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-width: 0;
}
.cash-hero-tag {
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--accent-concrete);
  white-space: nowrap;
}
.cps-pill {
  white-space: nowrap;
  flex-shrink: 0;
}
.cps-pill.dirty-pill {
  background: var(--p10);
}
.cash-hero-val {
  font-size: clamp(13px, 3.8vw, 16px);
  color: var(--text);
}
.depot-cap-sub {
  font-weight: 700;
  color: var(--accent-concrete);
}
.depot-mini-bar {
  overflow: hidden;
}
.depot-mini-fill {
  width: 0%;
  background: var(--accent-dirty);
  transition: width 0.12s linear, background-color 0.2s ease;
}
.depot-mini-fill.full {
  background: var(--danger-heat);
}
/* FLAT STATUS + 4 CONTRABAND STRIP */
.flat-status-strip {
  border-bottom: 1.5px solid rgba(26, 26, 26, 0.22);
}
.status-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
}
.status-metrics {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-width: 0;
}
.stat-pill-item {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  white-space: nowrap;
}
.stat-pill-lbl {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--accent-concrete);
}
.status-action-group {
  display: inline-flex;
  gap: 4px;
  flex-shrink: 0;
}
.mini-square-btn {
  min-width: 26px;
  min-height: 23px;
  padding: 0 5px;
  background: var(--bg-paper);
  border: 1.5px solid var(--line);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 900;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  touch-action: manipulation;
}
.mini-square-btn:active, .comic-btn:active {
  transform: translate(1.5px, 1.5px);
  box-shadow: none;
}
.contra-row-flat {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding-top: 2px;
}
.contra-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 10px;
  white-space: nowrap;
  min-width: 0;
  border-right: 1px solid rgba(26, 26, 26, 0.2);
}
.contra-cell:last-child {
  border-right: none;
}
.contra-mini-lbl {
  font-size: 8.5px;
  font-weight: 900;
  color: var(--accent-concrete);
  text-transform: uppercase;
}
/* FLAT HEAT STRIP */
@keyframes heatPulseWarn{
      0%, 100% { background-color: transparent; }
      50% { background-color: rgba(204, 59, 40, 0.14); }
    }
@keyframes heatFlipFlash{
      0% { background-color: rgba(255, 206, 59, 0.55); }
      100% { background-color: transparent; }
    }
.heat-strip {
  padding: 1px 2px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.heat-strip.rising-warn {
  animation: heatPulseWarn 0.9s infinite ease-in-out;
}
.heat-strip.trend-flip {
  animation: heatFlipFlash 0.65s ease-out;
}
.heat-info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  min-width: 0;
}
.heat-left-cluster {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}
.heat-overlay-text {
  font-weight: 900;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.heat-trend-pill {
  font-weight: 900;
  border: 1px solid rgba(26, 26, 26, 0.6);
  background: var(--bg-paper);
  color: var(--text);
  white-space: nowrap;
  flex-shrink: 0;
}
.heat-trend-pill.trend-up {
  background: var(--tint-red);
  color: var(--tint-red-ink);
  border-color: var(--tint-red-ink);
}
.heat-trend-pill.trend-down {
  background: var(--tint-green);
  color: var(--tint-green-ink);
  border-color: var(--tint-green-ink);
}
.heat-track {
  position: relative;
  background: var(--bg-paper);
  border: 1.5px solid var(--line);
  overflow: hidden;
}
.heat-track::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 60%;
  right: 0;
  background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 4px,
        rgba(26, 26, 26, 0.08) 4px,
        rgba(26, 26, 26, 0.08) 8px
      );
  pointer-events: none;
  z-index: 1;
}
.heat-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0%;
  background: var(--accent-toxic);
  transition: width 0.1s linear, background-color 0.2s ease;
  z-index: 1;
}
.heat-fill.warn {
  background: var(--accent-gold);
}
.heat-fill.danger {
  background: var(--danger-heat);
}
.heat-zone-marker {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1.5px;
  background: var(--line);
  z-index: 2;
}
/* === FLUSH 100%-WIDTH CONTROL BAR === */
.control-bar {
  position: relative;
  z-index: 25;
  width: 100%;
  max-width: 100%;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  padding: 5px 8px;
  border-bottom: var(--border-comic);
  flex-shrink: 0;
  gap: 6px;
  overflow: hidden;
}
.control-bar.hidden {
  display: none;
}
.flip-all-btn {
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 8px;
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  font-family: var(--font-sans);
  font-weight: 900;
  font-size: 10px;
  text-transform: uppercase;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  touch-action: manipulation;
}
.flip-all-btn:active {
  background: var(--line);
  color: #FFCE3B;
}
.heat-fill.warn,.heat-fill.danger,.heat-fill.crit {
  background:#4D8DFF!important;
}
.hustle-btn {
  transition:transform .08s cubic-bezier(.3,1.6,.5,1);
}
.hustle-btn:active {
  transform:scale(.9) translate(2px,2px)!important;
}
.hustle-btn.punch {
  animation:hPunch .16s ease-out;
}
@keyframes hPunch{0%{transform:scale(.88)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
.svg-crew {
  pointer-events:none;
}
.mini-hustle-btn {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 36px;
  background: var(--accent-gold);
  color: var(--text);
  border: var(--border-comic);
  box-shadow: var(--shadow-comic-sm);
  padding: 2px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
  overflow: visible;
}
.mini-hustle-btn:active {
  transform: translate(1.5px, 1.5px);
  box-shadow: none;
}
@keyframes hustleOverdrivePulse{
      0%, 100% {
        background-color: #FFCE3B;
        box-shadow: 2px 2px 0 var(--line), 0 0 8px rgba(255, 206, 59, 0.95);
      }
      50% {
        background-color: #8CE043;
        box-shadow: 2px 2px 0 var(--line), 0 0 14px rgba(140, 224, 67, 1);
      }
    }
.mini-hustle-btn.overdrive, .hustle-btn.overdrive {
  animation: hustleOverdrivePulse 0.45s infinite ease-in-out;
}
.mini-hustle-top {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
}
.mini-hustle-btn.overdrive .mini-hustle-top {
  color: var(--tint-red-ink);
}
.mini-hustle-val {
  font-size: 10.5px;
  font-weight: 900;
  line-height: 1.1;
  white-space: nowrap;
}
.buy-mode-group {
  flex: 0 0 auto;
  display: flex;
  border: 1.5px solid var(--line);
  background: var(--bg-card);
}
.mode-btn {
  min-width: 32px;
  min-height: 33px;
  padding: 0 4px;
  background: transparent;
  border: none;
  border-right: 1px solid rgba(26, 26, 26, 0.45);
  font-family: var(--font-mono);
  font-weight: 900;
  font-size: 10px;
  color: var(--text);
  cursor: pointer;
  touch-action: manipulation;
}
.mode-btn:last-child {
  border-right: none;
}
.mode-btn.active {
  background: var(--line);
  color: #FFCE3B;
}
/* === SUB-TABS === */
.subnav-bar-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: var(--border-comic);
  box-shadow: var(--shadow-comic-sm);
  background: var(--bg-card);
  flex-shrink: 0;
}
.subnav-bar-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border: var(--border-comic);
  box-shadow: var(--shadow-comic-sm);
  background: var(--bg-card);
  flex-shrink: 0;
}
.subtab-btn {
  min-height: 34px;
  padding: 0 3px;
  border: none;
  border-right: 1.5px solid var(--line);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  white-space: nowrap;
  touch-action: manipulation;
}
.subtab-btn:last-child {
  border-right: none;
}
.subtab-btn.active {
  background: var(--line);
  color: #FFCE3B;
}
/* === BLACK MARKET EXCHANGE === */
.market-ticker-box {
  background: var(--line);
  color: #FFCE3B;
  padding: 5px 8px;
  font-size: 11px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.market-rate-pill {
  font-size: 10.5px;
  font-weight: 900;
  padding: 1px 6px;
  border: 1.5px solid var(--line);
  background: var(--bg-paper);
  white-space: nowrap;
}
.market-rate-pill.boom {
  background: var(--tint-green);
  color: var(--tint-green-ink);
  border-color: var(--tint-green-ink);
}
.market-rate-pill.bust {
  background: var(--tint-red);
  color: var(--tint-red-ink);
  border-color: var(--tint-red-ink);
}
.market-sell-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 5px;
}
.market-sell-btn {
  min-height: 36px;
  padding: 3px 4px;
  flex-direction: column;
  gap: 1px;
  font-size: 10px;
}
.market-buy-row {
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1.5px dashed var(--line);
}
.market-buy-hint {
  font-size: 10px;
  font-weight: 800;
  opacity: .8;
  margin-bottom: 5px;
}
.market-buy-btn {
  min-height: 36px;
  padding: 3px 4px;
  flex-direction: column;
  gap: 1px;
  font-size: 10px;
}
.subnav-bar-3, .subnav-bar-4 {
  position: sticky;
  top: -7px;
  z-index: 20;
}
.market-pay-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 10.5px;
  font-weight: 900;
  text-transform: uppercase;
}
.market-pay-row .buy-mode-group { flex: 0 0 auto; }
.market-pay-row .mode-btn { padding: 0 10px; min-width: 0; }
.market-pay-note { font-size: 10.5px; font-weight: 700; line-height: 1.35; opacity: .85; }
.market-pay-dirty .market-buy-btn .num { color: var(--c-dirty); }
.market-trade-row + .market-trade-row { margin-top: 8px; }
.market-row-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; font-size: 10.5px; font-weight: 900; }
.market-row-head b { letter-spacing: .06em; }
.market-row-head .num, .market-row-head span { opacity: .75; font-weight: 800; }
/* === ACTIVE MISSION & DYNAMIC MISSION BOARD === */
.active-mission-box {
  background: var(--p13);
  border: 2px solid var(--line);
  box-shadow: var(--shadow-comic);
  padding: 8px 9px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.mission-cat-pill {
  font-size: 8.5px;
  font-weight: 900;
  text-transform: uppercase;
  padding: 1.5px 5px;
  border: 1px solid rgba(26, 26, 26, 0.65);
  background: var(--bg-paper);
  white-space: nowrap;
  flex-shrink: 0;
}
.mission-cat-pill.cat-smuggle {
  background: var(--p1);
}
.mission-cat-pill.cat-drugs {
  background: var(--tint-green);
}
.mission-cat-pill.cat-fights {
  background: var(--p10);
}
.mission-cat-pill.cat-heist {
  background: var(--p6);
}
.mission-cat-pill.cat-raid {
  background: var(--tint-red);
}
.mission-cat-pill.cat-extort {
  background: var(--p8);
}
.mission-cat-pill.cat-sabotage {
  background: var(--p2);
}
.mission-cat-pill.cat-gamble {
  background: var(--p12);
}
.mission-cat-pill.cat-artheist {
  background: var(--p3);
}
.mission-cat-pill.cat-arms {
  background: var(--p9);
}
.mission-cat-pill.cat-corrupt {
  background: var(--p0);
}
.mission-cat-pill.cat-race {
  background: var(--p11);
}
.mission-io-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  font-size: 10px;
  background: var(--bg-paper);
  border: 1px solid rgba(26, 26, 26, 0.35);
  padding: 4px 6px;
}
.mission-io-col {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.mission-io-col:first-child {
  border-right: 1px dashed rgba(26, 26, 26, 0.3);
  padding-right: 5px;
}
.mission-io-head {
  font-size: 8.5px;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--accent-concrete);
}
.reroll-bar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.unlock-status-box {
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  padding: 5px 8px;
  font-size: 10.5px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
/* === EXPANDED INTERACTIVE HQ BOSS OFFICE === */
@keyframes sirenFlashBlueRed{
      0%, 100% { fill: rgba(30, 90, 220, 0.35); }
      50% { fill: rgba(215, 45, 35, 0.38); }
    }
@keyframes readyLedPulse{
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
.siren-overlay {
  pointer-events: none;
}
.ready-led {
  animation: readyLedPulse 1.1s infinite ease-in-out;
}
.hq-room-card {
  background: var(--bg-panel);
  border: var(--border-comic);
  box-shadow: var(--shadow-comic);
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.hq-top-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10.5px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.office-scene-wrap {
  position: relative;
  width: 100%;
  border: 1.5px solid var(--line);
  background: #CFC6B0;
  overflow: hidden;
}
.office-scene-wrap svg {
  display: block;
  width: 100%;
  height: auto;
}
.svg-hotspot {
  cursor: pointer;
}
.speech-strip {
  background: var(--bg-paper);
  border-left: 3px solid var(--line);
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 700;
  font-style: italic;
  color: var(--text);

/* ===== FX (Effekte) ===== */
#fx-layer{position:fixed;inset:0;pointer-events:none;z-index:900;overflow:hidden}
.fx-p{position:absolute;left:0;top:0;will-change:transform,opacity;opacity:0}
.fx-coin{width:12px;height:12px;border-radius:50%;background:#FFD400;border:2px solid #1A1A1A;box-sizing:border-box}
.fx-coin.d{background:#3FBF8F}
.fx-conf{width:7px;height:12px}
.fx-spark{width:5px;height:5px;border-radius:1px;background:#FFD400}
.fx-flash{position:fixed;inset:0;pointer-events:none;z-index:898;opacity:0}
#fx-vignette{position:fixed;inset:0;pointer-events:none;z-index:899;opacity:0;transition:opacity .3s}
#fx-vignette.on{opacity:1}
#fx-vignette::before,#fx-vignette::after{content:"";position:absolute;inset:0}
#fx-vignette::before{box-shadow:inset 0 0 70px 14px rgba(230,40,40,.55)}
#fx-vignette::after{box-shadow:inset 0 0 70px 14px rgba(40,90,240,.55);opacity:0}
html[data-fx="2"] #fx-vignette.on::before{animation:fxRed .9s linear infinite}
html[data-fx="2"] #fx-vignette.on::after{animation:fxBlue .9s linear infinite}
html[data-fx="0"] #fx-vignette{display:none}
@keyframes fxRed{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes fxBlue{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
html[data-fx="2"] #app-shell.fx-shake{animation:fxShake .38s linear}
@keyframes fxShake{0%,100%{transform:translate(0,0)}15%{transform:translate(-6px,3px)}30%{transform:translate(5px,-3px)}45%{transform:translate(-4px,-2px)}60%{transform:translate(4px,3px)}80%{transform:translate(-2px,1px)}}
html:not([data-fx="0"]) .fx-pulse{animation:fxPulse .3s ease-out}
@keyframes fxPulse{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
html:not([data-fx="0"]) .combo-2{box-shadow:0 0 10px 2px rgba(255,212,0,.75)}
html:not([data-fx="0"]) .combo-4{box-shadow:0 0 16px 4px rgba(255,138,0,.9)}
.sb-tbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#E0453A;transform-origin:left;transform:scaleX(1);transition:transform .12s linear}
.sprint-banner.urgent .sb-time{color:#E0453A}
html[data-fx="2"] .sprint-banner.urgent .sb-time{animation:fxBlink .5s steps(1) infinite}
@keyframes fxBlink{0%{opacity:1}50%{opacity:.25}}
html[data-fx="2"] .sprint-banner.urgent{animation:fxUrg .5s ease-in-out infinite alternate}
@keyframes fxUrg{from{filter:none}to{filter:brightness(1.12) saturate(1.2)}}

.cop{position:absolute;bottom:2px;width:30px;height:14px;left:0;display:none}

@keyframes fxSmoke{0%{transform:translate(0,0) scale(.5);opacity:0}25%{opacity:.8}100%{transform:translate(6px,-16px) scale(1.5);opacity:0}}
html:not([data-fx="0"]) .biz-level-pill.lvl-stamp{animation:fxStamp .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes fxStamp{0%{transform:scale(1.9);opacity:.2}100%{transform:scale(1);opacity:1}}
.fx-paper{width:9px;height:12px;background:#F4EFE0;border:1px solid #1A1A1A;box-sizing:border-box}

@keyframes fxFade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fx-glyph{width:auto;height:auto;font:900 22px/1 system-ui,sans-serif;color:#FFD400;-webkit-text-stroke:1.5px #1A1A1A;paint-order:stroke fill;text-shadow:0 0 6px rgba(255,212,0,.9)}

@keyframes fxEvIn{0%{transform:translateY(-22px) scale(.96);opacity:0;box-shadow:0 0 0 0 rgba(255,212,0,.9)}60%{opacity:1;box-shadow:0 0 0 10px rgba(255,212,0,0)}100%{transform:none;box-shadow:0 0 0 0 rgba(255,212,0,0)}}
.fx-ring{width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid #FFD400;box-sizing:border-box}

/* v40b: Hustle-Wort als Comic-Sprechblase ueber dem kleinen Button; Zahlen weiter oben */
.mini-hustle-btn .mini-hustle-top{text-transform:none;font-size:12px}
.mini-hustle-btn .mini-hustle-val{font-size:12px}
.hustle-bubble{position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);z-index:40;pointer-events:none;
  background:#FBF8F0;color:#1A1A1A;border:2.5px solid #1A1A1A;border-radius:12px;padding:2px 9px;
  font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;line-height:1.25;
  box-shadow:2px 2px 0 #1A1A1A;max-width:86vw}
.hustle-bubble::before,.hustle-bubble::after{content:"";position:absolute;left:50%;border-style:solid;border-color:transparent;transform:translateX(-50%)}
.hustle-bubble::before{top:100%;border-width:9px 7px 0;border-top-color:#1A1A1A;margin-top:0}
.hustle-bubble::after{top:100%;border-width:6px 5px 0;border-top-color:#FBF8F0;margin-top:-1px}
@keyframes bubblePop{0%{transform:translateX(-50%) scale(.86)}60%{transform:translateX(-50%) scale(1.1)}100%{transform:translateX(-50%) scale(1)}}
.mini-hustle-btn.overdrive .hustle-bubble{background:#FFCE3B;color:var(--tint-red-ink)}
.mini-hustle-btn.overdrive .hustle-bubble::after{border-top-color:#FFCE3B}
.mini-hustle-btn .float-popup{top:-112px}
.hustle-bubble{bottom:calc(100% + 58px);opacity:0;transition:opacity .18s}
.hustle-bubble.show{opacity:1}
.hustle-bubble.pl{left:16%}.hustle-bubble.pr{left:84%}
.hustle-bubble.pl::before,.hustle-bubble.pl::after{left:72%}
.hustle-bubble.pr::before,.hustle-bubble.pr::after{left:28%}

/* v40c: Sprechblasen ueberlagern sich und wandern umher */
.hustle-bubble[data-bind]{display:none}
.hustle-bubble.hb-clone{opacity:0;transform:translateX(-50%) rotate(var(--rot,0deg));transition:none;animation:hbLife 1.5s ease-out forwards}
.hustle-bubble.hb-clone::before,.hustle-bubble.hb-clone::after{left:var(--tx,50%)}
.hustle-bubble.hb-od{background:#FFCE3B;color:var(--tint-red-ink)}
.hustle-bubble.hb-od::after{border-top-color:#FFCE3B}
@keyframes hbLife{
  0%{opacity:0;transform:translateX(-50%) rotate(var(--rot,0deg)) scale(.7)}
  10%{opacity:1;transform:translateX(-50%) rotate(var(--rot,0deg)) scale(1.12)}
  20%{transform:translateX(-50%) rotate(var(--rot,0deg)) scale(1)}
  70%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) rotate(var(--rot,0deg)) translateY(-8px) scale(.96)}
}

/* v40d: zackige Sprechblasen */
.hustle-bubble.hb-zack{display:grid;place-items:center;padding:0;border:none;border-radius:0;box-shadow:none;max-width:none;

    function evEffects(str) {
      return String(str).split(/\s*•\s*/).map(p => {
        const m = p.match(/^([+\-−]?)(\d+(?:[.,]\d+)?)\s*(%|s)?\s*(.+)$/);
        if (!m) return `<span class="ev-eff"><b class="num"></b><span><em class="ev-arr"></em>${p}</span></span>`;
        const sign = m[1] === "+" ? "+" : (m[1] ? "−" : "");
        const unit = m[3] || "";
        const heat = /Fahndung|Heat/i.test(m[4]);
        const cls = heat ? "c-heat" : (sign === "−" ? "c-cost" : "c-gain");
        const arrow = heat ? `<em class="ev-arr ${sign === "−" ? "down" : "up"}">${sign === "−" ? "▼" : "▲"}</em>` : "";
        const kind = heat ? (sign === "−" ? "k-heat-down" : "k-heat-up") : (sign === "−" ? "k-cost" : "k-gain");
        return `<span class="ev-eff ${kind}"><b class="num ev-val ${cls}"><span class="ev-n">${sign}${m[2]}</span><span class="ev-u">${unit}</span></b><span>${arrow || '<em class="ev-arr"></em>'}${m[4]}</span></span>`;
      }).join("");

    function formatNumber(val, decimals = 2) {
      if (!Number.isFinite(val)) return "0,00";
      const isEn = (typeof STATE !== "undefined" && STATE.settings && STATE.settings.lang === "EN");
      const decSep = isEn ? "." : ",";
      const sign = val < 0 ? "-" : "";
      const abs = Math.abs(val);
      if (abs < 1000) return sign + abs.toFixed(decimals).replace(".", decSep);
      const suffixes = isEn
        ? [
            { limit: 1e21, label: "Sx" },
            { limit: 1e18, label: "Qi" },
            { limit: 1e15, label: "Qa" },
            { limit: 1e12, label: "T" },
            { limit: 1e9,  label: "B" },
            { limit: 1e6,  label: "M" },
            { limit: 1e3,  label: "K" }
          ]
        : [
            { limit: 1e21, label: "Trd." },
            { limit: 1e18, label: "Trl." },
            { limit: 1e15, label: "Brd." },
            { limit: 1e12, label: "Bio." },
            { limit: 1e9,  label: "Mrd." },
            { limit: 1e6,  label: "Mio." },
            { limit: 1e3,  label: "Tsd." }
          ];
      if (abs >= 1e24) return sign + abs.toExponential(2).replace(".", decSep);
      for (let i = 0; i < suffixes.length; i++) {
        if (abs >= suffixes[i].limit) {
          return sign + (abs / suffixes[i].limit).toFixed(2).replace(".", decSep) + " " + suffixes[i].label;
        }
      }
      return sign + abs.toFixed(decimals).replace(".", decSep);
    }

    const KIEZ_API = {
      _sortedCache: {},

      invalidateCache(collection = null) {
        if (collection) delete this._sortedCache[collection];
        else this._sortedCache = {};
      },

      getSortedCollection(collection) {
        if (this._sortedCache[collection]) return this._sortedCache[collection];
        const col = REGISTRY[collection];
        if (!col) return [];
        const sorted = Object.values(col).sort((a, b) => a.sortOrder - b.sortOrder);
        this._sortedCache[collection] = sorted;
        return sorted;
      },

      reindexCollection(collection) {
        this.invalidateCache(collection);
        const sorted = this.getSortedCollection(collection);
        for (let i = 0; i < sorted.length; i++) sorted[i].sortOrder = (i + 1) * 100;
        this.invalidateCache(collection);
      },

      register(collection, entry, langDe = {}, options = {}) {
        if (!REGISTRY[collection]) return { ok: false, error: `Unbekannte Collection: ${collection}` };
        if (!entry || typeof entry.id !== "string" || !entry.id.trim()) return { ok: false, error: "Ungültige ID" };
        if (REGISTRY[collection][entry.id]) return { ok: false, error: `Doppelte ID: ${entry.id}` };

        const sorted = this.getSortedCollection(collection);
        let prev = null;
        let next = null;

        if (options.afterId) {
          const idx = sorted.findIndex(item => item.id === options.afterId);
          if (idx === -1) return { ok: false, error: `afterId ${options.afterId} nicht gefunden` };
          prev = sorted[idx];
          next = sorted[idx + 1] || null;
        } else if (options.beforeId) {
          const idx = sorted.findIndex(item => item.id === options.beforeId);
          if (idx === -1) return { ok: false, error: `beforeId ${options.beforeId} nicht gefunden` };
          next = sorted[idx];
          prev = sorted[idx - 1] || null;
        } else if (sorted.length > 0) {
          prev = sorted[sorted.length - 1];
        }

        const cloned = Object.assign({}, entry);

        if (collection === "BUSINESSES") {
          cloned.epochId = cloned.epochId || "epoch_block";
          if (!REGISTRY.EPOCHS[cloned.epochId]) return { ok: false, error: `Unbekannte Epoche: ${cloned.epochId}` };
          if (options.autoInterpolateEconomy) {
            if (prev && next) {
              cloned.baseCost = Math.sqrt(prev.baseCost * next.baseCost);
              cloned.baseIncome = Math.sqrt(prev.baseIncome * next.baseIncome);
            } else if (!prev && next) {
              cloned.baseCost = next.baseCost / 4;
              cloned.baseIncome = next.baseIncome / 4;
            } else if (prev && !next) {
              cloned.baseCost = prev.baseCost * 4;

      exportSaveBase64() {
        this.saveGame(false);
        const json = JSON.stringify(STATE, (k, v) => (k === "token" || k === "rcode") ? undefined : v);
        const bytes = new TextEncoder().encode(json);

        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);

      importSaveBase64(b64String, updateTimestamp = false) {
        if (typeof b64String !== "string" || !b64String.trim()) return { ok: false, error: "Leerer Code" };

          const bin = atob(b64String.trim());
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const json = new TextDecoder().decode(bytes);
          const parsed = this.migrateSave(JSON.parse(json));
          if (!this.validateStateObject(parsed)) return { ok: false, error: "Validierung fehlgeschlagen" };
          Engine.applyLoadedState(parsed, false);
          this.saveGame(updateTimestamp);
          return { ok: true };
        } catch (err) {
          return { ok: false, error: String(err) };

      unlockAudio() {

          try { const b = c.createBuffer(1, 1, 22050), sr = c.createBufferSource(); sr.buffer = b; sr.connect(c.destination); sr.start(0); } catch (_) {}

      playTone(type, pitchStep = 0) {
        if (typeof STATE !== "undefined" && !STATE.settings.soundOn) return;
        if (!this.audioCtx || this.audioCtx.state !== "running") return;
        try {
          if (this.SEQ[type]) {
            const seq = this.SEQ[type];
            for (let i = 0; i < seq.length; i++) this._note.apply(this, seq[i]);
            return;
          }
          if (type === "slap") { this._slap(pitchStep, this.audioCtx, this.audioCtx.destination, this.audioCtx.currentTime); return; }
          const now = this.audioCtx.currentTime;
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);

          if (type === "buy") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(520, now + 0.06);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
            osc.start(now);
            osc.stop(now + 0.07);
          } else if (type === "coin") {
            const baseFreq = 580 + Math.min(6, pitchStep) * 75;
            osc.type = "sine";
            osc.frequency.setValueAtTime(baseFreq, now);
            osc.frequency.setValueAtTime(baseFreq * 1.25, now + 0.04);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.start(now);
            osc.stop(now + 0.09);
          } else if (type === "alarm") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(140, now + 0.22);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            osc.start(now);
            osc.stop(now + 0.24);
          }
        } catch (_) {}
      },

      // Ohrfeige / Klatschen: harter, heller Rauschknall mit kurzem Körper. step = Kombo (0-6), 6 = Treffer
      _slap(step, ctx, dest, now) {
        const k = Math.max(0, Math.min(6, step | 0));
        const hard = k >= 6;
        const rate = ctx.sampleRate;
        const noise = (sec, pow) => {
          const len = Math.floor(rate * sec), buf = ctx.createBuffer(1, len, rate), d = buf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, pow);
          return buf;
        };
        const layer = (sec, pow, type, f, q, vol, dec, hpf) => {
          const src = ctx.createBufferSource(); src.buffer = noise(sec, pow);
          const bp = ctx.createBiquadFilter(); bp.type = type; bp.frequency.value = f; bp.Q.value = q;
          const g = ctx.createGain(); g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dec);
          src.connect(bp);
          if (hpf) { const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = hpf; bp.connect(hp); hp.connect(g); } else bp.connect(g);
          g.connect(dest); src.start(now); src.stop(now + sec);
        };
        const jit = 0.9 + Math.random() * 0.2;
        // 1. scharfer Aufprall (hell, sehr kurz)
        layer(0.05, 2, "bandpass", (2900 + k * 120) * jit, 0.55, hard ? 0.26 : 0.18, 0.04, 1300);
        // 2. Klatsch-Körper (mittleres Rauschen, etwas länger)
        layer(0.10, 2.5, "bandpass", 1100 * jit, 0.9, hard ? 0.14 : 0.09, 0.08, 500);
        // 3. nur ein Hauch von Wucht darunter
        const o = ctx.createOscillator(); o.type = "sine";
        o.frequency.setValueAtTime(150 * jit, now); o.frequency.exponentialRampToValueAtTime(70, now + 0.05);
        const g2 = ctx.createGain(); g2.gain.setValueAtTime(hard ? 0.07 : 0.045, now); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        o.connect(g2); g2.connect(dest); o.start(now); o.stop(now + 0.07);
      },

      SEQ: {
        milestone: [[523, 0, 0.12, "triangle", 0.08], [659, 0.07, 0.12, "triangle", 0.08], [784, 0.14, 0.12, "triangle", 0.08], [1047, 0.22, 0.22, "triangle", 0.09]],

      },
      VAULT: { tries: 3, zone: [30, 22, 15], period: [1.7, 1.35, 1.05], amp: 70, mul: [0, 0.5, 1.0, 1.6] },
      vaultOffer() {
        const en = STATE.settings && STATE.settings.lang === "EN";
        this.sprint = { kind: "vault", name: en ? "CRACK THE SAFE" : "TRESOR KNACKEN", goal: 1, clicks: 0, left: 15, offered: true, offerLeft: 20 };
        this.sprintAlert = true;

      vaultAccept() {

      vaultNext() {
        const v = this.vault, V = this.VAULT;

        v.period = V.period[Math.min(v.n, 2)];
      },
      vaultAngle() {
        const v = this.vault; if (!v) return 0;
        return this.VAULT.amp * Math.sin(2 * Math.PI * ((performance.now() - v.t0) / 1000) / v.period);
      },
      vaultStop() {
        const v = this.vault; if (!v || v.done) return null;
        const a = this.vaultAngle();
        const hit = Math.abs(a - v.center) <= v.zoneW / 2;
        v.hits.push(hit); v.n++;

        this.vaultNext();

      vaultFinish() {
        const v = this.vault; if (!v) return null;

        const cash = base * this.VAULT.mul[hits];

        if (hits >= 2) { heat = Math.min(STATE.heat, 6); STATE.heat = Math.max(0, STATE.heat - 6); STATE.stats.sprintWins = (STATE.stats.sprintWins || 0) + 1; }
        if (hits >= 3) { favors = 1; STATE.currencies.favors += 1; STATE.stats.vaultCracks = (STATE.stats.vaultCracks || 0) + 1; }
        const res = { hits, cash, favors, heat };

      sprintGoal(tr) { return Math.max(Math.round(tr.goal * 0.5), tr.goal - this.getPrestigeUpgradeBonuses().sprintSub); },

      sprintAccept(tier) {

      },
      WAR: { warnSec: 180, cdMin: 480, cdMax: 840, occSec: 600, repairFavors: 3, bribeSec: 180, mercFavors: 2, armsCost: 5, boostFrac: 0.35, maxUses: 2 },
      WAR_GANGS: [
        { de: "Die Kellerratten", en: "The Cellar Rats" }, { de: "Clan Demir", en: "Demir Clan" },
        { de: "Rote Hand", en: "Red Hand" }, { de: "Hafenwölfe", en: "Harbor Wolves" },
        { de: "Bahnhofsmafia", en: "Station Mob" }, { de: "Goldene Möwen", en: "Golden Gulls" }
      ],
      warNote: null,
      WEEK_POOL: [
        { k: "totalClicks", n: 800, de: "Tippe %n Mal", en: "Tap %n times", fav: 3, cred: 1 },
        { k: "coupWins", n: 3, de: "Schließe %n Coups ab", en: "Finish %n coups", fav: 3, cred: 2 },
        { k: "sprintWins", n: 3, de: "Gewinne %n Sprints", en: "Win %n sprints", fav: 3, cred: 2 },
        { k: "warWins", n: 1, de: "Verteidige %n Revier", en: "Defend %n turf", fav: 4, cred: 2 },
        { k: "runs", n: 2, de: "Fahre %n Schmuggel-Fahrten", en: "Drive %n smuggling runs", fav: 3, cred: 2 }
      ],
      weekNo() { return Math.floor((SOC.dayNo() + 2) / 7); },
      weekEnsure() {
        const wk = this.weekNo();
        if (STATE.weekly && STATE.weekly.wk === wk) return STATE.weekly;
        const L5 = this.WEEK_POOL.length, skipA = wk % L5, skipB = (wk * 2 + 1) % L5 === skipA ? (skipA + 1) % L5 : (wk * 2 + 1) % L5, base = {}, goals = [];
        this.WEEK_POOL.forEach((g, i) => { base[g.k] = STATE.stats[g.k] || 0; if (i !== skipA && i !== skipB) goals.push({ i, claimed: false }); });
        STATE.weekly = { wk, base, goals, bonus: false };
        return STATE.weekly;
      },
      weekProg(g) { const w = STATE.weekly, p = this.WEEK_POOL[g.i]; return Math.max(0, (STATE.stats[p.k] || 0) - (w.base[p.k] || 0)); },
      weekClaim(idx) {
        const w = this.weekEnsure();
        if (idx === "bonus") {
          if (w.bonus || !w.goals.every(g => g.claimed)) return false;
          w.bonus = true; STATE.currencies.files += 1; STATE.currencies.favors += 5; return true;
        }
        const g = w.goals[idx], p = g && this.WEEK_POOL[g.i];
        if (!g || g.claimed || this.weekProg(g) < p.n) return false;
        g.claimed = true; STATE.currencies.favors += p.fav; STATE.currencies.cred += p.cred; return true;
      },
      weekReady() {
        const w = this.weekEnsure();
        return w.goals.some(g => !g.claimed && this.weekProg(g) >= this.WEEK_POOL[g.i].n) || (!w.bonus && w.goals.every(g => g.claimed));
      },

      turfLv(id) {
        const o = STATE.turfOcc && STATE.turfOcc[id];
        if (o && o > Date.now()) return 0;
        return (STATE.turf[id] && STATE.turf[id].level) || 0;
      },
      turfOccList() {
        const out = [], now = Date.now();
        if (!STATE.turfOcc) return out;
        for (const id in STATE.turfOcc) { if (STATE.turfOcc[id] > now) out.push({ id, left: Math.ceil((STATE.turfOcc[id] - now) / 1000) }); else delete STATE.turfOcc[id]; }
        return out;
      },
      repairTurf(id) {
        if (!STATE.turfOcc || !(STATE.turfOcc[id] > Date.now())) return false;
        if ((STATE.currencies.favors || 0) < this.WAR.repairFavors) return false;
        STATE.currencies.favors -= this.WAR.repairFavors;
        delete STATE.turfOcc[id];

      },
      warDefense() {
        const w = STATE.war;
        if (!w) return 0;
        const b = w.boosts || {};
        return w.def0 + w.atk * this.WAR.boostFrac * ((b.bribe || 0) + (b.merc || 0) + (b.arms || 0));
      },
      warChance() { const w = STATE.war; if (!w) return 0; const d = this.warDefense(); return d / (d + w.atk); },
      warBribeCost() { return Math.max(500, (this.getStats().totalPowerCps || 0) * this.WAR.bribeSec); },
      warSpawn(force) {
        if (STATE.war) return false;
        const owned = KIEZ_API.getSortedCollection("TURF").filter(tf => this.turfLv(tf.id) >= 1);
        if (!owned.length) return false;
        const tf = owned[Math.floor(Math.random() * owned.length)];
        let crew = 0;
        for (const k in STATE.gang) crew += (STATE.gang[k] && STATE.gang[k].level) || 0;
        const def0 = 20 + 12 * this.turfLv(tf.id) + 3 * crew;
        const gi = Math.floor(Math.random() * this.WAR_GANGS.length);
        const atk = def0 * (0.85 + Math.random() * 0.5) * (1 + 0.05 * (STATE.stats.prestigeCount || 0));
        STATE.war = { gang: gi, turf: tf.id, def0, atk, left: this.WAR.warnSec, total: this.WAR.warnSec, boosts: { bribe: 0, merc: 0, arms: 0 } };
        this.warNote = { kind: "arrive" };
        return true;
      },
      warBoost(kind) {
        const w = STATE.war;
        if (!w) return false;
        const W = this.WAR;
        if ((w.boosts[kind] || 0) >= W.maxUses) return false;
        if (kind === "bribe") { const c = this.warBribeCost(); if (STATE.currencies.cash < c) return false; STATE.currencies.cash -= c; }
        else if (kind === "merc") { if (STATE.currencies.favors < W.mercFavors) return false; STATE.currencies.favors -= W.mercFavors; }
        else if (kind === "arms") { if ((STATE.currencies.weapons || 0) < W.armsCost) return false; STATE.currencies.weapons -= W.armsCost; STATE.heat = Math.min(100, STATE.heat + 2); }
        else return false;
        w.boosts[kind] = (w.boosts[kind] || 0) + 1;
        return true;
      },
      warResolve() {
        const w = STATE.war;
        if (!w) return null;
        const win = Math.random() < this.warChance();
        const pw = this.getStats().totalPowerCps || 0;
        const used = (w.boosts.bribe || 0) + (w.boosts.merc || 0) + (w.boosts.arms || 0);
        const res = { win, gang: w.gang, turf: w.turf, used };
        if (win) {
          res.cash = Math.max(500, pw * 300);
          res.favors = 2; res.cred = 1;
          this.addCleanCash(res.cash);
          STATE.currencies.favors += res.favors; STATE.currencies.cred += res.cred;
          STATE.stats.warWins = (STATE.stats.warWins || 0) + 1;
          STATE.heat = Math.min(100, STATE.heat + 3);
        } else {
          const loss = Math.min(Math.max(0, pw * 300), (STATE.currencies.cash || 0) * 0.3);
          res.cash = -loss;
          STATE.currencies.cash = Math.max(0, STATE.currencies.cash - loss);
          if (!STATE.turfOcc) STATE.turfOcc = {};
          STATE.turfOcc[w.turf] = Date.now() + this.WAR.occSec * 1000;
          STATE.stats.warLosses = (STATE.stats.warLosses || 0) + 1;
          STATE.heat = Math.min(100, STATE.heat + 5);
        }
        STATE.war = null;
        STATE.warCd = this.WAR.cdMin + Math.random() * (this.WAR.cdMax - this.WAR.cdMin);
        this.warNote = { kind: "result", res };
        return res;
      },
      warTick(dt) {
        const w = STATE.war;
        if (w) {

          if (w.left <= 0) this.warResolve();

        }
        if (this.getStats().totalPowerCps <= 0 || lifeRev() < GATE.war) return;
        STATE.warCd = (STATE.warCd || 0) - dt;

        if (!this.warSpawn()) STATE.warCd = 120;

      // Banner-Sperre: Es ist immer nur ein Banner/Ereignis gleichzeitig aktiv
      bannerBusy(except) {
        if (except !== "sprint" && this.sprint) return true;
        if (except !== "insp" && STATE.inspector && STATE.inspector.phase !== "still") return true;
        if (except !== "war" && STATE.war) return true;

      },
      inspNote: null,
      INSPECT: { offerSec: 90, tapSec: 12, midGoal: 25, hardGoal: 40, stillSec: 150, finePowerSec: 300, cd: 150 },

      inspectorSpawn() {

      inspectorFine() {

        const sortedOffice = KIEZ_API.getSortedCollection("OFFICE");

          } else {
            const lv = STATE.office[o.id].level;
            STATE.office[o.id].level = Number.isFinite(lv) && lv >= 0 ? Math.min(o.maxLevel, Math.floor(lv)) : 0;
          }
        }

        if (!STATE.trade || typeof STATE.trade !== "object") STATE.trade = {};
        for (const tg of ["drugs", "weapons", "stolen", "tickets"]) {
          const tv = STATE.trade[tg];
          STATE.trade[tg] = Number.isFinite(tv) && tv > 0 ? tv : 0;
        }
        if (!STATE.marketState || typeof STATE.marketState !== "object") {
          STATE.marketState = {
            timer: 45,
            newsKey: "market.news.normal",
            mults: { drugs: 1.0, weapons: 1.0, stolen: 1.0, tickets: 1.0 }
          };
        }
        if (!STATE.marketState.mults || typeof STATE.marketState.mults !== "object") {
          STATE.marketState.mults = { drugs: 1.0, weapons: 1.0, stolen: 1.0, tickets: 1.0 };
        }

        const sortedBiz = KIEZ_API.getSortedCollection("BUSINESSES");
        for (let i = 0; i < sortedBiz.length; i++) {
          const biz = sortedBiz[i];
          if (!STATE.businesses[biz.id] || typeof STATE.businesses[biz.id] !== "object") {
            STATE.businesses[biz.id] = {
              level: 0,
              unlocked: i === 0,
              branch: null,
              branchCooldown: 0,
              milestonesClaimed: 0,
              mode: i % 2 === 1 ? "launder" : "hustle"
            };
          } else {
            const st = STATE.businesses[biz.id];
            st.level = Number.isFinite(st.level) && st.level >= 0 ? Math.floor(st.level) : 0;
            st.unlocked = Boolean(st.unlocked || st.level >= 1 || i === 0);
            st.branch = (st.branch === "A" || st.branch === "B") ? st.branch : null;
            st.branchCooldown = Number.isFinite(st.branchCooldown) && st.branchCooldown > 0 ? st.branchCooldown : 0;
            st.milestonesClaimed = Number.isFinite(st.milestonesClaimed) ? st.milestonesClaimed : 0;
            st.mode = (st.mode === "hustle" || st.mode === "launder") ? st.mode : (i % 2 === 1 ? "launder" : "hustle");
          }
        }

        if (!STATE.managers || typeof STATE.managers !== "object") STATE.managers = {};
        for (const mid of Object.keys(STATE.managers)) {
          const mm = STATE.managers[mid];
          if (!REGISTRY.BUSINESSES[mid] || !mm || typeof mm !== "object" || !mm.hired) { delete STATE.managers[mid]; continue; }
          mm.hired = true;
          mm.target = MANAGER_TARGETS.includes(mm.target) ? mm.target : 0;
        }

        if (!STATE.logistics || typeof STATE.logistics !== "object") STATE.logistics = {};
        const sortedLog = KIEZ_API.getSortedCollection("LOGISTICS");
        for (let i = 0; i < sortedLog.length; i++) {
          const l = sortedLog[i];
          if (!STATE.logistics[l.id] || typeof STATE.logistics[l.id] !== "object") {
            STATE.logistics[l.id] = { level: 0 };
          } else {
            const lv = STATE.logistics[l.id].level;
            STATE.logistics[l.id].level = Number.isFinite(lv) && lv >= 0 ? Math.min(l.maxLevel, Math.floor(lv)) : 0;
          }
        }

        if (!STATE.turf || typeof STATE.turf !== "object") STATE.turf = {};
        const sortedTurf = KIEZ_API.getSortedCollection("TURF");
        for (let i = 0; i < sortedTurf.length; i++) {
          const tf = sortedTurf[i];
          if (!STATE.turf[tf.id] || typeof STATE.turf[tf.id] !== "object") {
            STATE.turf[tf.id] = { level: 0 };
          } else {
            const lv = STATE.turf[tf.id].level;
            STATE.turf[tf.id].level = Number.isFinite(lv) && lv >= 0 ? Math.min(tf.maxLevel, Math.floor(lv)) : 0;
          }
        }

        if (!STATE.gang || typeof STATE.gang !== "object") STATE.gang = {};
        const sortedGang = KIEZ_API.getSortedCollection("GANG");
        for (let i = 0; i < sortedGang.length; i++) {
          const c = sortedGang[i];
          if (!STATE.gang[c.id] || typeof STATE.gang[c.id] !== "object") {
            STATE.gang[c.id] = { level: 0 };
          } else {
            const lv = STATE.gang[c.id].level;
            STATE.gang[c.id].level = Number.isFinite(lv) && lv >= 0 ? Math.min(c.maxLevel, Math.floor(lv)) : 0;
          }
        }

        if (!STATE.items || typeof STATE.items !== "object") STATE.items = {};
        const sortedItems = KIEZ_API.getSortedCollection("ITEMS");
        for (let i = 0; i < sortedItems.length; i++) {
          const item = sortedItems[i];
          if (!STATE.items[item.id] || typeof STATE.items[item.id] !== "object") {
            STATE.items[item.id] = { owned: false };
          } else {
            STATE.items[item.id].owned = Boolean(STATE.items[item.id].owned);
          }
        }

        if (!STATE.board || typeof STATE.board !== "object") STATE.board = {};
        const sortedBoard = KIEZ_API.getSortedCollection("BOARD");
        for (let i = 0; i < sortedBoard.length; i++) {
          const task = sortedBoard[i];
          if (!STATE.board[task.id] || typeof STATE.board[task.id] !== "object") {
            STATE.board[task.id] = { tier: 0 };
          } else {
            const tVal = STATE.board[task.id].tier;
            STATE.board[task.id].tier = Number.isFinite(tVal) && tVal >= 0 ? Math.floor(tVal) : 0;
          }
        }

        if (!STATE.prestigeUpgrades || typeof STATE.prestigeUpgrades !== "object") STATE.prestigeUpgrades = {};
        const sortedPup = KIEZ_API.getSortedCollection("PRESTIGE_UPGRADES");
        for (let i = 0; i < sortedPup.length; i++) {
          const p = sortedPup[i];
          if (!STATE.prestigeUpgrades[p.id] || typeof STATE.prestigeUpgrades[p.id] !== "object") {
            STATE.prestigeUpgrades[p.id] = { level: 0 };
          } else {
            const lv = STATE.prestigeUpgrades[p.id].level;
            STATE.prestigeUpgrades[p.id].level = Number.isFinite(lv) && lv >= 0 ? Math.min(p.maxLevel, Math.floor(lv)) : 0;
          }
        }

        this.ensureMissionBoard();
        this.updateUnlocks();
      },

      getOfficeCost(offId) {
        const o = REGISTRY.OFFICE[offId];
        const st = STATE.office[offId];
        if (!o || !st || st.level >= o.maxLevel) return Infinity;
        return o.baseCost * Math.pow(o.costGrowth, st.level);
      },

      buyOfficeUpgrade(offId) {
        const o = REGISTRY.OFFICE[offId];
        const st = STATE.office[offId];
        if (!o || !st || st.level >= o.maxLevel) return false;
        const cost = this.getOfficeCost(offId);
        if (!Number.isFinite(cost) || STATE.currencies.cash < cost) return false;
        STATE.currencies.cash = Math.max(0, STATE.currencies.cash - cost);
        st.level += 1;
        this.ensureMissionBoard();
        return true;
      },

      offLv(id) {
        const b = STATE.bombs && STATE.bombs[id];
        if (b && b > Date.now()) return 0;
        return (STATE.office[id] && STATE.office[id].level) || 0;
      },
      bombList() {
        const out = [], now = Date.now();
        if (!STATE.bombs) return out;
        for (const id in STATE.bombs) { if (STATE.bombs[id] > now) out.push({ id, left: Math.ceil((STATE.bombs[id] - now) / 1000) }); else delete STATE.bombs[id]; }
        return out;
      },
      applyBomb() {
        if (!STATE.bombs) STATE.bombs = {};
        const ids = Object.keys(REGISTRY.OFFICE).filter(id => ((STATE.office[id] && STATE.office[id].level) || 0) >= 1 && !(STATE.bombs[id] > Date.now()));
        if (!ids.length) return null;
        const id = ids[Math.floor(Math.random() * ids.length)];
        const deskLv = (STATE.office.off_desk && STATE.office.off_desk.level) || 0;
        const sec = Math.max(300, 600 - 60 * deskLv);
        STATE.bombs[id] = Date.now() + sec * 1000;
        return { id, sec };
      },
      repairBomb(id) {
        if (!STATE.bombs || !(STATE.bombs[id] > Date.now())) return false;
        if ((STATE.currencies.favors || 0) < 3) return false;
        STATE.currencies.favors -= 3;
        delete STATE.bombs[id];
        return true;
      },

      getOfficeBonuses() {
        const winLv = Engine.offLv("off_window");
        const deskLv = Engine.offLv("off_desk");
        const radarLv = Engine.offLv("off_radar");
        const vaultLv = Engine.offLv("off_vault");
        const boardLv = Engine.offLv("off_board");
        const espLv = Engine.offLv("off_espresso");

        return {
          officeIncomeMul: 1 + winLv * 0.15,
          offlineHoursAdd: winLv * 2,
          clickMul: 1 + deskLv * 0.25,
          costDiscount: deskLv * 0.03,
          heatDecayBonus: radarLv * 0.08,
          shieldBonusSec: radarLv * 20,
          depotMulAdd: vaultLv * 0.40,
          raidSaveAdd: vaultLv * 0.05,
          missionChanceAdd: boardLv * 0.02,
          missionCloutBonus: boardLv >= 2 ? 1 : 0,
          missionSlots: boardLv >= 3 ? 5 : 4,
          comboDecayBonus: espLv * 0.25,
          favorChanceBonus: espLv * 0.10
        };
      },

      triggerOfficeHotspot(spot) {
        if ((STATE.officeSpotCooldown || 0) > 0) {
          STATE.boss.customQuote = t("office.spot.cd", { sec: Math.ceil(STATE.officeSpotCooldown) });
          return false;
        }
        const stats = this.getStats();
        STATE.officeSpotCooldown = 25;
        if (spot === "vault") {
          const vLv = Math.max(1, Engine.offLv("off_vault"));
          const drop = Math.max(150, stats.totalPowerCps * 12 * vLv);
          this.addDirtyCash(drop, stats.depotCapacity);
          STATE.boss.customQuote = t("office.spot.vault", { val: formatNumber(drop, 0) });
        } else if (spot === "radar") {
          const rLv = Math.max(1, Engine.offLv("off_radar"));
          const cool = 3 + rLv * 1.5;
          STATE.heat = Math.max(0, STATE.heat - cool);
          STATE.boss.customQuote = t("office.spot.radar", { val: formatNumber(cool, 1) });
        } else if (spot === "espresso") {
          STATE.currencies.favors += 1;
          STATE.boss.customQuote = t("office.spot.espresso");
        } else {
          STATE.boss.customQuote = "";
          const quotes = ["ui.boss.quote.1", "ui.boss.quote.2", "ui.boss.quote.3", "ui.boss.quote.4"];
          STATE.boss.quoteKey = quotes[(quotes.indexOf(STATE.boss.quoteKey) + 1) % quotes.length];
        }
        return true;
      },

      isGangUnlocked(cId) {
        const c = REGISTRY.GANG[cId];
        if (!c) return false;
        const st = STATE.gang[cId];
        if (st && st.level >= 1) return true;
        if (!c.reqBizId) return true;
        const reqBiz = STATE.businesses[c.reqBizId];
        return Boolean(reqBiz && reqBiz.level >= (c.reqBizLv || 1));
      },

      getUnlockedMissionCategories() {
        const unlocked = [];
        let nextLocked = null;
        for (let i = 0; i < MISSION_CATEGORY_RULES.length; i++) {
          const r = MISSION_CATEGORY_RULES[i];
          if (r.check()) {
            unlocked.push(r.cat);
          } else if (!nextLocked) {
            nextLocked = r;
          }
        }
        return {
          unlocked,
          total: MISSION_CATEGORY_RULES.length,
          nextLocked
        };
      },

      rollBlackMarketPrices() {
        const scenarios = [
          { key: "market.news.normal",       mults: { drugs: 1.0,  weapons: 1.0,  stolen: 1.0,  tickets: 1.0 } },
          { key: "market.news.drugs_boom",   mults: { drugs: 1.65, weapons: 0.9,  stolen: 1.05, tickets: 0.95 } },
          { key: "market.news.weapons_boom", mults: { drugs: 0.95, weapons: 1.70, stolen: 1.0,  tickets: 0.9 } },
          { key: "market.news.stolen_boom",  mults: { drugs: 1.0,  weapons: 0.95, stolen: 1.65, tickets: 1.05 } },
          { key: "market.news.tickets_boom", mults: { drugs: 1.05, weapons: 0.9,  stolen: 0.95, tickets: 1.60 } },
          { key: "market.news.crackdown",    mults: { drugs: 0.75, weapons: 0.75, stolen: 0.80, tickets: 0.85 } }
        ];
        const pick = scenarios[Math.floor(Math.random() * scenarios.length)];
        const jitter = () => Math.round((0.92 + Math.random() * 0.16) * 100) / 100;
        const prevMults = STATE.marketState && STATE.marketState.mults ? Object.assign({}, STATE.marketState.mults) : null;
        STATE.marketState = {
          timer: 45,
          newsKey: pick.key,
          prev: prevMults,
          mults: {
            drugs: Math.round(pick.mults.drugs * jitter() * 100) / 100,
            weapons: Math.round(pick.mults.weapons * jitter() * 100) / 100,
            stolen: Math.round(pick.mults.stolen * jitter() * 100) / 100,
            tickets: Math.round(pick.mults.tickets * jitter() * 100) / 100
          }
        };
      },

      getMarketUnitPrice(goodKey, statsSnapshot) {
        const s = statsSnapshot || this.getStats();
        const baseScale = Math.max(40, s.totalPowerCps * MARKET_POWER_MUL);
        const typeFactor = { drugs: 1.0, weapons: 1.4, stolen: 2.2, tickets: 1.2 }[goodKey] || 1.0;
        const rateMult = (STATE.marketState && STATE.marketState.mults && STATE.marketState.mults[goodKey]) || 1.0;
        const vesperLv = (STATE.gang.char_vesper && STATE.gang.char_vesper.level) || 0;
        const weberLv = (STATE.gang.char_weber && STATE.gang.char_weber.level) || 0;
        const itemBoni = this.getItemBonuses();
        const sellerBonus = (1 + vesperLv * 0.08 + weberLv * 0.12) * itemBoni.marketBonusMul;
        return baseScale * typeFactor * rateMult * sellerBonus * (1 - this.heatFee());
      },

      getMarketAskPrice(goodKey, statsSnapshot) {
        const fee = this.heatFee();
        return this.getMarketUnitPrice(goodKey, statsSnapshot) * MARKET_BUY_SPREAD * (1 + fee) / (1 - fee);
      },

      getMarketBuyCap() {
        const vLv = (STATE.gang.char_vesper && STATE.gang.char_vesper.level) || 0;
        const wLv = (STATE.gang.char_weber && STATE.gang.char_weber.level) || 0;
        return Math.min(100, MARKET_BUY_CAP + 3 * (vLv + wLv) + 4 * ((STATE.stats && STATE.stats.prestigeCount) || 0));
      },

      getMarketTradeHeld(goodKey) {
        if (!STATE.trade) STATE.trade = { drugs: 0, weapons: 0, stolen: 0, tickets: 0 };
        const stock = Math.floor(STATE.currencies[goodKey] || 0);
        STATE.trade[goodKey] = Math.max(0, Math.min(STATE.trade[goodKey] || 0, stock));
        return STATE.trade[goodKey];
      },

      getMarketBuyRoom(goodKey) {
        return Math.max(0, this.getMarketBuyCap() - this.getMarketTradeHeld(goodKey));
      },

      getMarketLaunderLeft(statsSnapshot) {
        const ms = STATE.marketState;
        if (!ms) return 0;
        if (typeof ms.launderLeft !== "number") {
          const st = statsSnapshot || this.getStats();
          ms.launderLeft = Math.max(60, st.totalPowerCps * MARKET_LAUNDER_SEC);
        }
        return ms.launderLeft;
      },

      getMarketBuyMax(goodKey, statsSnapshot, pay) {
        const stats = statsSnapshot || this.getStats();
        const ask = this.getMarketAskPrice(goodKey, stats);
        const room = this.getMarketBuyRoom(goodKey);
        const cap = this.getMarketBuyCap();
        const held = this.getMarketTradeHeld(goodKey);
        if (!Number.isFinite(ask) || ask <= 0) return { ask: 0, room, units: 0, left: 0, cap, held };
        const dirty = pay === "dirty";
        if (dirty && this.dirtyLocked()) return { ask, room, units: 0, left: 0, cap, held, locked: true };
        const avail = dirty ? (STATE.currencies.dirtyCash || 0) : STATE.currencies.cash;
        let units = Math.min(room, Math.floor(avail / ask));
        const left = dirty ? this.getMarketLaunderLeft(stats) : Infinity;
        if (dirty) units = Math.min(units, Math.floor(left / ask));
        return { ask, room, units: Math.max(0, units), left, cap, held };
      },

      buyContraband(goodKey, qtyMode, withDirty = false) {
        if (["drugs", "weapons", "stolen", "tickets"].indexOf(goodKey) < 0) return false;
        const stats = this.getStats();
        const mx = this.getMarketBuyMax(goodKey, stats, withDirty ? "dirty" : "cash");
        if (mx.ask <= 0) return false;
        const count = qtyMode === "MAX" ? mx.units : (qtyMode === "5" ? 5 : 1);
        if (count < 1 || count > mx.units) return false;
        const cost = mx.ask * count;
        if (withDirty) {
          STATE.currencies.dirtyCash = Math.max(0, (STATE.currencies.dirtyCash || 0) - cost);
          STATE.marketState.launderLeft = Math.max(0, mx.left - cost);
        } else {
          STATE.currencies.cash = Math.max(0, STATE.currencies.cash - cost);
        }
        STATE.currencies[goodKey] = (STATE.currencies[goodKey] || 0) + count;
        STATE.trade[goodKey] = this.getMarketTradeHeld(goodKey) + count;
        return true;
      },

      sellContraband(goodKey, qtyMode, toDirty = false) {
        const stock = Math.floor(STATE.currencies[goodKey] || 0);
        if (stock < 1) return false;
        const count = qtyMode === "ALL" ? stock : (qtyMode === "5" ? 5 : 1);
        if (stock < count) return false;

        const stats = this.getStats();
        const unitPrice = this.getMarketUnitPrice(goodKey, stats);
        STATE.currencies[goodKey] = Math.max(0, (STATE.currencies[goodKey] || 0) - count);
        if (STATE.trade) STATE.trade[goodKey] = Math.max(0, (STATE.trade[goodKey] || 0) - count);

        if (toDirty) {
          this.addDirtyCash(unitPrice * count * 1.35, stats.depotCapacity);
        } else {
          this.addCleanCash(unitPrice * count);
          STATE.heat = Math.min(100, STATE.heat + Math.min(8, 0.8 * Math.sqrt(count)));
        }
        return true;
      },

      swapContrabandForFavors(goodKey) {
        if (goodKey !== "stolen" && goodKey !== "tickets") return false;
        if ((STATE.currencies[goodKey] || 0) < 10) return false;
        STATE.currencies[goodKey] = Math.max(0, STATE.currencies[goodKey] - 10);
        STATE.currencies.favors += 2;
        return true;
      },

      rollRandomOffer(excludeIds = []) {
        const { unlocked } = this.getUnlockedMissionCategories();
        const all = KIEZ_API.getSortedCollection("MISSIONS").filter(m => unlocked.includes(m.cat));
        if (all.length === 0) return null;
        const pool = all.filter(m => !excludeIds.includes(m.id));
        const source = pool.length > 0 ? pool : all;
        const picked = source[Math.floor(Math.random() * source.length)];
        const mult = Math.round((0.8 + Math.random() * 0.65) * 100) / 100;
        const durMult = Math.round((0.85 + Math.random() * 0.35) * 100) / 100;
        return {
          uid: `${picked.id}_${Date.now()}_${Math.floor(Math.random() * 9999)}`,
          misId: picked.id,
          mult,
          durMult
        };
      },

      ensureMissionBoard() {
        if (!Array.isArray(STATE.missionBoard)) STATE.missionBoard = [];
        const { unlocked } = this.getUnlockedMissionCategories();
        const targetSlots = this.getOfficeBonuses().missionSlots;
        STATE.missionBoard = STATE.missionBoard.filter(o => o && REGISTRY.MISSIONS[o.misId] && unlocked.includes(REGISTRY.MISSIONS[o.misId].cat));
        while (STATE.missionBoard.length < targetSlots && unlocked.length > 0) {
          const used = STATE.missionBoard.map(o => o.misId);
          const offer = this.rollRandomOffer(used);
          if (!offer) break;
          STATE.missionBoard.push(offer);
        }
      },

      rerollMissionBoard(useFavor = false) {
        if (useFavor) {
          if (STATE.currencies.favors < 1) return false;
          STATE.currencies.favors -= 1;
        } else {
          if ((STATE.missionRerollTimer || 0) > 0) return false;
          STATE.missionRerollTimer = 60;
        }
        STATE.missionBoard = [];
        this.ensureMissionBoard();
        return true;
      },

      getOfferScaledCosts(offer) {
        const m = REGISTRY.MISSIONS[offer.misId];
        const out = {};
        if (!m) return out;
        const mult = offer.mult || 1;
        for (const [k, v] of Object.entries(m.costObj || {})) {
          if (k === "cleanCashSec" || k === "dirtyCashSec") out[k] = Math.round(v * mult);
          else out[k] = Math.max(1, Math.round(v * mult));
        }
        return out;
      },

      getOfferScaledRewards(offer) {
        const m = REGISTRY.MISSIONS[offer.misId];
        const out = {};
        if (!m) return out;
        const mult = offer.mult || 1;
        const igorLv = (STATE.gang.char_igor && STATE.gang.char_igor.level) || 0;
        const weberLv = (STATE.gang.char_weber && STATE.gang.char_weber.level) || 0;
        const itemBoni = this.getItemBonuses();

        let rewardScale = mult;
        if (m.cat === "drugs") rewardScale *= (1 + igorLv * 0.15 + itemBoni.drugDealBonus);
        if (m.cat === "smuggle") rewardScale *= (1 + weberLv * 0.12);

        for (const [k, v] of Object.entries(m.rewardObj || {})) {
          if (k === "cleanCashSec" || k === "dirtyCashSec") out[k] = Math.round(v * rewardScale);
          else out[k] = Math.max(1, Math.round(v * mult));
        }
        const extraClout = this.getOfficeBonuses().missionCloutBonus;
        if (extraClout > 0) out.cred = (out.cred || 0) + extraClout;
        return out;
      },

      getOfferDurationSec(offer) {
        const m = REGISTRY.MISSIONS[offer.misId];
        if (!m) return 15;
        const logBoni = this.getLogisticsBonuses();
        const itemBoni = this.getItemBonuses();
        const leylaLv = (STATE.gang.char_logistik && STATE.gang.char_logistik.level) || 0;
        const tarekLv = (STATE.gang.char_tarek && STATE.gang.char_tarek.level) || 0;
        const hackerLv = (STATE.gang.char_nullbyte && STATE.gang.char_nullbyte.level) || 0;
        const speedFactor = Math.max(0.40, 1 - leylaLv * 0.03 - tarekLv * 0.04 - hackerLv * 0.04 - (logBoni.missionSpeedPct / 100) - itemBoni.missionSpeedAdd);
        return Math.max(5, Math.round(m.durationSec * (offer.durMult || 1) * speedFactor));
      },

      getMissionCrewHint(misId) {
        const m = REGISTRY.MISSIONS[misId];
        if (!m) return "";
        const isEn = STATE.settings.lang === "EN";
        const hints = [];
        const tarekLv = (STATE.gang.char_tarek && STATE.gang.char_tarek.level) || 0;
        const hackerLv = (STATE.gang.char_nullbyte && STATE.gang.char_nullbyte.level) || 0;
        const vitoLv = (STATE.gang.char_vito && STATE.gang.char_vito.level) || 0;
        const kalleLv = (STATE.gang.char_kalle && STATE.gang.char_kalle.level) || 0;
        const igorLv = (STATE.gang.char_igor && STATE.gang.char_igor.level) || 0;
        const weberLv = (STATE.gang.char_weber && STATE.gang.char_weber.level) || 0;
        const pawelLv = (STATE.gang.char_pawel && STATE.gang.char_pawel.level) || 0;

        if ((m.cat === "race" || m.cat === "heist") && tarekLv > 0) hints.push(`Tarek: +${tarekLv * 2}%`);
        if ((m.cat === "heist" || m.cat === "sabotage") && hackerLv > 0) hints.push(`NullByte: +${hackerLv * 4}%`);
        if ((m.cat === "fights" || m.cat === "gamble") && vitoLv > 0) hints.push(`Vito: +${Math.round(vitoLv * 2.5)}%`);
        if ((m.cat === "fights" || m.cat === "raid") && kalleLv > 0) hints.push(`Kalle: +${kalleLv * 4}%`);
        if (m.cat === "drugs" && igorLv > 0) hints.push(`Igor: +${igorLv * 15}% ${isEn ? "Loot" : "Beute"}`);
        if (m.cat === "smuggle" && weberLv > 0) hints.push(`Weber: +${weberLv * 12}% ${isEn ? "Loot" : "Beute"}`);
        if ((m.cat === "heist" || m.cat === "sabotage") && pawelLv > 0) hints.push(`Pawel: +${pawelLv * 5}%`);
        return hints.join(" • ");
      },

      getMissionEffectiveChance(misId) {
        const m = REGISTRY.MISSIONS[misId];
        if (!m) return 0;
        const borisLv = (STATE.gang.char_inkasso && STATE.gang.char_inkasso.level) || 0;
        const leylaLv = (STATE.gang.char_logistik && STATE.gang.char_logistik.level) || 0;
        const tarekLv = (STATE.gang.char_tarek && STATE.gang.char_tarek.level) || 0;
        const vitoLv = (STATE.gang.char_vito && STATE.gang.char_vito.level) || 0;
        const kalleLv = (STATE.gang.char_kalle && STATE.gang.char_kalle.level) || 0;
        const hackerLv = (STATE.gang.char_nullbyte && STATE.gang.char_nullbyte.level) || 0;
        const pawelLv = (STATE.gang.char_pawel && STATE.gang.char_pawel.level) || 0;
        const logBoni = this.getLogisticsBonuses();
        const turfBoni = this.getTurfBonuses();
        const itemBoni = this.getItemBonuses();
        const offBoni = this.getOfficeBonuses();

        let bonus = borisLv * 0.015 + logBoni.missionChanceAdd + turfBoni.missionChanceAdd + offBoni.missionChanceAdd + itemBoni.globalMissionChanceAdd + this.getPrestigeUpgradeBonuses().coupAdd;
        if (m.cat === "smuggle") bonus += leylaLv * 0.015;
        if (m.cat === "race" || m.cat === "heist") bonus += tarekLv * 0.02 + (m.cat === "race" ? itemBoni.raceChanceAdd : 0);
        if (m.cat === "fights" || m.cat === "gamble") bonus += vitoLv * 0.025;
        if (m.cat === "fights" || m.cat === "raid") bonus += kalleLv * 0.04;
        if (m.cat === "heist" || m.cat === "sabotage") bonus += hackerLv * 0.04 + pawelLv * 0.05;
        if (m.cat === "raid" || m.cat === "heist") bonus += itemBoni.raidChanceAdd;
        if (m.cat === "raid" || m.cat === "sabotage") bonus += itemBoni.sniperChanceAdd;
        return Math.min(0.98, (m.baseChance + bonus) * (1 - this.heatCoupMalus()));
      },

      getMissionEffectiveHeat(misId) {
        const m = REGISTRY.MISSIONS[misId];
        if (!m) return 0;
        if (m.heatRisk < 0) return m.heatRisk;
        const nowakLv = (STATE.gang.char_schmiergeld && STATE.gang.char_schmiergeld.level) || 0;
        const pawelLv = (STATE.gang.char_pawel && STATE.gang.char_pawel.level) || 0;
        const itemBoni = this.getItemBonuses();
        const factor = Math.max(0.4, (1 - nowakLv * 0.04 + pawelLv * 0.05) * itemBoni.missionHeatFactor);
        return Math.max(1, Math.round(m.heatRisk * factor * 10) / 10);
      },

      resolveMissionBundle(bundleObj, statsSnapshot) {
        const s = statsSnapshot || this.getStats();
        const power = Math.max(10, s.totalPowerCps);
        const out = {};
        for (const [k, v] of Object.entries(bundleObj || {})) {
          if (k === "cleanCashSec") out.cash = Math.max(50, power * v);
          else if (k === "dirtyCashSec") out.dirtyCash = Math.max(50, power * v);
          else out[k] = v;
        }
        return out;
      },

      formatMissionBundle(bundleObj, statsSnapshot) {
        const resolved = this.resolveMissionBundle(bundleObj, statsSnapshot);
        const labels = {
          cash: "€",
          dirtyCash: `€ (${t("biz.buy.dirty")})`,
          cred: t("ui.curr.cred"),
          favors: t("ui.curr.favors"),
          drugs: t("ui.curr.drugs"),
          weapons: t("ui.curr.weapons"),
          stolen: t("ui.curr.stolen"),
          tickets: t("ui.curr.tickets")
        };
        const parts = [];
        for (const [k, val] of Object.entries(resolved)) {
          parts.push(`${formatNumber(val, 0)} ${labels[k] || k}`);
        }
        return parts.join(" • ") || "—";
      },

      canStartOffer(offer, statsSnapshot) {
        if (STATE.activeMission || STATE.pendingBribe || !offer) return false;
        const m = REGISTRY.MISSIONS[offer.misId];
        if (!m) return false;
        const costs = this.resolveMissionBundle(this.getOfferScaledCosts(offer), statsSnapshot);
        for (const [k, val] of Object.entries(costs)) {
          if (k === "dirtyCash" && this.dirtyLocked()) return false;
          if ((STATE.currencies[k] || 0) < val) return false;
        }
        return true;
      },

      startMissionOffer(slotIndex) {
        const offer = STATE.missionBoard[slotIndex];
        const stats = this.getStats();
        if (!offer || !this.canStartOffer(offer, stats)) return false;
        const scaledCosts = this.getOfferScaledCosts(offer);
        const scaledRewards = this.getOfferScaledRewards(offer);
        const costs = this.resolveMissionBundle(scaledCosts, stats);
        for (const [k, val] of Object.entries(costs)) {
          STATE.currencies[k] = Math.max(0, (STATE.currencies[k] || 0) - val);
        }
        const dur = this.getOfferDurationSec(offer);
        STATE.activeMission = {
          id: offer.misId,
          remainingSec: dur,
          totalSec: dur,
          chance: this.getMissionEffectiveChance(offer.misId),
          heatRisk: this.getMissionEffectiveHeat(offer.misId),
          rewardObj: scaledRewards
        };
        STATE.missionLog = null;
        STATE.missionBoard.splice(slotIndex, 1);
        this.ensureMissionBoard();
        return true;
      },

      abortMission() {
        if (!STATE.activeMission) return false;
        STATE.activeMission = null;
        return true;
      },

      grantMissionLoot(misObj) {
        const m = REGISTRY.MISSIONS[misObj.id];
        if (!m) return;
        const stats = this.getStats();
        const rewardBundle = misObj.rewardObj || m.rewardObj;
        STATE.heat = Math.min(100, Math.max(0, STATE.heat + misObj.heatRisk));
        const rewards = this.resolveMissionBundle(rewardBundle, stats);
        for (const [k, val] of Object.entries(rewards)) {
          if (k === "cash") this.addCleanCash(val * 0.6);
          else if (k === "dirtyCash") this.addDirtyCash(val * 0.6, stats.depotCapacity);
          else STATE.currencies[k] = (STATE.currencies[k] || 0) + val;
        }
        return this.formatMissionBundle(rewardBundle, stats);
      },

      claimMissionResult() {
        const am = STATE.activeMission;
        if (!am || am.remainingSec > 0) return { ok: false };
        const m = REGISTRY.MISSIONS[am.id];
        STATE.activeMission = null;
        if (!m) return { ok: false };

        const won = Math.random() <= am.chance;
        if (won) {
          const lootStr = this.grantMissionLoot(am);
          STATE.stats.coupWins = (STATE.stats.coupWins || 0) + 1;
          STATE.missionLog = { won: true, text: `${t("mis.result.win", { name: t(m.nameKey) })} (+${lootStr})` };
          return { ok: true, won: true };
        }

        // Second-Chance Emergency Bribe if player has >= 1 Favor
        if ((STATE.currencies.favors || 0) >= 1) {
          STATE.pendingBribe = {
            id: am.id,
            heatRisk: am.heatRisk,
            rewardObj: am.rewardObj
          };
          return { ok: true, won: false, bribeOffered: true };
        }

        const failHeat = Math.max(4, Math.abs(am.heatRisk));
        STATE.heat = Math.min(100, STATE.heat + failHeat);
        STATE.missionLog = { won: false, text: `${t("mis.result.fail", { name: t(m.nameKey) })} (+${failHeat}% ${t("ui.heat.prefix")})` };
        return { ok: true, won: false };
      },

      resolvePendingBribe(payBribe) {
        const pb = STATE.pendingBribe;
        if (!pb) return false;
        const m = REGISTRY.MISSIONS[pb.id];
        STATE.pendingBribe = null;
        if (!m) return false;

        if (payBribe && (STATE.currencies.favors || 0) >= 1) {
          STATE.currencies.favors -= 1;
          const lootStr = this.grantMissionLoot(pb);
          STATE.stats.coupWins = (STATE.stats.coupWins || 0) + 1;
          STATE.missionLog = { won: true, text: `${t("mis.bribe.saved", { name: t(m.nameKey) })} (+${lootStr})` };
          return true;
        }

        const failHeat = Math.max(4, Math.abs(pb.heatRisk));
        STATE.heat = Math.min(100, STATE.heat + failHeat);
        STATE.missionLog = { won: false, text: `${t("mis.result.fail", { name: t(m.nameKey) })} (+${failHeat}% ${t("ui.heat.prefix")})` };
        return true;
      },
