<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>Diagnose</title>
<style>
html{background:#e00;height:100%}
body{margin:0;background:#06c;height:100dvh;overflow:hidden;font:15px/1.35 monospace;color:#fff}
#a{position:fixed;left:0;top:0;width:25%;height:100vh;background:#0a0}
#b{position:fixed;right:0;top:0;width:25%;height:100lvh;background:#fa0}
#c{position:fixed;left:25%;top:0;width:25%;height:100svh;background:#a0a}
#d{position:fixed;left:50%;top:0;width:25%;bottom:0;background:#0cc}
#t{position:relative;z-index:5;padding:env(safe-area-inset-top) 10px 0;text-shadow:0 0 3px #000}
.probe{position:fixed;visibility:hidden;left:0;top:0}
</style></head><body>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div>
<div class="probe" id="pdvh" style="height:100dvh"></div><div class="probe" id="pvh" style="height:100vh"></div>
<div class="probe" id="plvh" style="height:100lvh"></div><div class="probe" id="psvh" style="height:100svh"></div>
<div class="probe" id="pt" style="height:env(safe-area-inset-top)"></div><div class="probe" id="pb" style="height:env(safe-area-inset-bottom)"></div>
<div id="t"><b>DIAGNOSE Hustlers</b><br>Bitte Screenshot senden.<br>Farben: rot=html, blau=body, gruen=100vh, orange=100lvh, lila=100svh, tuerkis=bottom:0<br><pre id="o"></pre></div>
<script>
function r(){var g=function(i){return document.getElementById(i).getBoundingClientRect().height};
var s=[];s.push("standalone: "+(navigator.standalone===true)+" / mq "+matchMedia("(display-mode: standalone)").matches);
s.push("inner: "+innerWidth+"x"+innerHeight);s.push("outer: "+outerWidth+"x"+outerHeight);
s.push("screen: "+screen.width+"x"+screen.height+" avail "+screen.availHeight);
s.push("visualVP: "+(visualViewport?visualViewport.width+"x"+visualViewport.height+" off "+visualViewport.offsetTop:"-"));
s.push("clientH html: "+document.documentElement.clientHeight);
s.push("dvh "+g("pdvh")+" vh "+g("pvh")+" lvh "+g("plvh")+" svh "+g("psvh"));
s.push("safe top "+g("pt")+" bottom "+g("pb"));s.push("dpr "+devicePixelRatio+" ua "+navigator.userAgent.slice(-40));
document.getElementById("o").textContent=s.join("\n")}
r();addEventListener("resize",r);setTimeout(r,500);
</script></body></html>
